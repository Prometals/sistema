<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estoque · Operador · Prometals</title>
<link rel="stylesheet" href="css/tema.css">
<link rel="stylesheet" href="css/sistema.css">
<style>
/* ---------- específico desta página (mockup-estoque aprovado) ---------- */
.est { display: grid; grid-template-columns: 1fr 380px; gap: 14px; align-items: start; }
.est > * { min-width: 0; }
.acoes3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; }
.ac { border-radius: 14px; border: 1px solid var(--linha); background: var(--painel); padding: 14px 16px; display: flex; align-items: center; gap: 14px; cursor: pointer; text-align: left; font: inherit; color: inherit; }
.ac .ic { width: 46px; height: 46px; border-radius: 12px; display: grid; place-items: center; background: color-mix(in srgb, var(--c) 18%, transparent); color: var(--c); flex: none; }
.ac .ic svg { width: 24px; height: 24px; }
.ac b { display: block; font-size: 15px; } .ac small { font-size: 12px; color: var(--texto-suave); }
.ac.on { border-color: var(--c); box-shadow: 0 0 0 1px var(--c) inset; }
.bx { background: var(--painel); border: 1px solid var(--linha); border-radius: 14px; }
.bx-cab { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--linha); }
.bx-cab h3 { margin: 0; font-size: 15px; } .bx-cab .s { font-size: 12px; color: var(--texto-suave); } .bx-cab .dir { margin-left: auto; }
.voltar { width: 34px; height: 34px; border-radius: 9px; border: 1px solid var(--borda); background: var(--painel-2); display: grid; place-items: center; flex: none; cursor: pointer; }
.op-busca { display: grid; grid-template-columns: 200px 1fr; gap: 14px; padding: 14px 16px; align-items: center; border-bottom: 1px solid var(--linha); }
.op-busca input { height: 50px; font-size: 22px; font-weight: 800; text-align: center; letter-spacing: 2px; }
.op-inf { display: grid; grid-template-columns: repeat(4, auto); gap: 4px 22px; font-size: 12px; color: var(--texto-suave); justify-content: start; }
.op-inf b { display: block; font-size: 13.5px; color: var(--texto); }
.op-inf.msg { display: block; font-size: 13px; }
.op-inf .err { color: var(--erro); font-weight: 700; }
.proc { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 800; padding: 3px 9px; border-radius: 999px; background: var(--painel-2); color: var(--texto); }
.proc::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #f59e0b; }
.itm { display: grid; grid-template-columns: 1.6fr repeat(3, 90px) 150px; gap: 12px; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--linha); }
.itm.h { font-size: 10.5px; font-weight: 800; color: var(--texto-suave); letter-spacing: .5px; padding-top: 10px; padding-bottom: 10px; }
.itm .n { text-align: right; font-variant-numeric: tabular-nums; }
.itm .nome b { font-size: 13.5px; } .itm .nome small { display: block; font-size: 11.5px; color: var(--texto-suave); }
.itm .extra { grid-column: 1 / -1; display: grid; gap: 6px; }
.itm .extra:empty { display: none; }
.itm .extra input { height: 42px; font-size: 14px; }
.itm .extra input.falta-motivo { border: 1px dashed #dc2626; background: rgba(220,38,38,.07); }
.itm.erro-saldo { box-shadow: inset 3px 0 0 #dc2626; }
.itm.acima { box-shadow: inset 3px 0 0 #eab308; }
.aviso-l { font-size: 12px; font-weight: 700; color: #eab308; } html.tema-claro .aviso-l { color: #92400e; }
.erro-l { font-size: 12px; font-weight: 700; color: #f87171; } html.tema-claro .erro-l { color: #b91c1c; }
.cat { font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 5px; margin-right: 6px; background: var(--painel-2); color: var(--texto-suave); }
.cat.luva { background: rgba(59,130,246,.18); color: #93c5fd; } .cat.filtro { background: rgba(20,184,166,.18); color: #5eead4; } .cat.emb { background: rgba(240,122,31,.18); color: #fdba74; }
html.tema-claro .cat.luva { color: #1d4ed8; } html.tema-claro .cat.filtro { color: #0f766e; } html.tema-claro .cat.emb { color: #9a3412; }
.passo { display: inline-flex; align-items: center; border: 1px solid var(--destaque); border-radius: 10px; overflow: hidden; height: 42px; width: 150px; background: var(--painel-2); }
.passo button { width: 42px; height: 100%; border: 0; background: transparent; font-size: 20px; font-weight: 800; color: var(--texto-suave); cursor: pointer; flex: none; }
.passo input { flex: 1; min-width: 0; height: 100%; border: 0; border-radius: 0; text-align: center; padding: 0; font-weight: 800; font-size: 17px; color: var(--destaque); background: transparent; }
.passo input:focus { outline: none; }
.passo.off { border-color: var(--borda); opacity: .55; } .passo.off input { color: var(--texto-suave); } .passo.off button { cursor: not-allowed; }
.passo.grande { width: 100%; max-width: 320px; height: 52px; }
.falta { color: #f87171; font-weight: 800; } html.tema-claro .falta { color: #b91c1c; }
.aviso-emb { margin: 12px 16px; padding: 9px 12px; border-radius: 10px; background: rgba(240,122,31,.1); border: 1px dashed rgba(240,122,31,.5); font-size: 12px; color: var(--texto-suave); line-height: 1.5; }
.aviso-emb b { color: var(--destaque); }
.conf { display: flex; gap: 10px; padding: 14px 16px; align-items: center; }
.conf .t { font-size: 12.5px; color: var(--texto-suave); } .conf .t b { color: var(--texto); }
.conf .btn2 { margin-left: auto; height: 46px; padding: 0 22px; font-size: 14px; flex: none; }
.btn2.baixa { background: #16a34a; border-color: #16a34a; color: #fff; }
.btn2.baixa:disabled { opacity: .45; cursor: not-allowed; }
.leitura { margin: 12px 16px; }
.vazio-f { padding: 22px 16px; color: var(--texto-suave); font-size: 13px; text-align: center; }
/* formulários sem OP / devolução */
.fs { padding: 14px 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
.fc { display: grid; gap: 6px; font-size: 11px; font-weight: 800; color: var(--texto-suave); letter-spacing: .4px; align-content: start; }
.fc.l { grid-column: 1 / -1; }
.fc input, .fc select { height: 46px; font-size: 15px; padding: 0 12px; }
.fc small { font-weight: 600; letter-spacing: 0; font-size: 11.5px; }
.pick { position: relative; }
.sug { display: grid; gap: 4px; margin-top: 6px; }
.sg { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; padding: 10px 12px; min-height: 46px; border-radius: 10px; border: 1px solid var(--linha); background: var(--painel-2); color: var(--texto); font: inherit; font-size: 13px; cursor: pointer; }
.sg:hover { border-color: var(--destaque); }
.sg .d { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--texto-suave); font-weight: 500; }
.sg .sl { font-size: 12px; color: var(--texto-suave); white-space: nowrap; }
.ins-sel { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--destaque); background: color-mix(in srgb, var(--destaque) 8%, var(--painel)); font-size: 13px; color: var(--texto); font-weight: 600; }
.ins-sel .d { flex: 1; min-width: 0; }
.ins-sel .d small { display: block; color: var(--texto-suave); font-weight: 500; font-size: 12px; }
.ins-sel button { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--borda); background: var(--painel-2); display: grid; place-items: center; cursor: pointer; flex: none; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chips button { min-height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--borda); background: var(--painel-2); color: var(--texto); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
.chips button.on { border-color: var(--destaque); background: color-mix(in srgb, var(--destaque) 16%, var(--painel)); color: var(--texto); box-shadow: 0 0 0 1px var(--destaque) inset; }
.chips button small { display: block; font-size: 11px; font-weight: 600; color: var(--texto-suave); }
.chips.op button { text-align: left; padding: 6px 12px; }
/* lateral */
.lado { display: flex; flex-direction: column; gap: 14px; }
.pend { padding: 6px 0; }
.pd { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; padding: 9px 16px; border-bottom: 1px solid var(--linha); font-size: 12.5px; }
.pd:last-child { border-bottom: 0; }
.pd.pronto { cursor: pointer; } .pd.pronto:hover { background: var(--hover); }
.pd b { font-size: 13px; } .pd small { color: var(--texto-suave); font-size: 11.5px; } .pd .st { grid-row: 1 / span 2; grid-column: 2; align-self: center; font-size: 10.5px; font-weight: 800; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
.st.chegou { background: rgba(34,197,94,.15); color: #34d399; } .st.comprar { background: rgba(234,179,8,.18); color: #eab308; }
html.tema-claro .st.chegou { color: #166534; } html.tema-claro .st.comprar { color: #92400e; }
.mv { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 9px 16px; border-bottom: 1px solid var(--linha); font-size: 12.5px; }
.mv .h { color: var(--texto-suave); font-size: 11.5px; } .mv small { display: block; color: var(--texto-suave); font-size: 11.5px; overflow-wrap: anywhere; }
.mv .q { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; } .mv .q.s { color: #f87171; } .mv .q.e { color: #34d399; }
html.tema-claro .mv .q.s { color: #b91c1c; } html.tema-claro .mv .q.e { color: #166534; }
.mv.estornado > span:nth-child(2) > span, .mv.estornado .q { text-decoration: line-through; opacity: .6; }
.mv .tg { font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 5px; background: var(--painel-2); color: var(--texto-suave); margin-left: 4px; text-decoration: none; display: inline-block; }
.mv-rod { padding: 9px 16px; font-size: 11.5px; color: var(--texto-suave); display: flex; justify-content: space-between; gap: 10px; }
.mv-rod button { color: var(--destaque); font-weight: 700; background: none; border: 0; padding: 0; font: inherit; font-weight: 700; cursor: pointer; }
/* janela de estorno */
.est-lista { display: grid; gap: 6px; max-height: 300px; overflow: auto; margin-bottom: 12px; }
.est-lista label { display: flex; gap: 10px; align-items: center; padding: 9px 10px; border: 1px solid var(--linha); border-radius: 9px; cursor: pointer; font-size: 13px; }
.est-lista label small { display: block; color: var(--texto-suave); font-size: 11.5px; }
.est-lista input { width: 18px; height: 18px; flex: none; accent-color: var(--destaque); }
.est-lista .q { margin-left: auto; font-weight: 800; }
.campo-e { display: grid; gap: 5px; font-size: 11px; font-weight: 800; color: var(--texto-suave); letter-spacing: .4px; margin-bottom: 10px; }
.campo-e input { height: 42px; padding: 0 12px; font-size: 14px; }

@media (max-width: 1200px) { .est { grid-template-columns: 1fr; } .itm { grid-template-columns: 1.4fr repeat(3, 70px) 150px; } }
/* celular: tela inicial (3 ações + listas) e tela do formulário */
@media (max-width: 760px) {
  .acoes3 { grid-template-columns: 1fr; gap: 10px; } .ac { padding: 16px; } .ac .ic { width: 52px; height: 52px; }
  .op-busca { grid-template-columns: 1fr; } .op-inf { grid-template-columns: 1fr 1fr; }
  .itm.h { display: none; }
  .itm { grid-template-columns: 1fr 1fr 1fr; gap: 6px 10px; }
  .itm .nome { grid-column: 1 / -1; } .itm .n { text-align: left; font-size: 12px; } .itm .n::before { content: attr(data-l); display: block; font-size: 10px; color: var(--texto-suave); font-weight: 800; }
  .itm .pc { grid-column: 1 / -1; } .itm .pc .passo { width: 100%; height: 50px; }
  .passo button { width: 56px; }
  .fs { grid-template-columns: 1fr; }
  .passo.grande { max-width: none; }
  .conf { flex-wrap: wrap; position: sticky; bottom: 0; background: var(--painel); border-top: 1px solid var(--linha); border-radius: 0 0 14px 14px; }
  .conf .btn2 { width: 100%; margin: 0; justify-content: center; height: 52px; }
  body.t-inicio .form-op { display: none; } body:not(.t-inicio) .acoes3, body:not(.t-inicio) .lado { display: none; }
  .lado { order: 2; }
}
</style>
</head>
<body>

<!-- Estoque · Operador (almoxarifado) — mobile-first.
     3 ações: Retirada com OP (estrutura da OP, "retirar agora" já
     preenchido com o que falta), Retirada sem OP (insumo, qtd, setor,
     motivo) e Devolução. Regras do backend (30_Estoque.gs):
     saída maior que o saldo = bloqueada; acima do previsto = só com
     motivo; embalagem só na Inspeção Final; estorno dos próprios
     lançamentos (Admin: qualquer um). -->
<main class="conteudo">
  <div class="tit-pagina">
    <div><h1>Estoque · Operador</h1><p>Retirada e devolução de luva, filtro e embalagem</p></div>
  </div>

  <div class="acoes3">
    <button class="ac" data-acao="op" style="--c:#f07a1f"><span class="ic"><svg class="i"><use href="#i-saida"/></svg></span><span><b>Retirada com OP</b><small>baixa pela estrutura da OP</small></span></button>
    <button class="ac" data-acao="semop" style="--c:#3b82f6"><span class="ic"><svg class="i"><use href="#i-pacote"/></svg></span><span><b>Retirada sem OP</b><small>manutenção, teste, outro setor</small></span></button>
    <button class="ac" data-acao="dev" style="--c:#16a34a"><span class="ic"><svg class="i"><use href="#i-volta"/></svg></span><span><b>Devolução</b><small>sobrou, volta para o estoque</small></span></button>
  </div>

  <div class="est">
    <section class="bx form-op" id="form">
      <div class="bx-cab">
        <button class="voltar so-mob" id="bt-voltar" title="Voltar"><svg class="i"><use href="#i-volta"/></svg></button>
        <h3 id="f-tit">Retirada com OP</h3><span class="s" id="f-sub"></span>
      </div>
      <div id="f-corpo"></div>
    </section>

    <aside class="lado">
      <div class="bx">
        <div class="bx-cab"><h3>Embalagens para baixar</h3><span class="s">OPs na Inspeção Final</span></div>
        <div class="pend" id="embalagens"><div class="carregando">Carregando…</div></div>
      </div>
      <div class="bx">
        <div class="bx-cab"><h3>Meus movimentos de hoje</h3></div>
        <div id="movimentos"><div class="carregando">Carregando…</div></div>
      </div>
    </aside>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/icones.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/sessao.js"></script>
<script src="js/shell.js"></script>
<script>
Sessao.iniciarPagina('estoque').then(function (ctx) {
  const $ = function (s) { return document.querySelector(s); };
  const e = Ui.esc;
  const mob = function () { return window.innerWidth <= 760; };

  // Quem pode estornar: EDITAR em Estoque ou em Compras (regra do backend)
  const podeEstornar = ctx.podeEditar || ctx.nivelDe('compras') === 'EDITAR';

  let acao = 'op';              // op | semop | dev
  let insumos = [];             // cadastro com saldo (para sem OP / devolução)
  let setores = [];
  let estrutura = null;         // resposta de estruturaOP (retirada com OP)
  let qtd = {}, motivo = {};    // o que o operador digitou, por insumo
  let semop = { ins: null, qtd: 1, setor: '', motivo: '' };
  let dev = { op: '', estr: null, avisoOp: '', ins: null, qtd: 1, motivo: '' };
  let movs = [];
  let enviando = false;
  let seqOP = 0;                // descarta respostas antigas da busca da OP
  const pendente = {};          // idReq reaproveitado se o MESMO envio falhar e for repetido

  // No celular começa pela tela das 3 ações
  if (mob()) document.body.classList.add('t-inicio');

  carregarListas();
  carregarInsumos();
  Api.chamar('setoresEstoque', {}).then(function (s) { setores = s || []; if (acao === 'semop') desenharForm(); }).catch(function () {});
  desenharForm();
  // Listas da lateral: atualiza a cada 60 s (sem mexer no que está sendo digitado)
  setInterval(function () { if (!document.hidden && !document.querySelector('.modal-fundo')) carregarListas(true); }, 60000);

  // ---------- Números (aceita vírgula) ----------
  function num(v) {
    let t = String(v === undefined || v === null ? '' : v).trim();
    if (!t) return 0;
    if (t.indexOf(',') !== -1) t = t.replace(/\./g, '').replace(',', '.');
    const n = Number(t);
    return isNaN(n) ? NaN : Math.round(n * 1000) / 1000;
  }
  const mostrar = function (n) { return String(n).replace('.', ','); };
  function catClasse(c) { return { LUVA: 'luva', FILTRO: 'filtro', EMBALAGEM: 'emb' }[c] || ''; }
  function nomeQtd(it, n) {
    const nomes = { LUVA: ['luva', 'luvas'], FILTRO: ['filtro', 'filtros'], EMBALAGEM: ['caixa', 'caixas'] }[it.categoria];
    return '<b>' + e(Fmt.num(n)) + ' ' + (nomes ? nomes[n === 1 ? 0 : 1] : e(String(it.unidade || '').toLowerCase()) + ' de ' + e(it.cod_insumo)) + '</b>';
  }
  function juntar(partes) { return partes.length > 1 ? partes.slice(0, -1).join(', ') + ' e ' + partes[partes.length - 1] : partes.join(''); }
  function titulo(s) { s = String(s || '').toLowerCase(); return s.charAt(0).toUpperCase() + s.slice(1); }

  // ---------- Envio com o mesmo idReq na repetição ----------
  async function enviar(rota, dados) {
    const chave = rota + JSON.stringify(dados);
    const idReq = pendente[chave] || Api.idReq();
    pendente[chave] = idReq;
    const r = await Api.chamar(rota, Object.assign({ idReq: idReq }, dados));
    delete pendente[chave];
    return r;
  }
  // Erro de regra (ex.: saldo): o próximo envio pode usar outro idReq
  function erroFinal(err) { if (err && err.codigo !== 'SEM_CONEXAO') Object.keys(pendente).forEach(function (k) { delete pendente[k]; }); }

  // ---------- Troca de ação ----------
  document.querySelector('.acoes3').addEventListener('click', function (ev) {
    const b = ev.target.closest('[data-acao]');
    if (!b) return;
    trocarAcao(b.dataset.acao);
  });
  $('#bt-voltar').addEventListener('click', function () { document.body.classList.add('t-inicio'); window.scrollTo(0, 0); });

  function trocarAcao(nova) {
    acao = nova;
    document.body.classList.remove('t-inicio');
    desenharForm();
    const foco = acao === 'op' ? '#op' : acao === 'semop' ? '#ins-busca' : '#dev-op';
    if (!mob()) setTimeout(function () { const f = $(foco); if (f) f.focus(); }, 30);
    document.querySelector('main.conteudo').scrollTop = 0;
  }

  function desenharForm() {
    document.querySelectorAll('.acoes3 .ac').forEach(function (b) { b.classList.toggle('on', b.dataset.acao === acao); });
    const T = { op: ['Retirada com OP', 'digite ou leia a OP'], semop: ['Retirada sem OP', 'manutenção, teste, outro setor'], dev: ['Devolução', 'sobrou, volta para o estoque'] }[acao];
    $('#f-tit').textContent = T[0];
    $('#f-sub').textContent = T[1];
    const leitura = ctx.podeEditar ? '' : '<div class="msg-info leitura">Somente consulta: seu perfil vê o estoque, mas não lança retiradas nem devoluções.</div>';
    if (acao === 'op') {
      $('#f-corpo').innerHTML = leitura +
        '<div class="op-busca"><input id="op" inputmode="numeric" autocomplete="off" placeholder="OP" value="' + e(estrutura ? estrutura.op : '') + '">' +
        '<div class="op-inf" id="op-inf"></div></div><div id="op-itens"></div>';
      ligarOP();
      desenharOP();
    } else if (acao === 'semop') {
      $('#f-corpo').innerHTML = leitura + '<div id="semop"></div>';
      desenharSemOP();
    } else {
      $('#f-corpo').innerHTML = leitura + '<div id="dev"></div>';
      desenharDev();
    }
  }

  // ============================================================
  // RETIRADA COM OP
  // ============================================================
  function ligarOP() {
    const inp = $('#op');
    let tempo = null;
    inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); clearTimeout(tempo); buscarOP(inp.value); } });
    inp.addEventListener('change', function () { clearTimeout(tempo); buscarOP(inp.value); });
    inp.addEventListener('input', function () {
      clearTimeout(tempo);
      if (inp.value.trim().length >= 4) tempo = setTimeout(function () { buscarOP(inp.value); }, 700);
    });
  }

  async function buscarOP(numero, forcar) {
    numero = String(numero || '').trim();
    if (!numero) { estrutura = null; desenharOP(); return; }
    if (!forcar && estrutura && estrutura.op === numero) return;
    const minha = ++seqOP;
    const inf = $('#op-inf');   // só existe na tela da retirada com OP
    if (inf && !forcar) { inf.className = 'op-inf msg'; inf.innerHTML = 'Buscando a OP ' + e(numero) + '…'; }
    try {
      const r = await Api.chamar('estruturaOP', { op: numero });
      if (minha !== seqOP) return;
      const mesmaOP = estrutura && estrutura.id_item === r.id_item;
      estrutura = r;
      if (!mesmaOP) { qtd = {}; motivo = {}; }
      // "Retirar agora" já vem com o que falta (limitado ao saldo)
      r.itens.forEach(function (it) { if (!(it.cod_insumo in qtd) || forcar) qtd[it.cod_insumo] = it.liberado ? it.sugerido : 0; });
      if (acao === 'op') { if ($('#op').value.trim() !== r.op && document.activeElement !== $('#op')) $('#op').value = r.op; desenharOP(); }
    } catch (err) {
      if (minha !== seqOP) return;
      estrutura = null;
      if (acao !== 'op') return;
      desenharOP();
      if ($('#op-inf')) { $('#op-inf').className = 'op-inf msg'; $('#op-inf').innerHTML = '<span class="err">' + e(err.message) + '</span>'; }
    }
  }

  function baseTexto(it) {
    const base = it.base === 'POR_PECA' ? 'por peça' : 'por molde';
    return Fmt.num(it.qtd_bom) + ' ' + base + (it.politica === 'SOB_DEMANDA' ? ' · sob demanda' : '');
  }

  function desenharOP() {
    const inf = $('#op-inf'), cx = $('#op-itens');
    if (!inf) return;
    if (!estrutura) {
      inf.className = 'op-inf msg';
      inf.innerHTML = 'Digite o número da OP (ou leia o código de barras) para ver a estrutura.';
      cx.innerHTML = '';
      return;
    }
    const x = estrutura;
    inf.className = 'op-inf';
    inf.innerHTML = '<span>Cliente<b>' + e(x.cliente || '—') + '</b></span><span>Item<b>' + e(x.codigo) + '</b></span>' +
      '<span>Moldes<b>' + e(Fmt.num(x.moldes)) + ' planejados</b></span><span>Processo<b><span class="proc">' + e(x.processo) + '</span></b></span>';
    if (x.semBom) {
      cx.innerHTML = '<div class="vazio-f">O produto <b>' + e(x.codigo) + '</b> não tem estrutura (BOM) cadastrada.<br>Use a <b>Retirada sem OP</b> ou peça ao PCP para cadastrar a estrutura.</div>';
      return;
    }
    const travados = x.itens.filter(function (it) { return !it.liberado; });
    cx.innerHTML =
      '<div class="itm h"><span>INSUMO DA ESTRUTURA</span><span class="n">PREVISTO</span><span class="n">JÁ RETIRADO</span><span class="n">SALDO ALMOX.</span><span>RETIRAR AGORA</span></div>' +
      x.itens.map(function (it) {
        const off = !it.liberado || !ctx.podeEditar;
        return '<div class="itm" data-cod="' + e(it.cod_insumo) + '">' +
          '<div class="nome"><span class="cat ' + catClasse(it.categoria) + '">' + e(it.categoria || 'OUTROS') + '</span><b>' + e(it.cod_insumo) + '</b><small>' + e(it.descricao) + ' · ' + e(baseTexto(it)) + '</small></div>' +
          '<div class="n" data-l="PREVISTO">' + e(Fmt.num(it.previsto)) + '</div>' +
          '<div class="n" data-l="JÁ RETIRADO">' + e(Fmt.num(it.ja_retirado)) + '</div>' +
          '<div class="n" data-l="SALDO ALMOX.">' + (it.saldo > 0 ? e(Fmt.num(it.saldo)) : '<span class="falta">' + e(Fmt.num(it.saldo)) + '</span>') + '</div>' +
          '<div class="pc"><span class="passo' + (off ? ' off' : '') + '"><button type="button" data-passo="-1"' + (off ? ' disabled' : '') + ' aria-label="menos">−</button>' +
          '<input data-qtd inputmode="decimal" value="' + e(mostrar(it.liberado ? (qtd[it.cod_insumo] || 0) : 0)) + '"' + (off ? ' disabled' : '') + '>' +
          '<button type="button" data-passo="1"' + (off ? ' disabled' : '') + ' aria-label="mais">+</button></span></div>' +
          '<div class="extra"></div></div>';
      }).join('') +
      (travados.length ? '<div class="aviso-emb">' + travados.map(function (it) {
        return 'A <b>' + (it.categoria === 'EMBALAGEM' ? 'embalagem' : e(it.cod_insumo)) + '</b> (' + e(it.cod_insumo) + ') ' + e(it.bloqueio.replace(/^Só é baixada/, 'só é baixada')) +
          (it.id_solicitacao ? ' Já foi pedida ao Compras quando a OP abriu (solicitação ' + e(it.id_solicitacao) + ' · ' + e(nomeStatus(it.status_solicitacao)) + ').' : '');
      }).join('<br>') + '</div>' : '') +
      '<div class="conf"><span class="t" id="op-resumo"></span>' +
      (ctx.podeEditar ? '<button class="btn2 baixa" id="bt-retirar"><svg class="i"><use href="#i-check"/></svg>Confirmar retirada</button>' : '') + '</div>';
    x.itens.forEach(function (it) { validarLinha(it.cod_insumo); });
    resumoOP();
  }

  function nomeStatus(s) { return { SOLICITADO: 'pendente', COMPRADO: 'comprada', RECEBIDO: 'chegou', BAIXADO: 'baixada' }[s] || String(s || '').toLowerCase(); }
  function itemDe(cod) { return estrutura ? estrutura.itens.find(function (i) { return i.cod_insumo === cod; }) : null; }

  // Marca na linha: saldo insuficiente (bloqueia) e acima do previsto (pede motivo)
  function validarLinha(cod) {
    const it = itemDe(cod);
    const linha = document.querySelector('#op-itens .itm[data-cod="' + CSS.escape(cod) + '"]');
    if (!it || !linha) return;
    const q = it.liberado ? num(qtd[cod]) : 0;
    const extra = linha.querySelector('.extra');
    const acimaSaldo = q > it.saldo + 1e-9;
    const acimaPrev = q > 0 && it.ja_retirado + q > it.previsto + 1e-9;
    linha.classList.toggle('erro-saldo', acimaSaldo || isNaN(q));
    linha.classList.toggle('acima', !acimaSaldo && acimaPrev);
    let h = '';
    if (isNaN(q)) h += '<span class="erro-l">Quantidade inválida.</span>';
    else if (acimaSaldo) h += '<span class="erro-l">Saldo no sistema é ' + e(Fmt.num(it.saldo)) + ': não dá para tirar ' + e(Fmt.num(q)) + '. Se o físico não bate, peça a Compras um inventário.</span>';
    if (!acimaSaldo && acimaPrev) {
      const campo = extra.querySelector('[data-motivo]');
      if (campo) return;   // já está na tela: não redesenha (não perde o que foi digitado)
      h += '<span class="aviso-l">Acima do previsto (previsto ' + e(Fmt.num(it.previsto)) + ', já retirado ' + e(Fmt.num(it.ja_retirado)) + '): informe o motivo.</span>' +
        '<input data-motivo placeholder="Motivo (ex.: luva quebrada, molde refeito)" value="' + e(motivo[cod] || '') + '">';
    }
    extra.innerHTML = h;
  }

  function linhasOP() {
    if (!estrutura) return [];
    return estrutura.itens.filter(function (it) { return it.liberado && num(qtd[it.cod_insumo]) > 0; })
      .map(function (it) { return { it: it, q: num(qtd[it.cod_insumo]) }; });
  }

  function resumoOP() {
    const el = $('#op-resumo');
    if (!el) return;
    const l = linhasOP();
    el.innerHTML = l.length ? 'Retirando ' + juntar(l.map(function (x) { return nomeQtd(x.it, x.q); })) + ' para a OP ' + e(estrutura.op)
      : 'Nada a retirar agora' + (estrutura.itens.every(function (it) { return !it.liberado || it.falta === 0; }) ? ': a OP já retirou o previsto.' : '.');
    // saldo insuficiente ou número inválido: bloqueia (regra aprovada)
    const invalida = estrutura.itens.some(function (it) { const q = num(qtd[it.cod_insumo]); return it.liberado && (isNaN(q) || q > it.saldo + 1e-9); });
    const bt = $('#bt-retirar');
    if (bt) bt.disabled = !l.length || enviando || invalida;
  }

  // Entrada da quantidade e do motivo (retirada com OP)
  $('#f-corpo').addEventListener('input', function (ev) {
    const linha = ev.target.closest('#op-itens .itm[data-cod]');
    if (!linha) return;
    const cod = linha.dataset.cod;
    if (ev.target.matches('[data-qtd]')) { qtd[cod] = ev.target.value; validarLinha(cod); resumoOP(); }
    if (ev.target.matches('[data-motivo]')) { motivo[cod] = ev.target.value; ev.target.classList.remove('falta-motivo'); }
  });
  $('#f-corpo').addEventListener('click', function (ev) {
    const bp = ev.target.closest('[data-passo]');
    if (bp && !bp.disabled) {
      const passo = bp.closest('.passo'), inp = passo.querySelector('input');
      const atual = num(inp.value);
      const novo = Math.max(0, Math.round(((isNaN(atual) ? 0 : atual) + Number(bp.dataset.passo)) * 1000) / 1000);
      inp.value = mostrar(novo);
      inp.dispatchEvent(new Event('input', { bubbles: true }));
      return;
    }
    if (ev.target.closest('#bt-retirar')) confirmarOP();
  });

  async function confirmarOP() {
    if (enviando || !estrutura) return;
    const l = linhasOP();
    if (!l.length) return;
    // bloqueios na tela (o servidor confere de novo)
    const invalida = estrutura.itens.find(function (it) { const q = num(qtd[it.cod_insumo]); return it.liberado && (isNaN(q) || q > it.saldo + 1e-9); });
    if (invalida) { Ui.toast(invalida.cod_insumo + ': quantidade maior que o saldo do sistema (' + Fmt.num(invalida.saldo) + '). Corrija antes de confirmar.', 'erro', 'Saldo insuficiente'); return; }
    const semMotivo = l.find(function (x) { return x.it.ja_retirado + x.q > x.it.previsto + 1e-9 && !String(motivo[x.it.cod_insumo] || '').trim(); });
    if (semMotivo) {
      const c = document.querySelector('#op-itens .itm[data-cod="' + CSS.escape(semMotivo.it.cod_insumo) + '"] [data-motivo]');
      if (c) { c.classList.add('falta-motivo'); c.focus(); }
      Ui.toast(semMotivo.it.cod_insumo + ': retirada acima do previsto precisa de motivo.', 'aviso', 'Informe o motivo');
      return;
    }
    const dados = { op: estrutura.op, itens: l.map(function (x) {
      const m = { cod_insumo: x.it.cod_insumo, qtd: x.q };
      if (x.it.ja_retirado + x.q > x.it.previsto + 1e-9) m.motivo = String(motivo[x.it.cod_insumo]).trim();
      return m;
    }) };
    const resumo = $('#op-resumo').textContent;
    await gravar('retirarComOP', dados, '#bt-retirar', 'Retirada registrada', function (r) {
      Ui.toast(resumo + (r.ids ? ' · ' + r.ids.join(', ') : ''), 'ok', 'Retirada registrada');
      buscarOP(estrutura.op, true);
    });
  }

  // Grava, trata erro e atualiza as listas
  async function gravar(rota, dados, seletorBt, _titulo, depois) {
    enviando = true;
    const bt = $(seletorBt);
    if (bt) { bt.disabled = true; bt.dataset.txt = bt.innerHTML; bt.innerHTML = 'Gravando…'; }
    try {
      const r = await enviar(rota, dados);
      if (r && r.duplicado) Ui.toast('Este lançamento já tinha sido gravado.', 'aviso');
      else depois(r || {});
      carregarListas(true);
      carregarInsumos();
      return true;
    } catch (err) {
      erroFinal(err);
      Ui.erro(err);
      return false;
    } finally {
      enviando = false;
      const b2 = $(seletorBt);
      if (b2 && b2.dataset.txt) { b2.innerHTML = b2.dataset.txt; b2.disabled = false; }
      if (acao === 'op') resumoOP();
    }
  }

  // ============================================================
  // ESCOLHA DE INSUMO (sem OP e devolução)
  // ============================================================
  async function carregarInsumos() {
    try {
      // situacaoInsumos traz o saldo; sem acesso a Insumos, usa só o cadastro
      if (ctx.nivelDe('insumos') !== 'NENHUM') insumos = await Api.chamar('situacaoInsumos', {});
      else insumos = (await Api.chamar('listarInsumos', {})).map(function (i) {
        return { cod_insumo: i.COD_INSUMO, descricao: i.DESCRICAO, categoria: i.CATEGORIA, unidade: i.UNIDADE, politica: i.POLITICA, saldo: null };
      });
      // atualiza o saldo mostrado do insumo escolhido
      [semop, dev].forEach(function (f) { if (f.ins) f.ins = insumos.find(function (i) { return i.cod_insumo === f.ins.cod_insumo; }) || f.ins; });
      if (acao === 'semop' && !document.activeElement.closest('#semop')) desenharSemOP();
    } catch (err) { /* a busca de insumo mostra o aviso */ }
  }

  function htmlPicker(f, id) {
    if (f.ins) {
      return '<div class="ins-sel"><span class="cat ' + catClasse(f.ins.categoria) + '">' + e(f.ins.categoria || 'OUTROS') + '</span>' +
        '<span class="d">' + e(f.ins.cod_insumo) + '<small>' + e(f.ins.descricao) + (f.ins.saldo === null || f.ins.saldo === undefined ? '' : ' · saldo ' + e(Fmt.num(f.ins.saldo)) + ' ' + e(String(f.ins.unidade || '').toLowerCase())) + '</small></span>' +
        '<button type="button" data-trocar="' + id + '" title="Trocar insumo">' + Ui.ic('i-x') + '</button></div>';
    }
    return '<div class="pick"><input id="' + id + '" placeholder="Código ou descrição (ex.: MP00056, luva)" autocomplete="off"><div class="sug" data-sug="' + id + '"></div></div>';
  }

  function sugestoes(texto) {
    const t = String(texto || '').toUpperCase().replace(/\s+/g, ' ').trim();
    let l = insumos;
    if (!t) l = l.filter(function (i) { return i.categoria === 'LUVA' || i.categoria === 'FILTRO'; });
    // cada palavra digitada precisa aparecer (ex.: "luva 4x7")
    else l = l.filter(function (i) { const alvo = (i.cod_insumo + ' ' + i.descricao + ' ' + i.categoria).toUpperCase(); return t.split(' ').every(function (p) { return alvo.indexOf(p) !== -1; }); });
    return l.slice(0, 8);
  }
  function desenharSugestoes(id, texto) {
    const cx = document.querySelector('[data-sug="' + id + '"]');
    if (!cx) return;
    const l = sugestoes(texto);
    cx.innerHTML = l.map(function (i) {
      return '<button type="button" class="sg" data-pega="' + e(i.cod_insumo) + '" data-alvo="' + id + '"><span class="cat ' + catClasse(i.categoria) + '">' + e(i.categoria || 'OUTROS') + '</span><b>' + e(i.cod_insumo) + '</b>' +
        '<span class="d">' + e(i.descricao) + '</span>' + (i.saldo === null || i.saldo === undefined ? '' : '<span class="sl">saldo ' + e(Fmt.num(i.saldo)) + '</span>') + '</button>';
    }).join('') || '<div class="vazio-f">' + (insumos.length ? 'Nenhum insumo encontrado.' : 'Carregando insumos…') + '</div>';
  }

  $('#f-corpo').addEventListener('input', function (ev) {
    if (ev.target.id === 'ins-busca' || ev.target.id === 'dev-busca') desenharSugestoes(ev.target.id, ev.target.value);
  });
  $('#f-corpo').addEventListener('focusin', function (ev) {
    if (ev.target.id === 'ins-busca' || ev.target.id === 'dev-busca') desenharSugestoes(ev.target.id, ev.target.value);
  });
  $('#f-corpo').addEventListener('click', function (ev) {
    const pega = ev.target.closest('[data-pega]');
    if (pega) {
      const ins = insumos.find(function (i) { return i.cod_insumo === pega.dataset.pega; });
      if (pega.dataset.alvo === 'ins-busca') { semop.ins = ins; desenharSemOP(); } else { dev.ins = ins; desenharDev(); }
      return;
    }
    const troca = ev.target.closest('[data-trocar]');
    if (troca) {
      if (troca.dataset.trocar === 'ins-busca') { semop.ins = null; desenharSemOP(); } else { dev.ins = null; desenharDev(); }
      const f = $('#' + troca.dataset.trocar); if (f) f.focus();
    }
  });

  // ============================================================
  // RETIRADA SEM OP
  // ============================================================
  function desenharSemOP() {
    const cx = $('#semop');
    if (!cx) return;
    const off = !ctx.podeEditar;
    cx.innerHTML =
      '<div class="fs">' +
      '<div class="fc l">INSUMO' + htmlPicker(semop, 'ins-busca') + '</div>' +
      '<div class="fc">QUANTIDADE<span class="passo grande' + (off ? ' off' : '') + '"><button type="button" data-passo="-1"' + (off ? ' disabled' : '') + '>−</button>' +
        '<input id="so-qtd" inputmode="decimal" value="' + e(mostrar(semop.qtd)) + '"' + (off ? ' disabled' : '') + '><button type="button" data-passo="1"' + (off ? ' disabled' : '') + '>+</button></span><span id="so-aviso"></span></div>' +
      '<div class="fc">SETOR<div class="chips" id="so-setor">' + (setores.map(function (s) {
        return '<button type="button" data-setor="' + e(s) + '" class="' + (semop.setor === s ? 'on' : '') + '"' + (off ? ' disabled' : '') + '>' + e(titulo(s)) + '</button>';
      }).join('') || '<span class="mut">Carregando setores…</span>') + '</div></div>' +
      '<label class="fc l">MOTIVO<input id="so-motivo" placeholder="Ex.: teste de molde, manutenção do forno" value="' + e(semop.motivo) + '"' + (off ? ' disabled' : '') + '></label>' +
      '</div>' +
      '<div class="conf"><span class="t" id="so-resumo"></span>' + (ctx.podeEditar ? '<button class="btn2 baixa" id="bt-semop"><svg class="i"><use href="#i-check"/></svg>Confirmar retirada</button>' : '') + '</div>';
    resumoSemOP();
  }
  function resumoSemOP() {
    const q = num(semop.qtd);
    const av = $('#so-aviso');
    const ins = semop.ins;
    const falta = ins && ins.saldo !== null && ins.saldo !== undefined && q > ins.saldo + 1e-9;
    if (av) av.innerHTML = isNaN(q) ? '<span class="erro-l">Quantidade inválida.</span>' : falta ? '<span class="erro-l">Saldo no sistema é ' + e(Fmt.num(ins.saldo)) + ': não dá para tirar ' + e(Fmt.num(q)) + '.</span>' : '';
    const r = $('#so-resumo');
    if (r) r.innerHTML = ins && q > 0 ? 'Retirando ' + nomeQtd(ins, q) + (ins.categoria in { LUVA: 1, FILTRO: 1, EMBALAGEM: 1 } ? ' (' + e(ins.cod_insumo) + ')' : '') + (semop.setor ? ' para ' + e(titulo(semop.setor)) : '') : 'Escolha o insumo, a quantidade, o setor e o motivo.';
    const bt = $('#bt-semop');
    if (bt) bt.disabled = enviando || !ins || !(q > 0) || falta;
  }
  $('#f-corpo').addEventListener('input', function (ev) {
    if (ev.target.id === 'so-qtd') { semop.qtd = ev.target.value; resumoSemOP(); }
    if (ev.target.id === 'so-motivo') semop.motivo = ev.target.value;
    if (ev.target.id === 'dv-qtd') { dev.qtd = ev.target.value; resumoDev(); }
    if (ev.target.id === 'dv-motivo') dev.motivo = ev.target.value;
  });
  $('#f-corpo').addEventListener('click', function (ev) {
    const s = ev.target.closest('[data-setor]');
    if (s) {
      semop.setor = s.dataset.setor;
      document.querySelectorAll('#so-setor button').forEach(function (b) { b.classList.toggle('on', b === s); });
      resumoSemOP();
      return;
    }
    if (ev.target.closest('#bt-semop')) confirmarSemOP();
    if (ev.target.closest('#bt-dev')) confirmarDev();
  });

  async function confirmarSemOP() {
    if (enviando) return;
    const q = num(semop.qtd);
    if (!semop.ins || !(q > 0)) return;
    if (!semop.setor) { Ui.toast('Escolha o setor que vai usar o material.', 'aviso', 'Falta o setor'); return; }
    if (!semop.motivo.trim()) { $('#so-motivo').focus(); Ui.toast('Informe o motivo da retirada sem OP.', 'aviso', 'Falta o motivo'); return; }
    const ins = semop.ins;
    const dados = { cod_insumo: ins.cod_insumo, qtd: q, setor: semop.setor, motivo: semop.motivo.trim() };
    await gravar('retirarSemOP', dados, '#bt-semop', '', function (r) {
      Ui.toast(ins.cod_insumo + ' · ' + Fmt.num(q) + ' para ' + titulo(semop.setor) + (r.id ? ' · ' + r.id : ''), 'ok', 'Retirada sem OP registrada');
      semop = { ins: null, qtd: 1, setor: '', motivo: '' };
      desenharSemOP();
    });
  }

  // ============================================================
  // DEVOLUÇÃO (com OP: até o que a OP retirou · sem OP: motivo)
  // ============================================================
  function desenharDev() {
    const cx = $('#dev');
    if (!cx) return;
    const off = !ctx.podeEditar;
    const retirados = dev.estr ? dev.estr.itens.filter(function (it) { return it.ja_retirado > 0; }) : [];
    cx.innerHTML =
      '<div class="fs">' +
      '<label class="fc l">OP (se o material saiu para uma OP)<input id="dev-op" inputmode="numeric" autocomplete="off" placeholder="nº da OP · deixe vazio se foi sem OP" value="' + e(dev.op) + '"' + (off ? ' disabled' : '') + '>' +
        '<small id="dev-op-inf">' + devOpInfo(retirados) + '</small></label>' +
      (retirados.length ? '<div class="fc l">RETIRADO POR ESTA OP<div class="chips op">' + retirados.map(function (it) {
        return '<button type="button" data-pega-op="' + e(it.cod_insumo) + '" class="' + (dev.ins && dev.ins.cod_insumo === it.cod_insumo ? 'on' : '') + '">' + e(it.cod_insumo) + '<small>retirou ' + e(Fmt.num(it.ja_retirado)) + '</small></button>';
      }).join('') + '</div></div>' : '') +
      '<div class="fc l">INSUMO' + htmlPicker(dev, 'dev-busca') + '</div>' +
      '<div class="fc">QUANTIDADE<span class="passo grande' + (off ? ' off' : '') + '"><button type="button" data-passo="-1"' + (off ? ' disabled' : '') + '>−</button>' +
        '<input id="dv-qtd" inputmode="decimal" value="' + e(mostrar(dev.qtd)) + '"' + (off ? ' disabled' : '') + '><button type="button" data-passo="1"' + (off ? ' disabled' : '') + '>+</button></span><span id="dv-aviso"></span></div>' +
      '<label class="fc">MOTIVO <small id="dv-motivo-inf"></small><input id="dv-motivo" placeholder="Ex.: sobrou do molde" value="' + e(dev.motivo) + '"' + (off ? ' disabled' : '') + '></label>' +
      '</div>' +
      '<div class="conf"><span class="t" id="dv-resumo"></span>' + (ctx.podeEditar ? '<button class="btn2 baixa" id="bt-dev"><svg class="i"><use href="#i-check"/></svg>Confirmar devolução</button>' : '') + '</div>';
    ligarDevOP();
    resumoDev();
  }
  function devOpInfo(retirados) {
    if (!dev.op.trim()) return 'Sem OP: o motivo é obrigatório.';
    if (dev.avisoOp) return e(dev.avisoOp);
    if (!dev.estr) return 'Buscando a OP…';
    return 'OP ' + e(dev.estr.op) + ' · ' + e(dev.estr.cliente) + ' · ' + e(dev.estr.codigo) + (retirados.length ? '' : ' · esta OP ainda não retirou nada');
  }
  function ligarDevOP() {
    const inp = $('#dev-op');
    if (!inp) return;
    let tempo = null;
    const buscar = function () { clearTimeout(tempo); buscarDevOP(inp.value); };
    inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); buscar(); } });
    inp.addEventListener('change', buscar);
    inp.addEventListener('input', function () {
      dev.op = inp.value;
      clearTimeout(tempo);
      if (!inp.value.trim()) { dev.estr = null; dev.avisoOp = ''; $('#dev-op-inf').innerHTML = devOpInfo([]); resumoDev(); return; }
      if (inp.value.trim().length >= 4) tempo = setTimeout(buscar, 700);
      resumoDev();
    });
  }
  let seqDev = 0;
  async function buscarDevOP(numero) {
    numero = String(numero || '').trim();
    dev.op = numero;
    if (!numero) { dev.estr = null; dev.avisoOp = ''; desenharDev(); return; }
    if (dev.estr && dev.estr.op === numero) return;
    const minha = ++seqDev;
    dev.estr = null; dev.avisoOp = '';
    try {
      const r = await Api.chamar('estruturaOP', { op: numero });
      if (minha !== seqDev) return;
      dev.estr = r;
    } catch (err) {
      if (minha !== seqDev) return;
      // OP fechada (ex.: expedida) aceita devolução: o servidor confere o limite
      dev.avisoOp = err.codigo === 'OP_INATIVA' ? err.message.replace('não aceita retirada', 'a devolução é aceita') : err.message;
    }
    if (acao === 'dev') desenharDev();
  }
  $('#f-corpo').addEventListener('click', function (ev) {
    const b = ev.target.closest('[data-pega-op]');
    if (!b) return;
    const cod = b.dataset.pegaOp;
    dev.ins = insumos.find(function (i) { return i.cod_insumo === cod; }) || (function () {
      const it = dev.estr.itens.find(function (x) { return x.cod_insumo === cod; });
      return { cod_insumo: it.cod_insumo, descricao: it.descricao, categoria: it.categoria, unidade: it.unidade, saldo: it.saldo };
    })();
    desenharDev();
  });
  function limiteDev() {
    if (!dev.estr || !dev.ins) return null;
    const it = dev.estr.itens.find(function (x) { return x.cod_insumo === dev.ins.cod_insumo; });
    return it ? it.ja_retirado : 0;
  }
  function resumoDev() {
    const q = num(dev.qtd);
    const lim = limiteDev();
    const acima = lim !== null && q > lim + 1e-9;
    const av = $('#dv-aviso');
    if (av) av.innerHTML = isNaN(q) ? '<span class="erro-l">Quantidade inválida.</span>' : acima ? '<span class="erro-l">A OP ' + e(dev.estr.op) + ' retirou ' + e(Fmt.num(lim)) + ' de ' + e(dev.ins.cod_insumo) + ': não dá para devolver ' + e(Fmt.num(q)) + '.</span>' : '';
    const semOp = !dev.op.trim();
    const mi = $('#dv-motivo-inf');
    if (mi) mi.textContent = semOp ? '(obrigatório sem OP)' : '(opcional)';
    const r = $('#dv-resumo');
    if (r) r.innerHTML = dev.ins && q > 0 ? 'Devolvendo ' + nomeQtd(dev.ins, q) + ' (' + e(dev.ins.cod_insumo) + ')' + (semOp ? ' sem OP' : ' da OP ' + e(dev.op.trim())) : 'Escolha o insumo e a quantidade que voltou.';
    const bt = $('#bt-dev');
    if (bt) bt.disabled = enviando || !dev.ins || !(q > 0) || acima;
  }
  async function confirmarDev() {
    if (enviando) return;
    const q = num(dev.qtd);
    if (!dev.ins || !(q > 0)) return;
    const semOp = !dev.op.trim();
    if (semOp && !dev.motivo.trim()) { $('#dv-motivo').focus(); Ui.toast('Devolução sem OP precisa de motivo.', 'aviso', 'Falta o motivo'); return; }
    const dados = { cod_insumo: dev.ins.cod_insumo, qtd: q };
    if (!semOp) dados.op = dev.op.trim();
    if (dev.motivo.trim()) dados.motivo = dev.motivo.trim();
    const ins = dev.ins;
    await gravar('devolver', dados, '#bt-dev', '', function (r) {
      Ui.toast(ins.cod_insumo + ' · +' + Fmt.num(q) + (semOp ? '' : ' da OP ' + dados.op) + (r.id ? ' · ' + r.id : ''), 'ok', 'Devolução registrada');
      dev = { op: '', estr: null, avisoOp: '', ins: null, qtd: 1, motivo: '' };
      desenharDev();
      if (estrutura && dados.op && estrutura.op === dados.op) buscarOP(estrutura.op, true);
    });
  }

  // ============================================================
  // LATERAL: embalagens para baixar + meus movimentos de hoje
  // ============================================================
  async function carregarListas(silencioso) {
    const tarefas = [
      Api.chamar('embalagensParaBaixar', {}).then(desenharEmbalagens),
      Api.chamar('meusMovimentosHoje', {}).then(function (m) { movs = m || []; desenharMovimentos(); })
    ];
    const r = await Promise.allSettled(tarefas);
    const falha = r.find(function (x) { return x.status === 'rejected'; });
    if (falha && !silencioso) Ui.erro(falha.reason);
  }

  function desenharEmbalagens(lista) {
    $('#embalagens').innerHTML = (lista || []).map(function (s) {
      const un = String(s.unidade || '').toLowerCase();
      return '<div class="pd' + (s.pronto ? ' pronto' : '') + '"' + (s.pronto ? ' data-baixar="' + e(s.op) + '" title="Abrir a OP para baixar"' : '') + '>' +
        '<b>OP ' + e(s.op) + ' · ' + e(s.cod_insumo) + '</b>' +
        '<span class="st ' + (s.pronto ? 'chegou' : 'comprar') + '">' + (s.pronto ? 'CHEGOU · baixar' : e(s.situacao)) + '</span>' +
        '<small>' + e(titulo(s.cliente)) + ' · ' + e(Fmt.num(s.qtd)) + ' ' + e(un) + (s.pronto ? ' · ' + e(s.descricao) : (s.previsao_chegada ? ' · prevista ' + e(s.previsao_chegada.slice(0, 5)) : ' · ' + e(s.id_solicitacao))) + '</small></div>';
    }).join('') || '<div class="vazio">Nenhuma OP na Inspeção Final esperando embalagem.</div>';
  }
  $('#embalagens').addEventListener('click', function (ev) {
    const b = ev.target.closest('[data-baixar]');
    if (!b) return;
    estrutura = null; qtd = {}; motivo = {};   // não mostra a OP anterior enquanto carrega
    trocarAcao('op');
    $('#op').value = b.dataset.baixar;
    buscarOP(b.dataset.baixar, true);
  });

  function textoMov(m) {
    const cat = String(m.categoria || '').toLowerCase();
    let d;
    if (m.tipo === 'SAIDA_OP') d = 'OP ' + m.op + ' · retirada' + (m.motivo ? ' · ' + m.motivo : '');
    else if (m.tipo === 'SAIDA_SEM_OP') d = 'sem OP · ' + titulo(m.setor) + (m.motivo ? ' · ' + m.motivo : '');
    else if (m.tipo === 'DEVOLUCAO') d = 'devolução' + (m.op ? ' · OP ' + m.op : '') + (m.motivo ? ' · ' + m.motivo : '');
    else if (m.tipo === 'ENTRADA') d = 'entrada' + (m.op ? ' · OP ' + m.op : '');
    else if (m.tipo === 'AJUSTE_INVENTARIO') d = 'ajuste de inventário';
    else if (m.tipo === 'ESTORNO') d = 'estorno' + (m.motivo ? ' · ' + m.motivo : '');
    else d = String(m.tipo || '').toLowerCase();
    return { t: m.cod_insumo + (cat ? ' · ' + cat : ''), d: d };
  }
  function qtdMov(m) { return (m.qtd > 0 ? '+' : m.qtd < 0 ? '−' : '') + Fmt.num(Math.abs(m.qtd)); }

  function desenharMovimentos() {
    $('#movimentos').innerHTML = movs.map(function (m) {
      const x = textoMov(m);
      return '<div class="mv' + (m.estornado ? ' estornado' : '') + '" data-mov="' + e(m.id) + '"><span class="h">' + e(m.hora) + '</span>' +
        '<span><span>' + e(x.t) + '</span>' + (m.estornado ? '<span class="tg">estornado</span>' : '') + '<small>' + e(x.d) + ' · ' + e(m.id) + '</small></span>' +
        '<span class="q ' + (m.qtd < 0 ? 's' : 'e') + '">' + e(qtdMov(m)) + '</span></div>';
    }).join('') + (movs.length ? '' : '<div class="vazio">Nenhum lançamento seu hoje.</div>') +
      '<div class="mv-rod"><span>' + movs.length + ' movimento' + (movs.length === 1 ? '' : 's') + '</span>' +
      (podeEstornar ? '<button type="button" id="bt-estornar">Estornar um lançamento</button>' : '') + '</div>';
  }

  // ---------- Estorno (nada é apagado: grava uma linha ESTORNO) ----------
  $('#movimentos').addEventListener('click', function (ev) {
    if (ev.target.closest('#bt-estornar')) abrirEstorno();
  });
  function abrirEstorno() {
    const lista = movs.filter(function (m) { return m.pode_estornar; });
    const corpo = '<div class="msg-erro"></div>' +
      (lista.length ? '<div class="est-lista">' + lista.map(function (m, i) {
        const x = textoMov(m);
        return '<label><input type="radio" name="mov" value="' + e(m.id) + '"' + (i === 0 ? ' checked' : '') + '><span>' + e(m.hora) + ' · ' + e(x.t) + '<small>' + e(x.d) + ' · ' + e(m.id) + '</small></span><span class="q">' + e(qtdMov(m)) + '</span></label>';
      }).join('') + '</div>' : '<p class="mut" style="margin-top:0">Nenhum lançamento seu de hoje para estornar.</p>') +
      '<label class="campo-e">OU O ID DE OUTRO LANÇAMENTO SEU' + (ctx.usuario.cargo === 'ADMIN' ? ' (ADMIN: QUALQUER UM)' : '') + '<input name="outro" placeholder="ME-000123" autocomplete="off"></label>' +
      '<label class="campo-e">MOTIVO DO ESTORNO<input name="motivo" placeholder="Ex.: baixei na OP errada" autocomplete="off"></label>';
    Ui.janela({
      titulo: 'Estornar lançamento',
      subtitulo: 'Nada é apagado: o sistema grava um estorno com a quantidade invertida.',
      largura: 480, corpo: corpo, enterConfirma: false,
      botoes: [{ texto: 'Voltar', valor: null }, { texto: 'Estornar', classe: 'perigo', valor: 'ok' }],
      antesDeFechar: async function (v, cx) {
        const erro = cx.querySelector('.msg-erro');
        const outro = cx.querySelector('[name="outro"]').value.trim().toUpperCase();
        const marcado = cx.querySelector('[name="mov"]:checked');
        const id = outro || (marcado ? marcado.value : '');
        const mot = cx.querySelector('[name="motivo"]').value.trim();
        if (!id) { Ui.msgErro(erro, 'Escolha o lançamento (ou digite o ID).'); return false; }
        if (!mot) { Ui.msgErro(erro, 'Informe o motivo do estorno.'); cx.querySelector('[name="motivo"]').focus(); return false; }
        try {
          const r = await enviar('estornarMovimento', { id: id, motivo: mot });
          Ui.toast(r.duplicado ? 'Este estorno já tinha sido gravado.' : id + ' estornado (' + r.id + ').', r.duplicado ? 'aviso' : 'ok', 'Estorno registrado');
          return true;
        } catch (err) {
          erroFinal(err);
          Ui.msgErro(erro, err.message);
          return false;
        }
      }
    }).then(function (v) {
      if (v !== 'ok') return;
      carregarListas(true);
      carregarInsumos();
      if (estrutura) buscarOP(estrutura.op, true);
    });
  }
});
</script>
</body>
</html>
