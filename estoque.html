<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estoque · Operador · Prometals</title>
<link rel="stylesheet" href="css/tema.css">
<link rel="stylesheet" href="css/sistema.css">
<style>
/* ---------- Estoque · Operador: assistente passo a passo ----------
   Uma pergunta por tela, botões grandes (dedo com luva no celular).
   No computador é o mesmo assistente, centralizado (máx. 560px). */
.wiz { max-width: 560px; margin: 0 auto; display: grid; gap: 14px; }
.wiz > * { min-width: 0; }
.wiz-topo { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.wiz-passo { font-size: 13px; font-weight: 700; color: var(--texto-suave); white-space: nowrap; }
.wiz h2 { margin: 0; font-size: 24px; line-height: 1.2; }
.wiz .sub { margin: -6px 0 0; color: var(--texto-suave); font-size: 15px; }

/* botões grandes */
.bg { width: 100%; min-height: 60px; border-radius: 14px; border: 1px solid var(--borda); background: var(--painel); color: var(--texto);
      font: inherit; font-size: 19px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; padding: 10px 16px; text-align: center; }
.bg svg { width: 24px; height: 24px; flex: none; }
.bg.pri { background: var(--destaque); border-color: var(--destaque); color: #fff; }
.bg.ok { background: #16a34a; border-color: #16a34a; color: #fff; }
.bg:disabled { opacity: .45; cursor: not-allowed; }
.bg.sec { background: var(--painel-2, var(--painel)); }
.voltar { min-height: 56px; width: auto; padding: 0 18px; font-size: 18px; }

/* tela 1: as 3 ações */
.acoes { display: grid; gap: 14px; }
.acao { min-height: 110px; justify-content: flex-start; text-align: left; gap: 16px; padding: 16px 20px; border-width: 2px; }
.acao .ic { width: 60px; height: 60px; border-radius: 14px; display: grid; place-items: center; flex: none; background: color-mix(in srgb, var(--c) 20%, transparent); color: var(--c); }
.acao .ic svg { width: 32px; height: 32px; }
.acao b { display: block; font-size: 22px; letter-spacing: .3px; }
.acao small { display: block; font-size: 15px; font-weight: 600; color: var(--texto-suave); margin-top: 2px; }
.acao:hover { border-color: var(--c); }
.acao.em-breve { opacity: .45; cursor: not-allowed; filter: grayscale(1); }
.acao.em-breve:hover { border-color: var(--linha); }

/* entradas grandes */
.campo-g { width: 100%; height: 68px; font-size: 26px; font-weight: 800; text-align: center; letter-spacing: 1px; border-radius: 14px; padding: 0 12px; }
.campo-t { width: 100%; height: 60px; font-size: 18px; border-radius: 12px; padding: 0 14px; }
.campo-t.falta-motivo, .campo-g.falta-motivo { border: 2px dashed #dc2626; background: rgba(220,38,38,.07); }
.msg { font-size: 16px; line-height: 1.45; }
.msg.err { color: var(--erro); font-weight: 700; }
html.tema-claro .msg.err { color: #b91c1c; }
.dica { font-size: 14px; color: var(--texto-suave); }

/* cartões (OP, insumo escolhido, itens da OP) */
.cartao { background: var(--painel); border: 1px solid var(--linha); border-radius: 14px; padding: 14px 16px; display: grid; gap: 10px; }
.cartao.erro-saldo { border-color: #dc2626; box-shadow: inset 4px 0 0 #dc2626; }
.cartao.acima { border-color: #eab308; box-shadow: inset 4px 0 0 #eab308; }
.cartao.trav { opacity: .8; }
.op-cab { font-size: 15px; color: var(--texto-suave); line-height: 1.45; }
.op-cab b { color: var(--texto); font-size: 17px; }
.nome b { font-size: 18px; } .nome small { display: block; font-size: 14px; color: var(--texto-suave); margin-top: 2px; }
.nums { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; color: var(--texto-suave); }
.nums b { color: var(--texto); }
.falta { color: #f87171; font-weight: 800; } html.tema-claro .falta { color: #b91c1c; }
.cat { font-size: 11px; font-weight: 800; padding: 2px 7px; border-radius: 5px; margin-right: 6px; background: var(--painel-2, var(--linha)); color: var(--texto-suave); vertical-align: 2px; }
.cat.luva { background: rgba(59,130,246,.18); color: #93c5fd; } .cat.filtro { background: rgba(20,184,166,.18); color: #5eead4; } .cat.emb { background: rgba(240,122,31,.18); color: #fdba74; }
html.tema-claro .cat.luva { color: #1d4ed8; } html.tema-claro .cat.filtro { color: #0f766e; } html.tema-claro .cat.emb { color: #9a3412; }
.aviso-l { font-size: 15px; font-weight: 700; color: #eab308; } html.tema-claro .aviso-l { color: #92400e; }
.erro-l { font-size: 15px; font-weight: 700; color: #f87171; } html.tema-claro .erro-l { color: #b91c1c; }
.trava { font-size: 14px; color: var(--texto-suave); line-height: 1.45; padding: 8px 10px; border-radius: 10px; border: 1px dashed rgba(240,122,31,.5); background: rgba(240,122,31,.08); }
.extra { display: grid; gap: 8px; } .extra:empty { display: none; }

/* − número + */
.passo { display: flex; align-items: stretch; height: 64px; border: 2px solid var(--destaque); border-radius: 14px; overflow: hidden; background: var(--painel); }
.passo button { width: 72px; flex: none; border: 0; background: color-mix(in srgb, var(--destaque) 12%, transparent); color: var(--texto); font-size: 32px; font-weight: 800; cursor: pointer; }
.passo input { flex: 1; min-width: 0; border: 0; border-radius: 0; text-align: center; font-size: 28px; font-weight: 800; color: var(--texto); background: transparent; padding: 0; }
.passo input:focus { outline: none; }
.passo.off { border-color: var(--borda); opacity: .55; } .passo.off button { cursor: not-allowed; }

/* lista de insumos para tocar */
.lista { display: grid; gap: 10px; }
.item-b { min-height: 64px; justify-content: flex-start; text-align: left; font-size: 17px; font-weight: 700; flex-wrap: wrap; gap: 4px 8px; }
.item-b .d { flex-basis: 100%; font-size: 14px; font-weight: 500; color: var(--texto-suave); overflow-wrap: anywhere; }
.item-b .sl { margin-left: auto; font-size: 14px; font-weight: 600; color: var(--texto-suave); }
.chips { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.chips .bg { font-size: 17px; min-height: 64px; }

/* resumo final e tela "Pronto" */
.resumo { font-size: 17px; line-height: 1.5; padding: 14px 16px; border-radius: 14px; background: color-mix(in srgb, var(--destaque) 8%, var(--painel)); border: 1px solid var(--linha); overflow-wrap: anywhere; }
.pronto { text-align: center; display: grid; gap: 14px; padding: 18px 0; }
.pronto h2 { font-size: 34px; }
.pronto .ids { font-size: 13px; color: var(--texto-suave); overflow-wrap: anywhere; }

/* rodapé discreto */
.rodape-w { display: flex; flex-wrap: wrap; gap: 10px 18px; justify-content: center; padding-top: 6px; }
.link { background: none; border: 0; padding: 10px 4px; font: inherit; font-size: 15px; font-weight: 700; color: var(--destaque); cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
.emb { border: 1px solid var(--linha); border-radius: 12px; background: var(--painel); }
.emb summary { cursor: pointer; padding: 12px 14px; font-size: 15px; font-weight: 700; color: var(--texto-suave); }
.emb .lista { padding: 0 12px 12px; }
.leitura { font-size: 15px; }

/* janela "Meus lançamentos de hoje" e estorno */
.mv { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 9px 2px; border-bottom: 1px solid var(--linha); font-size: 13.5px; }
.mv .h { color: var(--texto-suave); font-size: 12px; } .mv small { display: block; color: var(--texto-suave); font-size: 12px; overflow-wrap: anywhere; }
.mv .q { font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; } .mv .q.s { color: #f87171; } .mv .q.e { color: #34d399; }
html.tema-claro .mv .q.s { color: #b91c1c; } html.tema-claro .mv .q.e { color: #166534; }
.mv.estornado > span:nth-child(2) > span, .mv.estornado .q { text-decoration: line-through; opacity: .6; }
.mv .tg { font-size: 10px; font-weight: 800; padding: 1px 6px; border-radius: 5px; background: var(--linha); color: var(--texto-suave); margin-left: 4px; display: inline-block; }
.mv-lista { max-height: 55vh; overflow: auto; }
.est-lista { display: grid; gap: 6px; max-height: 300px; overflow: auto; margin-bottom: 12px; }
.est-lista label { display: flex; gap: 10px; align-items: center; padding: 10px; border: 1px solid var(--linha); border-radius: 9px; cursor: pointer; font-size: 14px; }
.est-lista label small { display: block; color: var(--texto-suave); font-size: 12px; overflow-wrap: anywhere; }
.est-lista input { width: 20px; height: 20px; flex: none; accent-color: var(--destaque); }
.est-lista .q { margin-left: auto; font-weight: 800; }
.campo-e { display: grid; gap: 5px; font-size: 11px; font-weight: 800; color: var(--texto-suave); letter-spacing: .4px; margin-bottom: 10px; }
.campo-e input { height: 48px; padding: 0 12px; font-size: 16px; }

@media (max-width: 760px) {
  .wiz h2 { font-size: 22px; }
  .acao { min-height: 100px; }
  .chips { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- Estoque · Operador (almoxarifado), em forma de perguntas:
     1) O que você vai fazer? (Com OP / Sem OP / Devolução)
     2) uma pergunta por tela até o CONFIRMAR  3) tela "Pronto".
     Regras do backend (30_Estoque.gs) continuam iguais:
     saída maior que o saldo = bloqueada; acima do previsto = só com
     motivo; embalagem só no processo de consumo (Inspeção Final);
     estorno dos próprios lançamentos (Admin: qualquer um). -->
<main class="conteudo">
  <div class="wiz" id="tela"><div class="carregando">Carregando…</div></div>
</main>

<script src="js/config.js"></script>
<script src="js/icones.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/sessao.js"></script>
<script src="js/shell.js"></script>
<script>
Sessao.iniciarPagina('estoque').then(function (ctx) {
  const $ = function (s) { return document.querySelector(s); };
  const e = Ui.esc;
  const tela = $('#tela');

  // Quem pode estornar: EDITAR em Estoque (os próprios) ou em Insumos (auditor)
  const podeEstornar = ctx.podeEditar || ctx.nivelDe('insumos') === 'EDITAR';

  // Passos de cada caminho (a ordem das perguntas)
  const PASSOS = {
    op: ['op-num', 'op-itens'],
    semop: ['so-ins', 'so-qtd', 'so-setor', 'so-fim'],
    dev: ['dv-op', 'dv-ins', 'dv-qtd', 'dv-fim']
  };

  let passo = 'inicio';          // tela atual
  let fluxo = '';                // op | semop | dev
  let insumos = [];              // cadastro com saldo (sem OP / devolução)
  let setores = [];
  let embalagens = [];
  let op = null;                 // { numero, estr, erro }
  let qtd = {}, motivo = {};     // retirada com OP: o que o operador escolheu, por insumo
  let semop = null, dev = null;
  let pronto = null;             // { titulo, texto, ids }
  let enviando = false;
  const pendente = {};           // idReq reaproveitado se o MESMO envio falhar e for repetido

  carregarInsumos();
  carregarEmbalagens();
  Api.chamar('setoresEstoque', {}, { rapido: function (s) { setores = s || []; } }).then(function (s) { setores = s || []; if (passo === 'so-setor') desenhar(); }).catch(function () {});
  desenhar();
  // Embalagens: atualiza a cada 60 s, só na tela inicial
  setInterval(function () { if (!document.hidden && passo === 'inicio' && !document.querySelector('.modal-fundo')) carregarEmbalagens(); }, 60000);

  // ---------- Números (aceita vírgula) ----------
  function num(v) {
    let t = String(v === undefined || v === null ? '' : v).trim();
    if (!t) return 0;
    if (t.indexOf(',') !== -1) t = t.replace(/\./g, '').replace(',', '.');
    const n = Number(t);
    return isNaN(n) ? NaN : Math.round(n * 1000) / 1000;
  }
  const mostrar = function (n) { return String(n).replace('.', ','); };
  function catClasse(c) { return { LUVA: 'luva', FILTRO: 'filtro', EMBALAGEM: 'emb' }[c] || ''; }
  function nomeQtd(it, n) {
    const nomes = { LUVA: ['luva', 'luvas'], FILTRO: ['filtro', 'filtros'], EMBALAGEM: ['caixa', 'caixas'] }[it.categoria];
    return '<b>' + e(Fmt.num(n)) + ' ' + (nomes ? nomes[n === 1 ? 0 : 1] : e(String(it.unidade || '').toLowerCase()) + ' de ' + e(it.cod_insumo)) + '</b>';
  }
  function juntar(partes) { return partes.length > 1 ? partes.slice(0, -1).join(', ') + ' e ' + partes[partes.length - 1] : partes.join(''); }
  function titulo(s) { s = String(s || '').toLowerCase(); return s.charAt(0).toUpperCase() + s.slice(1); }
  function temSaldo(i) { return i && i.saldo !== null && i.saldo !== undefined; }
  function nomeStatus(s) { return { SOLICITADO: 'pendente', COMPRADO: 'comprada', RECEBIDO: 'chegou', BAIXADO: 'baixada' }[s] || String(s || '').toLowerCase(); }

  // ---------- Envio com o mesmo idReq na repetição ----------
  async function enviar(rota, dados) {
    const chave = rota + JSON.stringify(dados);
    const idReq = pendente[chave] || Api.idReq();
    pendente[chave] = idReq;
    const r = await Api.chamar(rota, Object.assign({ idReq: idReq }, dados));
    delete pendente[chave];
    return r;
  }
  // Erro de regra (ex.: saldo): o próximo envio pode usar outro idReq
  function erroFinal(err) { if (err && err.codigo !== 'SEM_CONEXAO') Object.keys(pendente).forEach(function (k) { delete pendente[k]; }); }

  // ============================================================
  // NAVEGAÇÃO
  // ============================================================
  function irPara(novo) {
    passo = novo;
    desenhar();
    window.scrollTo(0, 0);
    const m = document.querySelector('main.conteudo'); if (m) m.scrollTop = 0;
    // foco no campo principal (no celular abre o teclado numérico da OP)
    const f = tela.querySelector('[data-foco]');
    if (f) setTimeout(function () { f.focus(); }, 30);
  }
  function comecar(novoFluxo) {
    fluxo = novoFluxo;
    op = { numero: '', estr: null, erro: '' }; qtd = {}; motivo = {};
    semop = { ins: null, qtd: 1, setor: '', motivo: '', busca: '' };
    dev = { op: '', estr: null, avisoOp: '', erro: '', ins: null, qtd: 1, motivo: '', busca: '' };
    irPara(PASSOS[fluxo][0]);
  }
  function voltar() {
    const l = PASSOS[fluxo] || [];
    const i = l.indexOf(passo);
    irPara(i > 0 ? l[i - 1] : 'inicio');
  }
  function avancar() {
    const l = PASSOS[fluxo];
    irPara(l[l.indexOf(passo) + 1]);
  }

  // Cabeçalho de cada passo: ← Voltar + "Passo X de Y" + a pergunta
  function cab(pergunta, sub) {
    const l = PASSOS[fluxo];
    return '<div class="wiz-topo"><button type="button" class="bg sec voltar" data-voltar>← Voltar</button>' +
      '<span class="wiz-passo">Passo ' + (l.indexOf(passo) + 1) + ' de ' + l.length + '</span></div>' +
      '<h2>' + pergunta + '</h2>' + (sub ? '<p class="sub">' + sub + '</p>' : '');
  }
  function btConfirmar(id, texto) {
    return ctx.podeEditar ? '<button type="button" class="bg ok" id="' + id + '">' + Ui.ic('i-check') + e(texto) + '</button>' : '';
  }

  function desenhar() {
    const f = {
      inicio: telaInicio, pronto: telaPronto,
      'op-num': telaOpNum, 'op-itens': telaOpItens,
      'so-ins': telaInsumo, 'so-qtd': telaQtd, 'so-setor': telaSetor, 'so-fim': telaSoFim,
      'dv-op': telaDevOp, 'dv-ins': telaInsumo, 'dv-qtd': telaQtd, 'dv-fim': telaDevFim
    }[passo];
    tela.innerHTML = f();
    depoisDeDesenhar();
  }
  function depoisDeDesenhar() {
    if (passo === 'op-itens' && op.estr && !op.estr.semBom) { op.estr.itens.forEach(function (it) { validarLinha(it.cod_insumo); }); resumoOP(); }
    if (passo === 'so-ins' || passo === 'dv-ins') desenharSugestoes();
    if (passo === 'so-qtd' || passo === 'dv-qtd') validarQtd();
  }

  // ============================================================
  // TELA 1: O que você vai fazer?
  // ============================================================
  function telaInicio() {
    const prontas = embalagens.filter(function (s) { return s.pronto; });
    const acoes = ctx.podeEditar
      ? botaoAcao('op', '#f07a1f', 'i-saida', 'RETIRAR COM OP', 'material para uma OP') +
        botaoAcao('semop', '#3b82f6', 'i-pacote', 'RETIRAR SEM OP', 'manutenção, teste, outro setor') +
        botaoAcao('dev', '#16a34a', 'i-volta', 'DEVOLUÇÃO', 'sobrou, volta para o estoque') +
        '<button type="button" class="bg acao em-breve" disabled style="--c:#64748b" title="Em breve: a entrada é lançada no Insumos"><span class="ic">' + Ui.ic('i-mais') + '</span><span><b>ENTRADA</b><small>em breve</small></span></button>'
      : botaoAcao('op', '#f07a1f', 'i-busca', 'CONSULTAR OP', 'ver a estrutura e o que já saiu');
    return '<h2>O que você vai fazer?</h2>' +
      (ctx.podeEditar ? '' : '<div class="msg-info leitura">Somente consulta: seu perfil vê o estoque, mas não lança retiradas nem devoluções.</div>') +
      '<div class="acoes">' + acoes + '</div>' +
      (ctx.podeEditar && prontas.length ? '<details class="emb" id="embalagens"><summary>Embalagens para baixar (' + prontas.length + ')</summary><div class="lista">' +
        prontas.map(function (s) {
          return '<button type="button" class="bg sec item-b" data-baixar="' + e(s.op) + '">OP ' + e(s.op) + ' · ' + e(s.cod_insumo) +
            '<span class="sl">' + e(Fmt.num(s.qtd)) + ' ' + e(String(s.unidade || '').toLowerCase()) + '</span><span class="d">' + e(titulo(s.cliente)) + ' · ' + e(s.descricao) + '</span></button>';
        }).join('') + '</div></details>' : '') +
      '<div class="rodape-w"><button type="button" class="link" id="bt-meus">Meus lançamentos de hoje</button></div>';
  }
  function botaoAcao(f, cor, ic, t, s) {
    return '<button type="button" class="bg acao" data-fluxo="' + f + '" style="--c:' + cor + '"><span class="ic">' + Ui.ic(ic) + '</span><span><b>' + t + '</b><small>' + s + '</small></span></button>';
  }

  // ============================================================
  // COM OP · passo 1: digite a OP
  // ============================================================
  function telaOpNum() {
    return cab('Digite a OP', 'Número da OP (ou leia o código de barras)') +
      '<input class="campo-g" id="op" data-foco inputmode="numeric" autocomplete="off" placeholder="nº da OP" value="' + e(op.numero) + '">' +
      '<div class="msg err" id="op-erro">' + e(op.erro) + '</div>' +
      '<button type="button" class="bg pri" id="bt-op">Continuar →</button>';
  }
  async function buscarOP() {
    const numero = String(op.numero || '').trim();
    if (!numero) { op.erro = 'Digite o número da OP.'; $('#op-erro').textContent = op.erro; return; }
    const bt = $('#bt-op');
    bt.disabled = true; bt.textContent = 'Buscando a OP ' + numero + '…';
    try {
      const r = await Api.chamar('estruturaOP', { op: numero });
      const mesma = op.estr && op.estr.id_item === r.id_item;
      op.estr = r; op.erro = '';
      if (!mesma) { qtd = {}; motivo = {}; }
      // já vem com o que falta (limitado ao saldo)
      r.itens.forEach(function (it) { qtd[it.cod_insumo] = it.liberado ? it.sugerido : 0; });
      if (passo === 'op-num') avancar();
    } catch (err) {
      op.estr = null; op.erro = err.message;
      if (passo === 'op-num') { $('#op-erro').textContent = op.erro; bt.disabled = false; bt.textContent = 'Continuar →'; }
    }
  }

  // ============================================================
  // COM OP · passo 2: insumos da OP
  // ============================================================
  function baseTexto(it) {
    const base = it.base === 'POR_PECA' ? 'por peça' : 'por molde';
    return Fmt.num(it.qtd_bom) + ' ' + base + (it.politica === 'SOB_DEMANDA' ? ' · sob demanda' : '');
  }
  function telaOpItens() {
    const x = op.estr;
    const topo = cab('Insumos da OP ' + e(x.op), 'Confira as quantidades e toque em CONFIRMAR') +
      '<div class="cartao op-cab" id="op-inf"><span><b>' + e(x.cliente || '—') + '</b></span>' +
      '<span>Item <b>' + e(x.codigo) + '</b> · ' + e(Fmt.num(x.moldes)) + ' moldes planejados · processo <b>' + e(x.processo) + '</b></span></div>';
    if (x.semBom) return topo + '<div class="cartao msg">O produto <b>' + e(x.codigo) + '</b> não tem estrutura (BOM) cadastrada.<br>Use a <b>Retirada sem OP</b> ou peça ao PCP para cadastrar a estrutura.</div>';
    return topo + '<div class="lista" id="op-itens">' + x.itens.map(function (it) {
      const nome = '<div class="nome"><span class="cat ' + catClasse(it.categoria) + '">' + e(it.categoria || 'OUTROS') + '</span><b>' + e(it.cod_insumo) + '</b><small>' + e(it.descricao) + ' · ' + e(baseTexto(it)) + '</small></div>';
      const nums = '<div class="nums"><span>Previsto <b>' + e(Fmt.num(it.previsto)) + '</b></span><span>Já retirado <b>' + e(Fmt.num(it.ja_retirado)) + '</b></span>' +
        '<span>Saldo <b' + (it.saldo > 0 ? '' : ' class="falta"') + '>' + e(Fmt.num(it.saldo)) + '</b></span></div>';
      if (!it.liberado) {
        return '<div class="cartao trav" data-cod="' + e(it.cod_insumo) + '">' + nome + nums + '<div class="trava">🔒 ' +
          (it.categoria === 'EMBALAGEM' ? 'A embalagem' : e(it.cod_insumo)) + ' ' + e(String(it.bloqueio || '').replace(/^Só é baixada/, 'só é baixada')) +
          (it.id_solicitacao ? ' Já foi pedida ao Compras quando a OP abriu (solicitação ' + e(it.id_solicitacao) + ' · ' + e(nomeStatus(it.status_solicitacao)) + ').' : '') + '</div></div>';
      }
      const off = !ctx.podeEditar;
      return '<div class="cartao" data-cod="' + e(it.cod_insumo) + '">' + nome + nums +
        '<div class="passo' + (off ? ' off' : '') + '"><button type="button" data-passo="-1"' + (off ? ' disabled' : '') + ' aria-label="menos">−</button>' +
        '<input data-qtd inputmode="decimal" value="' + e(mostrar(qtd[it.cod_insumo] || 0)) + '"' + (off ? ' disabled' : '') + '>' +
        '<button type="button" data-passo="1"' + (off ? ' disabled' : '') + ' aria-label="mais">+</button></div>' +
        '<div class="extra"></div></div>';
    }).join('') + '</div>' +
      '<div class="resumo" id="op-resumo"></div>' + btConfirmar('bt-retirar', 'CONFIRMAR RETIRADA');
  }
  function itemDe(cod) { return op.estr ? op.estr.itens.find(function (i) { return i.cod_insumo === cod; }) : null; }

  // Marca no cartão: saldo insuficiente (bloqueia) e acima do previsto (pede motivo)
  function validarLinha(cod) {
    const it = itemDe(cod);
    const linha = tela.querySelector('#op-itens .cartao[data-cod="' + CSS.escape(cod) + '"]');
    if (!it || !linha || !it.liberado) return;
    const q = num(qtd[cod]);
    const extra = linha.querySelector('.extra');
    const acimaSaldo = q > it.saldo + 1e-9;
    const acimaPrev = q > 0 && it.ja_retirado + q > it.previsto + 1e-9;
    linha.classList.toggle('erro-saldo', acimaSaldo || isNaN(q));
    linha.classList.toggle('acima', !acimaSaldo && acimaPrev);
    let h = '';
    if (isNaN(q)) h += '<span class="erro-l">Quantidade inválida.</span>';
    else if (acimaSaldo) h += '<span class="erro-l">Saldo no sistema é ' + e(Fmt.num(it.saldo)) + ': não dá para tirar ' + e(Fmt.num(q)) + '. Se o físico não bate, peça a Compras um inventário.</span>';
    if (!acimaSaldo && acimaPrev) {
      if (extra.querySelector('[data-motivo]')) return;   // já está na tela: não perde o que foi digitado
      h += '<span class="aviso-l">Acima do previsto (previsto ' + e(Fmt.num(it.previsto)) + ', já retirado ' + e(Fmt.num(it.ja_retirado)) + '): informe o motivo.</span>' +
        '<input class="campo-t" data-motivo placeholder="Motivo (ex.: luva quebrada, molde refeito)" value="' + e(motivo[cod] || '') + '">';
    }
    extra.innerHTML = h;
  }
  function linhasOP() {
    if (!op.estr || op.estr.semBom) return [];
    return op.estr.itens.filter(function (it) { return it.liberado && num(qtd[it.cod_insumo]) > 0; })
      .map(function (it) { return { it: it, q: num(qtd[it.cod_insumo]) }; });
  }
  function opInvalida() {
    return op.estr.itens.find(function (it) { const q = num(qtd[it.cod_insumo]); return it.liberado && (isNaN(q) || q > it.saldo + 1e-9); });
  }
  function resumoOP() {
    const el = $('#op-resumo');
    if (!el) return;
    const l = linhasOP();
    el.innerHTML = l.length ? 'Retirando ' + juntar(l.map(function (x) { return nomeQtd(x.it, x.q); })) + ' para a OP ' + e(op.estr.op)
      : 'Nada a retirar agora' + (op.estr.itens.every(function (it) { return !it.liberado || it.falta === 0; }) ? ': a OP já retirou o previsto.' : '.');
    // saldo insuficiente ou número inválido: bloqueia (regra aprovada)
    const bt = $('#bt-retirar');
    if (bt) bt.disabled = !l.length || enviando || !!opInvalida();
  }
  async function confirmarOP() {
    if (enviando || !op.estr) return;
    const l = linhasOP();
    if (!l.length) return;
    // bloqueios na tela (o servidor confere de novo)
    const invalida = opInvalida();
    if (invalida) { Ui.toast(invalida.cod_insumo + ': quantidade maior que o saldo do sistema (' + Fmt.num(invalida.saldo) + '). Corrija antes de confirmar.', 'erro', 'Saldo insuficiente'); return; }
    const semMotivo = l.find(function (x) { return x.it.ja_retirado + x.q > x.it.previsto + 1e-9 && !String(motivo[x.it.cod_insumo] || '').trim(); });
    if (semMotivo) {
      const c = tela.querySelector('#op-itens .cartao[data-cod="' + CSS.escape(semMotivo.it.cod_insumo) + '"] [data-motivo]');
      if (c) { c.classList.add('falta-motivo'); c.focus(); }
      Ui.toast(semMotivo.it.cod_insumo + ': retirada acima do previsto precisa de motivo.', 'aviso', 'Informe o motivo');
      return;
    }
    const dados = { op: op.estr.op, itens: l.map(function (x) {
      const m = { cod_insumo: x.it.cod_insumo, qtd: x.q };
      if (x.it.ja_retirado + x.q > x.it.previsto + 1e-9) m.motivo = String(motivo[x.it.cod_insumo]).trim();
      return m;
    }) };
    const resumo = $('#op-resumo').innerHTML;
    await gravar('retirarComOP', dados, '#bt-retirar', function (r) {
      Ui.toast($('#op-resumo').textContent, 'ok', 'Retirada registrada');
      return { titulo: 'Retirada registrada', texto: resumo, ids: r.ids || [] };
    });
  }

  // ============================================================
  // GRAVAR (comum aos 3 caminhos) → tela "Pronto"
  // ============================================================
  async function gravar(rota, dados, seletorBt, depois) {
    enviando = true;
    const bt = $(seletorBt);
    const txt = bt ? bt.innerHTML : '';
    if (bt) { bt.disabled = true; bt.innerHTML = 'Gravando…'; }
    try {
      const r = await enviar(rota, dados) || {};
      if (r.duplicado) {
        Ui.toast('Este lançamento já tinha sido gravado.', 'aviso');
        pronto = { titulo: 'Já estava gravado', texto: 'Este lançamento já tinha sido gravado.', ids: [] };
      } else pronto = depois(r);
      enviando = false;
      carregarInsumos();
      carregarEmbalagens();
      irPara('pronto');
    } catch (err) {
      erroFinal(err);
      Ui.erro(err);
      enviando = false;
      const b2 = $(seletorBt);
      if (b2) { b2.innerHTML = txt; b2.disabled = false; }
      if (passo === 'op-itens') resumoOP();
    }
  }
  function telaPronto() {
    return '<div class="pronto"><h2>Pronto ✅</h2><div class="dica">' + e(pronto.titulo) + '</div>' +
      '<div class="resumo">' + pronto.texto + '</div>' +
      (pronto.ids.length ? '<div class="ids">' + e(pronto.ids.join(', ')) + '</div>' : '') +
      '<button type="button" class="bg pri" id="bt-nova">Nova ação</button></div>';
  }

  // ============================================================
  // ESCOLHA DE INSUMO (sem OP e devolução)
  // ============================================================
  async function carregarInsumos() {
    try {
      // situacaoInsumos traz o saldo; sem acesso a Insumos, usa só o cadastro
      // dados guardados: a lista aparece na hora; o saldo é conferido de novo no servidor ao lançar
      const rapido = { rapido: function () { carregarInsumos(); } };
      if (ctx.nivelDe('insumos') !== 'NENHUM') insumos = await Api.chamar('situacaoInsumos', {}, rapido);
      else insumos = (await Api.chamar('listarInsumos', {}, rapido)).map(function (i) {
        return { cod_insumo: i.COD_INSUMO, descricao: i.DESCRICAO, categoria: i.CATEGORIA, unidade: i.UNIDADE, politica: i.POLITICA, saldo: null };
      });
      // atualiza o saldo do insumo escolhido
      [semop, dev].forEach(function (f) { if (f && f.ins) f.ins = insumos.find(function (i) { return i.cod_insumo === f.ins.cod_insumo; }) || f.ins; });
      if (passo === 'so-ins' || passo === 'dv-ins') desenharSugestoes();
    } catch (err) { /* a busca de insumo mostra o aviso */ }
  }
  function formAtual() { return fluxo === 'semop' ? semop : dev; }

  function telaInsumo() {
    const f = formAtual();
    let h = cab('Qual insumo?', fluxo === 'dev' ? 'O que está voltando para o estoque' : 'Digite o código ou parte do nome');
    // devolução com OP: primeiro o que a OP levou
    const retirados = fluxo === 'dev' && dev.estr ? dev.estr.itens.filter(function (it) { return it.ja_retirado > 0; }) : [];
    if (retirados.length) {
      h += '<div class="dica">Retirado pela OP ' + e(dev.estr.op) + ':</div><div class="lista" id="dv-da-op">' + retirados.map(function (it) {
        return '<button type="button" class="bg sec item-b" data-pega-op="' + e(it.cod_insumo) + '"><span class="cat ' + catClasse(it.categoria) + '">' + e(it.categoria || 'OUTROS') + '</span>' + e(it.cod_insumo) +
          '<span class="sl">retirou ' + e(Fmt.num(it.ja_retirado)) + '</span><span class="d">' + e(it.descricao) + '</span></button>';
      }).join('') + '</div><div class="dica">Ou procure outro insumo:</div>';
    }
    return h + '<input class="campo-t" id="busca"' + (retirados.length ? '' : ' data-foco') + ' placeholder="Ex.: MP00056, luva 4x7" autocomplete="off" value="' + e(f.busca) + '">' +
      '<div class="lista" id="sug"></div>';
  }
  function sugestoes(texto) {
    const t = String(texto || '').toUpperCase().replace(/\s+/g, ' ').trim();
    let l = insumos;
    if (!t) l = l.filter(function (i) { return i.categoria === 'LUVA' || i.categoria === 'FILTRO'; });
    // cada palavra digitada precisa aparecer (ex.: "luva 4x7")
    else l = l.filter(function (i) { const alvo = (i.cod_insumo + ' ' + i.descricao + ' ' + i.categoria).toUpperCase(); return t.split(' ').every(function (p) { return alvo.indexOf(p) !== -1; }); });
    return l.slice(0, 8);
  }
  function desenharSugestoes() {
    const cx = $('#sug');
    if (!cx) return;
    const l = sugestoes(formAtual().busca);
    cx.innerHTML = l.map(function (i) {
      return '<button type="button" class="bg sec item-b" data-pega="' + e(i.cod_insumo) + '"><span class="cat ' + catClasse(i.categoria) + '">' + e(i.categoria || 'OUTROS') + '</span>' + e(i.cod_insumo) +
        (temSaldo(i) ? '<span class="sl">saldo ' + e(Fmt.num(i.saldo)) + '</span>' : '') + '<span class="d">' + e(i.descricao) + '</span></button>';
    }).join('') || '<div class="dica">' + (insumos.length ? 'Nenhum insumo encontrado.' : 'Carregando insumos…') + '</div>';
  }

  // ============================================================
  // QUANTIDADE (sem OP e devolução)
  // ============================================================
  function cartaoInsumo(ins) {
    return '<div class="cartao ins-sel"><div class="nome"><span class="cat ' + catClasse(ins.categoria) + '">' + e(ins.categoria || 'OUTROS') + '</span><b>' + e(ins.cod_insumo) + '</b>' +
      '<small>' + e(ins.descricao) + (temSaldo(ins) ? ' · saldo ' + e(Fmt.num(ins.saldo)) + ' ' + e(String(ins.unidade || '').toLowerCase()) : '') + '</small></div></div>';
  }
  function telaQtd() {
    const f = formAtual();
    const off = !ctx.podeEditar;
    return cab('Quantidade', fluxo === 'dev' ? 'Quanto está voltando?' : 'Quanto você vai tirar?') + cartaoInsumo(f.ins) +
      '<div class="passo' + (off ? ' off' : '') + '"><button type="button" data-passo="-1"' + (off ? ' disabled' : '') + ' aria-label="menos">−</button>' +
      '<input id="qtd" inputmode="decimal" value="' + e(mostrar(f.qtd)) + '"' + (off ? ' disabled' : '') + '>' +
      '<button type="button" data-passo="1"' + (off ? ' disabled' : '') + ' aria-label="mais">+</button></div>' +
      '<div id="qtd-aviso"></div><button type="button" class="bg pri" id="bt-qtd">Continuar →</button>';
  }
  function limiteDev() {
    if (!dev.estr || !dev.ins) return null;
    const it = dev.estr.itens.find(function (x) { return x.cod_insumo === dev.ins.cod_insumo; });
    return it ? it.ja_retirado : 0;
  }
  // devolve true se a quantidade pode seguir
  function validarQtd() {
    const f = formAtual();
    const q = num(f.qtd);
    let msg = '';
    if (isNaN(q)) msg = 'Quantidade inválida.';
    else if (fluxo === 'semop' && temSaldo(f.ins) && q > f.ins.saldo + 1e-9) msg = 'Saldo no sistema é ' + Fmt.num(f.ins.saldo) + ': não dá para tirar ' + Fmt.num(q) + '.';
    else if (fluxo === 'dev') { const lim = limiteDev(); if (lim !== null && q > lim + 1e-9) msg = 'A OP ' + dev.estr.op + ' retirou ' + Fmt.num(lim) + ' de ' + dev.ins.cod_insumo + ': não dá para devolver ' + Fmt.num(q) + '.'; }
    const av = $('#qtd-aviso');
    if (av) av.innerHTML = msg ? '<span class="erro-l">' + e(msg) + '</span>' : '';
    const ok = !msg && q > 0;
    const bt = $('#bt-qtd'); if (bt) bt.disabled = !ok;
    return ok;
  }

  // ============================================================
  // SEM OP · setor e motivo
  // ============================================================
  function telaSetor() {
    return cab('Setor', 'Qual setor vai usar o material?') +
      '<div class="chips" id="so-setor">' + (setores.map(function (s) {
        return '<button type="button" class="bg sec" data-setor="' + e(s) + '">' + e(titulo(s)) + '</button>';
      }).join('') || '<span class="dica">Carregando setores…</span>') + '</div>';
  }
  function telaSoFim() {
    const ins = semop.ins, q = num(semop.qtd);
    return cab('Motivo', 'Para que é o material? (obrigatório sem OP)') +
      '<input class="campo-t" id="so-motivo" data-foco placeholder="Ex.: teste de molde, manutenção do forno" value="' + e(semop.motivo) + '">' +
      '<div class="resumo" id="so-resumo">Retirando ' + nomeQtd(ins, q) + (ins.categoria in { LUVA: 1, FILTRO: 1, EMBALAGEM: 1 } ? ' (' + e(ins.cod_insumo) + ')' : '') + ' para ' + e(titulo(semop.setor)) + '</div>' +
      btConfirmar('bt-semop', 'CONFIRMAR RETIRADA');
  }
  async function confirmarSemOP() {
    if (enviando) return;
    const q = num(semop.qtd);
    if (!semop.ins || !(q > 0)) return;
    if (!semop.setor) { Ui.toast('Escolha o setor que vai usar o material.', 'aviso', 'Falta o setor'); return; }
    if (!semop.motivo.trim()) { const c = $('#so-motivo'); c.classList.add('falta-motivo'); c.focus(); Ui.toast('Informe o motivo da retirada sem OP.', 'aviso', 'Falta o motivo'); return; }
    const ins = semop.ins;
    const dados = { cod_insumo: ins.cod_insumo, qtd: q, setor: semop.setor, motivo: semop.motivo.trim() };
    const resumo = $('#so-resumo').innerHTML + ' · ' + e(dados.motivo);
    await gravar('retirarSemOP', dados, '#bt-semop', function (r) {
      Ui.toast(ins.cod_insumo + ' · ' + Fmt.num(q) + ' para ' + titulo(dados.setor) + (r.id ? ' · ' + r.id : ''), 'ok', 'Retirada sem OP registrada');
      return { titulo: 'Retirada sem OP registrada', texto: resumo, ids: r.id ? [r.id] : [] };
    });
  }

  // ============================================================
  // DEVOLUÇÃO · OP (ou pular) e motivo
  // ============================================================
  function telaDevOp() {
    return cab('De qual OP?', 'Se o material saiu para uma OP, digite o número. Se não, toque em "Sem OP".') +
      '<input class="campo-g" id="dev-op" data-foco inputmode="numeric" autocomplete="off" placeholder="nº da OP" value="' + e(dev.op) + '">' +
      '<div class="msg err" id="dev-op-erro">' + e(dev.erro) + '</div>' +
      '<button type="button" class="bg pri" id="bt-dev-op">Continuar →</button>' +
      '<button type="button" class="bg sec" id="bt-dev-pular">Sem OP (pular)</button>';
  }
  async function buscarDevOP() {
    const numero = String(dev.op || '').trim();
    if (!numero) { pularDevOP(); return; }
    const bt = $('#bt-dev-op');
    bt.disabled = true; bt.textContent = 'Buscando a OP ' + numero + '…';
    dev.estr = null; dev.avisoOp = ''; dev.erro = '';
    try {
      dev.estr = await Api.chamar('estruturaOP', { op: numero });
    } catch (err) {
      // OP fechada (ex.: expedida) aceita devolução: o servidor confere o limite
      if (err.codigo === 'OP_INATIVA') dev.avisoOp = err.message.replace('não aceita retirada', 'a devolução é aceita');
      else dev.erro = err.message;
    }
    if (passo !== 'dv-op') return;
    if (dev.erro) { $('#dev-op-erro').textContent = dev.erro; bt.disabled = false; bt.textContent = 'Continuar →'; return; }
    if (dev.avisoOp) Ui.toast(dev.avisoOp, 'aviso');
    dev.ins = null;
    avancar();
  }
  function pularDevOP() { dev.op = ''; dev.estr = null; dev.avisoOp = ''; dev.erro = ''; dev.ins = null; avancar(); }
  function telaDevFim() {
    const semOp = !dev.op.trim(), q = num(dev.qtd);
    return cab('Motivo', semOp ? 'Devolução sem OP: o motivo é obrigatório.' : 'Opcional com OP') +
      '<input class="campo-t" id="dv-motivo" data-foco placeholder="Ex.: sobrou do molde" value="' + e(dev.motivo) + '">' +
      '<div class="resumo" id="dv-resumo">Devolvendo ' + nomeQtd(dev.ins, q) + ' (' + e(dev.ins.cod_insumo) + ')' + (semOp ? ' sem OP' : ' da OP ' + e(dev.op.trim())) + '</div>' +
      btConfirmar('bt-dev', 'CONFIRMAR DEVOLUÇÃO');
  }
  async function confirmarDev() {
    if (enviando) return;
    const q = num(dev.qtd);
    if (!dev.ins || !(q > 0)) return;
    const semOp = !dev.op.trim();
    if (semOp && !dev.motivo.trim()) { const c = $('#dv-motivo'); c.classList.add('falta-motivo'); c.focus(); Ui.toast('Devolução sem OP precisa de motivo.', 'aviso', 'Falta o motivo'); return; }
    const dados = { cod_insumo: dev.ins.cod_insumo, qtd: q };
    if (!semOp) dados.op = dev.op.trim();
    if (dev.motivo.trim()) dados.motivo = dev.motivo.trim();
    const ins = dev.ins;
    const resumo = $('#dv-resumo').innerHTML + (dados.motivo ? ' · ' + e(dados.motivo) : '');
    await gravar('devolver', dados, '#bt-dev', function (r) {
      Ui.toast(ins.cod_insumo + ' · +' + Fmt.num(q) + (semOp ? '' : ' da OP ' + dados.op) + (r.id ? ' · ' + r.id : ''), 'ok', 'Devolução registrada');
      return { titulo: 'Devolução registrada', texto: resumo, ids: r.id ? [r.id] : [] };
    });
  }

  // ============================================================
  // EVENTOS (um só ouvinte para a tela toda)
  // ============================================================
  tela.addEventListener('click', function (ev) {
    const t = ev.target;
    const b = function (s) { return t.closest(s); };
    if (b('[data-voltar]')) return voltar();
    if (b('[data-fluxo]')) return comecar(b('[data-fluxo]').dataset.fluxo);
    if (b('#bt-meus')) return abrirMeus();
    if (b('#bt-nova')) return irPara('inicio');
    if (b('[data-baixar]')) {
      // embalagem que chegou: abre a retirada com a OP
      comecar('op'); op.numero = b('[data-baixar]').dataset.baixar; desenhar(); buscarOP(); return;
    }
    // botões − / +
    const bp = b('[data-passo]');
    if (bp && !bp.disabled) {
      const inp = bp.closest('.passo').querySelector('input');
      const atual = num(inp.value);
      const novo = Math.max(0, Math.round(((isNaN(atual) ? 0 : atual) + Number(bp.dataset.passo)) * 1000) / 1000);
      inp.value = mostrar(novo);
      inp.dispatchEvent(new Event('input', { bubbles: true }));
      return;
    }
    if (b('#bt-op')) return buscarOP();
    if (b('#bt-retirar')) return confirmarOP();
    if (b('#bt-dev-op')) return buscarDevOP();
    if (b('#bt-dev-pular')) return pularDevOP();
    const pega = b('[data-pega]') || b('[data-pega-op]');
    if (pega) {
      const cod = pega.dataset.pega || pega.dataset.pegaOp;
      let ins = insumos.find(function (i) { return i.cod_insumo === cod; });
      if (!ins && dev.estr) {
        const it = dev.estr.itens.find(function (x) { return x.cod_insumo === cod; });
        ins = { cod_insumo: it.cod_insumo, descricao: it.descricao, categoria: it.categoria, unidade: it.unidade, saldo: it.saldo };
      }
      formAtual().ins = ins;
      return avancar();
    }
    if (b('#bt-qtd')) { if (validarQtd()) avancar(); return; }
    const s = b('[data-setor]');
    if (s) { semop.setor = s.dataset.setor; return avancar(); }
    if (b('#bt-semop')) return confirmarSemOP();
    if (b('#bt-dev')) return confirmarDev();
  });

  tela.addEventListener('input', function (ev) {
    const t = ev.target;
    if (t.id === 'op') { op.numero = t.value; op.erro = ''; $('#op-erro').textContent = ''; }
    if (t.id === 'dev-op') { dev.op = t.value; dev.erro = ''; $('#dev-op-erro').textContent = ''; }
    if (t.id === 'busca') { formAtual().busca = t.value; desenharSugestoes(); }
    if (t.id === 'qtd') { formAtual().qtd = t.value; validarQtd(); }
    if (t.id === 'so-motivo') { semop.motivo = t.value; t.classList.remove('falta-motivo'); }
    if (t.id === 'dv-motivo') { dev.motivo = t.value; t.classList.remove('falta-motivo'); }
    const linha = t.closest('#op-itens .cartao[data-cod]');
    if (linha) {
      const cod = linha.dataset.cod;
      if (t.matches('[data-qtd]')) { qtd[cod] = t.value; validarLinha(cod); resumoOP(); }
      if (t.matches('[data-motivo]')) { motivo[cod] = t.value; t.classList.remove('falta-motivo'); }
    }
  });
  // Enter = Continuar (leitor de código de barras manda Enter no fim)
  tela.addEventListener('keydown', function (ev) {
    if (ev.key !== 'Enter') return;
    const id = ev.target.id;
    const alvo = { op: '#bt-op', 'dev-op': '#bt-dev-op', qtd: '#bt-qtd' }[id];
    if (alvo) { ev.preventDefault(); const bt = $(alvo); if (bt && !bt.disabled) bt.click(); }
  });

  // ============================================================
  // EMBALAGENS PARA BAIXAR (discreto na tela inicial)
  // ============================================================
  async function carregarEmbalagens() {
    try {
      embalagens = await Api.chamar('embalagensParaBaixar', {}, { rapido: function () { carregarEmbalagens(); } }) || [];
      if (passo === 'inicio') {
        const aberto = $('#embalagens') && $('#embalagens').open;
        desenhar();
        if (aberto && $('#embalagens')) $('#embalagens').open = true;
      }
    } catch (err) { /* lista opcional */ }
  }

  // ============================================================
  // MEUS LANÇAMENTOS DE HOJE + ESTORNO
  // ============================================================
  function textoMov(m) {
    const cat = String(m.categoria || '').toLowerCase();
    let d;
    if (m.tipo === 'SAIDA_OP') d = 'OP ' + m.op + ' · retirada' + (m.motivo ? ' · ' + m.motivo : '');
    else if (m.tipo === 'SAIDA_SEM_OP') d = 'sem OP · ' + titulo(m.setor) + (m.motivo ? ' · ' + m.motivo : '');
    else if (m.tipo === 'DEVOLUCAO') d = 'devolução' + (m.op ? ' · OP ' + m.op : '') + (m.motivo ? ' · ' + m.motivo : '');
    else if (m.tipo === 'ENTRADA') d = 'entrada' + (m.op ? ' · OP ' + m.op : '');
    else if (m.tipo === 'AJUSTE_INVENTARIO') d = 'ajuste de inventário';
    else if (m.tipo === 'ESTORNO') d = 'estorno' + (m.motivo ? ' · ' + m.motivo : '');
    else d = String(m.tipo || '').toLowerCase();
    return { t: m.cod_insumo + (cat ? ' · ' + cat : ''), d: d };
  }
  function qtdMov(m) { return (m.qtd > 0 ? '+' : m.qtd < 0 ? '−' : '') + Fmt.num(Math.abs(m.qtd)); }

  async function abrirMeus() {
    let movs;
    try { movs = await Api.chamar('meusMovimentosHoje', {}) || []; } catch (err) { Ui.erro(err); return; }
    const corpo = '<div class="mv-lista" id="movimentos">' + movs.map(function (m) {
      const x = textoMov(m);
      return '<div class="mv' + (m.estornado ? ' estornado' : '') + '" data-mov="' + e(m.id) + '"><span class="h">' + e(m.hora) + '</span>' +
        '<span><span>' + e(x.t) + '</span>' + (m.estornado ? '<span class="tg">estornado</span>' : '') + '<small>' + e(x.d) + ' · ' + e(m.id) + '</small></span>' +
        '<span class="q ' + (m.qtd < 0 ? 's' : 'e') + '">' + e(qtdMov(m)) + '</span></div>';
    }).join('') + (movs.length ? '' : '<p class="mut">Nenhum lançamento seu hoje.</p>') + '</div>';
    const botoes = [{ texto: 'Fechar', valor: null }];
    if (podeEstornar) botoes.push({ texto: 'Estornar um lançamento', classe: 'pri', valor: 'est' });
    Ui.janela({ titulo: 'Meus lançamentos de hoje', subtitulo: movs.length + ' movimento' + (movs.length === 1 ? '' : 's'), largura: 520, corpo: corpo, enterConfirma: false, botoes: botoes })
      .then(function (v) { if (v === 'est') abrirEstorno(movs); });
  }

  // Estorno (nada é apagado: grava uma linha ESTORNO)
  function abrirEstorno(movs) {
    const lista = movs.filter(function (m) { return m.pode_estornar; });
    const corpo = '<div class="msg-erro"></div>' +
      (lista.length ? '<div class="est-lista">' + lista.map(function (m, i) {
        const x = textoMov(m);
        return '<label><input type="radio" name="mov" value="' + e(m.id) + '"' + (i === 0 ? ' checked' : '') + '><span>' + e(m.hora) + ' · ' + e(x.t) + '<small>' + e(x.d) + ' · ' + e(m.id) + '</small></span><span class="q">' + e(qtdMov(m)) + '</span></label>';
      }).join('') + '</div>' : '<p class="mut" style="margin-top:0">Nenhum lançamento seu de hoje para estornar.</p>') +
      '<label class="campo-e">OU O ID DE OUTRO LANÇAMENTO SEU' + (ctx.usuario.cargo === 'ADMIN' ? ' (ADMIN: QUALQUER UM)' : '') + '<input name="outro" placeholder="ME-000123" autocomplete="off"></label>' +
      '<label class="campo-e">MOTIVO DO ESTORNO<input name="motivo" placeholder="Ex.: baixei na OP errada" autocomplete="off"></label>';
    Ui.janela({
      titulo: 'Estornar lançamento',
      subtitulo: 'Nada é apagado: o sistema grava um estorno com a quantidade invertida.',
      largura: 480, corpo: corpo, enterConfirma: false,
      botoes: [{ texto: 'Voltar', valor: null }, { texto: 'Estornar', classe: 'perigo', valor: 'ok' }],
      antesDeFechar: async function (v, cx) {
        const erro = cx.querySelector('.msg-erro');
        const outro = cx.querySelector('[name="outro"]').value.trim().toUpperCase();
        const marcado = cx.querySelector('[name="mov"]:checked');
        const id = outro || (marcado ? marcado.value : '');
        const mot = cx.querySelector('[name="motivo"]').value.trim();
        if (!id) { Ui.msgErro(erro, 'Escolha o lançamento (ou digite o ID).'); return false; }
        if (!mot) { Ui.msgErro(erro, 'Informe o motivo do estorno.'); cx.querySelector('[name="motivo"]').focus(); return false; }
        try {
          const r = await enviar('estornarMovimento', { id: id, motivo: mot });
          Ui.toast(r.duplicado ? 'Este estorno já tinha sido gravado.' : id + ' estornado (' + r.id + ').', r.duplicado ? 'aviso' : 'ok', 'Estorno registrado');
          return true;
        } catch (err) {
          erroFinal(err);
          Ui.msgErro(erro, err.message);
          return false;
        }
      }
    }).then(function (v) {
      if (v !== 'ok') return;
      carregarInsumos();
      carregarEmbalagens();
    });
  }
});
</script>
</body>
</html>
