<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Histórico de Corridas · Prometals</title>
<link rel="stylesheet" href="css/tema.css">
<link rel="stylesheet" href="css/sistema.css">
<style>
/* ---------- específico desta página ---------- */
.filtros { display: flex; gap: 10px; align-items: center; background: var(--painel); border: 1px solid var(--linha); border-radius: 12px; padding: 10px 12px; margin-bottom: 14px; flex-wrap: wrap; }
.filtros select, .filtros input { height: 36px; font-size: 13px; padding: 0 10px; width: auto; }
.filtros select { min-width: 150px; }
.filtros .f-busca { flex: 1; min-width: 220px; position: relative; }
.filtros .f-busca input { width: 100%; padding-left: 34px; }
.filtros .f-busca svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--texto-suave); }
.chk-lbl { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--texto-suave); white-space: nowrap; cursor: pointer; }
.chk, .filtros input.chk { width: 16px; height: 16px; padding: 0; margin: 0; accent-color: var(--destaque); cursor: pointer; }
.mes { display: flex; align-items: center; border: 1px solid var(--borda); border-radius: 10px; overflow: hidden; height: 36px; }
.mes button { width: 34px; height: 100%; border: 0; background: var(--painel-2); cursor: pointer; font-weight: 800; color: var(--texto-suave); }
.mes .r { padding: 0 14px; font-size: 12.5px; white-space: nowrap; color: var(--texto-suave); }
.mes .r b.m { color: var(--destaque); }
.n-mol { color: #60a5fa; font-weight: 700; } .n-kg { color: #34d399; font-weight: 700; }
html.tema-claro .n-mol { color: #1d4ed8; } html.tema-claro .n-kg { color: #166534; }

.corr { background: var(--painel); border: 1px solid var(--linha); border-radius: 12px; margin-bottom: 12px; overflow: hidden; }
.corr-cab { display: flex; align-items: center; gap: 14px; padding: 12px 16px; flex-wrap: wrap; }
.corr-cab .id { font-family: ui-monospace, Consolas, monospace; font-size: 16px; font-weight: 800; color: var(--destaque); }
.corr-cab .meta { display: flex; gap: 14px; font-size: 12px; color: var(--texto-suave); flex-wrap: wrap; }
.corr-cab .meta span { display: inline-flex; align-items: center; gap: 5px; }
.corr-cab .meta svg { width: 14px; height: 14px; }
.corr-cab .tot { margin-left: auto; display: flex; gap: 14px; font-size: 13px; align-items: center; flex-wrap: wrap; }
.corr-cab .btn2 { height: 32px; padding: 0 12px; font-size: 12px; }
.corr .btn2.perigo, .cm-corr .btn2.perigo { color: #f87171; border-color: rgba(220,38,38,.45); background: transparent; }
html.tema-claro .corr .btn2.perigo, html.tema-claro .cm-corr .btn2.perigo { color: #b91c1c; }
.liga { display: inline-block; font-size: 11px; font-weight: 800; padding: 2px 8px; border-radius: 6px; background: color-mix(in srgb, var(--destaque) 18%, transparent); color: var(--destaque); }
.corr table.tab th { background: var(--bg); }
.corr .tab-wrap { overflow-x: auto; }
table.tab td.desc { max-width: 320px; overflow: hidden; text-overflow: ellipsis; }
.seq { display: inline-grid; place-items: center; width: 24px; height: 22px; border-radius: 6px; background: var(--painel-2); font-weight: 800; font-size: 12px; flex: none; }
.bt-est { height: 28px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--borda); background: transparent; font-size: 12px; font-weight: 700; cursor: pointer; display: inline-flex; align-items: center; gap: 5px; }
.bt-est svg { width: 14px; height: 14px; }
.est-info { font-size: 11px; color: #f59e0b; display: block; margin-top: 2px; font-weight: 600; }
tr.estornado td { opacity: .5; text-decoration: line-through; }
tr.estornado td:last-child { text-decoration: none; }
.corr.cancelada, .cm-corr.cancelada { opacity: .6; }
.corr.cancelada .id, .cm-corr.cancelada .id { text-decoration: line-through; color: var(--texto-suave); }
.corr.cancelada td { text-decoration: line-through; }
.tag-c { font-size: 11px; font-weight: 800; padding: 3px 8px; border-radius: 6px; background: rgba(220,38,38,.15); color: #f87171; }
.corr-rod { padding: 8px 16px; font-size: 11.5px; color: var(--texto-suave); border-top: 1px solid var(--linha); display: flex; gap: 8px; align-items: flex-start; }
.corr-rod svg { width: 14px; height: 14px; color: #f59e0b; flex: none; margin-top: 1px; }
.corr-rod div + div { margin-top: 3px; }
.oculto-busca { font-size: 11.5px; color: var(--texto-suave); padding: 6px 16px; border-top: 1px solid var(--linha); }

/* janela de estorno / cancelamento */
.resumo-op { background: var(--bg); border: 1px solid var(--linha); border-radius: 10px; padding: 12px 14px; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; font-size: 13px; margin-bottom: 12px; }
html.tema-claro .resumo-op { background: #f8fafc; }
.resumo-op span { color: var(--texto-suave); }
.est-campo { display: grid; gap: 6px; font-size: 12px; font-weight: 700; color: var(--texto-suave); margin-bottom: 12px; }
.est-campo small { font-weight: 600; }
.est-passo { display: inline-flex; align-items: center; border: 1px solid var(--destaque); border-radius: 8px; overflow: hidden; height: 38px; width: 150px; }
.est-passo button { width: 40px; height: 100%; border: 0; background: var(--painel-2); font-size: 16px; font-weight: 700; cursor: pointer; }
.est-passo input { flex: 1; min-width: 0; height: 100%; border: 0; border-radius: 0; text-align: center; padding: 0; font-weight: 800; color: var(--destaque); }
.est-campo select, .est-campo input[type=text] { height: 40px; padding: 0 10px; }
.modal-caixa .corpo p.exp { margin: 0 0 12px; color: var(--texto-suave); font-size: 13px; }

/* celular */
.km { border: 0; font: inherit; }
.km.mes-m { gap: 4px; }
.km.mes-m button { border: 0; background: transparent; color: var(--texto-suave); font-weight: 800; font-size: 15px; padding: 0 4px; cursor: pointer; }
.cm-corr { background: var(--painel); border: 1px solid var(--linha); border-radius: 12px; overflow: hidden; }
.cm-corr .c1 { display: flex; align-items: center; gap: 8px; padding: 11px 12px 4px; }
.cm-corr .c1 .id { font-family: ui-monospace, Consolas, monospace; font-weight: 800; color: var(--destaque); font-size: 15px; }
.cm-corr .c1 .dt { margin-left: auto; font-size: 11.5px; color: var(--texto-suave); }
.cm-corr .c2 { padding: 0 12px 10px; font-size: 12.5px; }
.cm-corr .c2 .quem { color: var(--texto-suave); }
.cm-corr .ops { border-top: 1px solid var(--linha); }
.cm-corr .op-l { display: flex; align-items: center; gap: 10px; padding: 9px 12px; border-bottom: 1px solid var(--linha); font-size: 12.5px; }
.cm-corr .op-l .d { flex: 1; min-width: 0; }
.cm-corr .op-l .d small { display: block; color: var(--texto-suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cm-corr .op-l.estornado .d { text-decoration: line-through; opacity: .6; }
.cm-corr .rod { padding: 8px 12px; font-size: 11.5px; color: var(--texto-suave); border-bottom: 1px solid var(--linha); }
.cm-corr .acs { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px 12px; }
.cm-corr .acs .btn2 { justify-content: center; height: 38px; }
@media (max-width: 760px) { .lista-mob.so-mob { padding-bottom: 12px; } }
</style>
</head>
<body>

<!-- Histórico de Corridas — página única, acesso por permissão.
     Lógica igual à aba Histórico do painel Gerencial antigo (filtro de liga,
     busca, resumo do mês navegável, reimprimir com o mesmo HTML, estorno por
     OP, cancelar a corrida inteira). Mudanças aprovadas: cancelar NÃO apaga —
     a corrida fica riscada como CANCELADA (filtro "Mostrar canceladas");
     estorno em janela com quantidade + motivo; mostra quem fechou e a ordem
     do romaneio. Estornar/cancelar exigem EDITAR. -->
<main class="conteudo">
  <div class="tit-pagina">
    <div><h1>Histórico de Corridas</h1><p>Corridas fechadas, reimpressão do romaneio e estornos · nada é apagado</p></div>
  </div>

  <div class="filtros so-desk">
    <select id="fLiga"><option value="">Todas as ligas</option></select>
    <div class="f-busca"><svg class="i"><use href="#i-busca"/></svg><input id="busca" placeholder="Buscar corrida, OP, pedido, cliente, código ou produto…" autocomplete="off"></div>
    <label class="chk-lbl"><input type="checkbox" class="chk" id="fCanc">Mostrar canceladas</label>
    <div class="mes"><button data-mes="-1" title="Mês anterior">‹</button><span class="r" id="resumo-mes">Carregando…</span><button data-mes="1" title="Próximo mês">›</button></div>
  </div>
  <div class="so-desk" id="lista"><div class="carregando">Carregando histórico…</div></div>

  <!-- celular -->
  <div class="kpi-mini so-mob" id="kpi-mob"></div>
  <div class="busca-mob so-mob">
    <div class="f"><svg class="i"><use href="#i-busca"/></svg><input id="busca-mob" placeholder="Corrida, OP, cliente…" autocomplete="off"></div>
    <button class="bt" id="bt-filtro-mob" title="Liga, canceladas"><svg class="i"><use href="#i-filtro"/></svg><span class="pt" id="n-filtro-mob" hidden></span></button>
  </div>
  <div class="lista-mob so-mob" id="cartoes"></div>
</main>

<script src="js/config.js"></script>
<script src="js/icones.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/sessao.js"></script>
<script src="js/shell.js"></script>
<script>
Sessao.iniciarPagina('historico').then(function (ctx) {
  const $ = function (s) { return document.querySelector(s); };
  const LIMITE_FORNO = 700;   // era 650 no painel antigo (mudança aprovada)
  const MOTIVOS = ['Molde quebrado / perdido', 'Lançado na corrida errada', 'Liga errada', 'Outro'];

  let corridas = [];        // todas (inclusive canceladas), mais recente primeiro
  let mesOffset = 0;        // 0 = mês atual, -1 = anterior, +1 = próximo
  const e = Ui.esc;

  carregar();

  async function carregar() {
    try {
      const r = await Api.chamar('listarCorridas', { canceladas: true }, { rapido: function () {
        if (!document.querySelector('.modal-fundo')) carregar();
      } });
      corridas = r.corridas;
      popularLigas();
      desenhar();
    } catch (err) {
      Ui.erro(err);
      $('#lista').innerHTML = '<div class="vazio">Erro ao carregar o histórico.</div>';
    }
  }

  function popularLigas() {
    const sel = $('#fLiga');
    const atual = sel.value;
    const ligas = Array.from(new Set(corridas.map(function (c) { return c.liga; }).filter(Boolean))).sort();
    sel.innerHTML = '<option value="">Todas as ligas</option>' + ligas.map(function (l) { return '<option value="' + e(l) + '">' + e(l) + '</option>'; }).join('');
    if (atual) sel.value = atual;
  }

  // ---------- Filtros ----------
  const mob = function () { return window.innerWidth <= 760; };
  const busca = function () { return (mob() ? $('#busca-mob') : $('#busca')).value.toUpperCase().trim(); };
  const textoItem = function (c, it) { return (c.id_corrida + it.op + it.pedido + it.cliente + it.codigo + it.descricao).toUpperCase(); };

  // Devolve [{ c, itens }] — itens = linhas que batem com a busca (igual ao antigo: a busca filtra as OPs)
  function filtrar() {
    const liga = $('#fLiga').value, b = busca(), canc = $('#fCanc').checked;
    const r = [];
    corridas.forEach(function (c) {
      if (c.status === 'CANCELADA' && !canc) return;
      if (liga && c.liga !== liga) return;
      const itens = b ? c.itens.filter(function (it) { return textoItem(c, it).indexOf(b) !== -1; }) : c.itens;
      if (b && !itens.length) return;
      r.push({ c: c, itens: itens });
    });
    return r;
  }

  // ---------- Resumo do mês (moldes/peso líquidos, já sem os estornos) ----------
  function mesRef() {
    const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + mesOffset);
    return String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear();
  }
  function resumoMes() {
    const ref = mesRef();
    let n = 0, moldes = 0, peso = 0;
    corridas.forEach(function (c) {
      const p = String(c.data_hora || '').split(' ')[0].split('/');
      if (p.length < 3 || p[1] + '/' + p[2] !== ref) return;
      if (c.status !== 'CANCELADA') n++;
      moldes += Number(c.moldes_liquido) || 0;
      peso += Number(c.peso_liquido) || 0;
    });
    return { ref: ref, n: n, moldes: moldes, peso: peso };
  }

  // ---------- Desenho ----------
  const dh = function (s) { return String(s || '—').slice(0, 16); };          // dd/mm/aaaa hh:mm
  const dhCurta = function (s) { return String(s || '').slice(0, 5) + ' ' + String(s || '').slice(11, 16); };  // dd/mm hh:mm
  const kg = function (n) { return Fmt.num(n, 1); };
  const pl = function (n, s, p) { return n + ' ' + (n === 1 ? s : p); };

  function desenhar() {
    const rm = resumoMes();
    $('#resumo-mes').innerHTML = '<b class="m">' + rm.ref + '</b> · ' + pl(rm.n, 'corrida', 'corridas') + ' · <span class="n-mol">' + rm.moldes + ' moldes</span> · <span class="n-kg">' + kg(rm.peso) + ' kg</span>';
    $('#kpi-mob').innerHTML =
      '<span class="km mes-m sel" style="--c:#f07a1f"><button data-mes="-1" title="Mês anterior">‹</button><b>' + rm.ref + '</b><button data-mes="1" title="Próximo mês">›</button></span>' +
      '<span class="km" style="--c:#f07a1f"><b>' + rm.n + '</b>corridas</span>' +
      '<span class="km" style="--c:#60a5fa"><b>' + rm.moldes + '</b>moldes</span>' +
      '<span class="km" style="--c:#34d399"><b>' + Fmt.num(rm.peso / 1000, 1) + ' t</b>fundidas</span>';
    const nf = ($('#fLiga').value ? 1 : 0) + ($('#fCanc').checked ? 1 : 0);
    $('#n-filtro-mob').hidden = !nf;
    $('#n-filtro-mob').textContent = nf;

    const lista = filtrar();
    $('#lista').innerHTML = lista.length ? lista.map(blocoDesk).join('') : '<div class="bloco"><div class="vazio">Nenhuma corrida encontrada</div></div>';
    $('#cartoes').innerHTML = lista.length ? lista.map(cartaoMob).join('') : '<div class="vazio">Nenhuma corrida encontrada</div>';
  }

  // Rodapé: estornos (quem, quando, quanto, motivo) ou o cancelamento
  function rodape(c) {
    if (c.status === 'CANCELADA') {
      return ['Cancelada' + (c.cancelada_em && c.cancelada_em !== '-' ? ' em ' + dhCurta(c.cancelada_em) : '') + (c.cancelada_por ? ' por ' + c.cancelada_por : '') +
        (c.motivo_cancelamento ? ' · motivo: ' + c.motivo_cancelamento : '') + ' · o registro continua no histórico'];
    }
    const r = [];
    c.itens.forEach(function (it) {
      it.estornos.forEach(function (x) {
        r.push('Estorno em ' + dhCurta(x.data_hora) + ' por ' + x.usuario + ' · ' + pl(x.moldes, 'molde devolvido', 'moldes devolvidos') + ' à OP ' + it.op + (x.motivo ? ' · motivo: ' + x.motivo : ''));
      });
    });
    return r;
  }

  function botoesCorrida(c, curto) {
    if (c.status === 'CANCELADA') return '<span class="tag-c"' + (curto ? ' style="grid-column:1/-1;text-align:center"' : '') + '>CANCELADA · moldes devolvidos</span>';
    return '<button class="btn2" data-reimprimir="' + e(c.id_corrida) + '">' + Ui.ic('i-imp') + (curto ? 'Reimprimir' : 'Reimprimir romaneio') + '</button>' +
      (ctx.podeEditar ? '<button class="btn2 perigo" data-cancelar="' + e(c.id_corrida) + '">' + Ui.ic('i-x') + (curto ? 'Cancelar' : 'Cancelar corrida') + '</button>' : '');
  }

  function acaoItem(c, it, curto) {
    if (it.moldes_liquido <= 0) return '<span class="mut" style="font-size:' + (curto ? '11' : '12') + 'px">' + (curto ? 'estornado' : 'Estornado') + '</span>';
    if (c.status === 'CANCELADA' || !ctx.podeEditar) return '';
    return '<button class="bt-est" data-estornar="' + e(c.id_corrida) + '|' + e(it.id_item) + '">' + (curto ? '' : Ui.ic('i-volta')) + 'Estornar</button>';
  }

  function blocoDesk(g) {
    const c = g.c, canc = c.status === 'CANCELADA';
    const linhas = g.itens.map(function (it) {
      return '<tr class="' + (it.moldes_liquido <= 0 ? 'estornado' : '') + '"><td><span class="seq">' + e(it.ordem) + '</span></td><td><b>' + e(it.op) + '</b></td>' +
        '<td>' + e(it.cliente || '-') + '</td><td class="mut">' + e(it.codigo || '-') + '</td><td class="desc" title="' + e(it.descricao) + '">' + e(it.descricao || '-') + '</td>' +
        '<td class="num n-mol">' + e(it.moldes_liquido) + (it.moldes_estornados > 0 ? '<span class="est-info">' + it.moldes_estornados + ' estornado' + (it.moldes_estornados > 1 ? 's' : '') + ' de ' + it.moldes + '</span>' : '') + '</td>' +
        '<td class="num n-kg">' + kg(it.peso_liquido) + ' kg</td><td>' + acaoItem(c, it) + '</td></tr>';
    }).join('');
    const rod = rodape(c);
    const ocultas = c.itens.length - g.itens.length;
    return '<div class="corr' + (canc ? ' cancelada' : '') + '" data-corrida="' + e(c.id_corrida) + '">' +
      '<div class="corr-cab"><span class="id">' + e(c.id_corrida) + '</span><span class="liga">' + e(c.liga || '—') + '</span>' +
      '<div class="meta"><span title="Fechada em">' + Ui.ic('i-relogio') + e(dh(c.data_hora)) + '</span><span title="Fechada por">' + Ui.ic('i-user') + e(c.usuario || '—') + '</span></div>' +
      '<div class="tot"><span class="n-mol">' + c.moldes_liquido + ' moldes</span><span class="n-kg">' + kg(c.peso_liquido) + ' kg</span>' + botoesCorrida(c) + '</div></div>' +
      '<div class="tab-wrap"><table class="tab"><thead><tr><th>#</th><th>OP</th><th>Cliente</th><th>Código</th><th>Descrição</th><th class="num">Moldes</th><th class="num">Peso</th><th>Ação</th></tr></thead><tbody>' + linhas + '</tbody></table></div>' +
      (ocultas > 0 ? '<div class="oculto-busca">' + pl(ocultas, 'outra OP desta corrida não aparece', 'outras OPs desta corrida não aparecem') + ' por causa da busca</div>' : '') +
      (rod.length ? '<div class="corr-rod">' + Ui.ic('i-alerta') + '<div>' + rod.map(function (t) { return '<div>' + e(t) + '</div>'; }).join('') + '</div></div>' : '') +
      '</div>';
  }

  function cartaoMob(g) {
    const c = g.c, canc = c.status === 'CANCELADA';
    const ops = g.itens.map(function (it) {
      return '<div class="op-l' + (it.moldes_liquido <= 0 ? ' estornado' : '') + '"><span class="seq">' + e(it.ordem) + '</span>' +
        '<div class="d"><b>' + e(it.op) + '</b> · ' + e(it.cliente || '-') + '<small>' + e(it.descricao || '-') + '</small></div>' +
        '<span class="n-mol">' + e(it.moldes_liquido) + '</span>' + acaoItem(c, it, true) + '</div>';
    }).join('');
    const rod = rodape(c);
    return '<div class="cm-corr' + (canc ? ' cancelada' : '') + '" data-corrida="' + e(c.id_corrida) + '">' +
      '<div class="c1"><span class="id">' + e(c.id_corrida) + '</span><span class="liga">' + e(c.liga || '—') + '</span><span class="dt">' + e(dh(c.data_hora)) + '</span></div>' +
      '<div class="c2"><span class="n-mol">' + c.moldes_liquido + ' moldes</span> · <span class="n-kg">' + kg(c.peso_liquido) + ' kg</span> · ' + pl(c.itens.length, 'OP', 'OPs') + ' · <span class="quem">por ' + e(c.usuario || '—') + '</span></div>' +
      '<div class="ops">' + ops + '</div>' +
      (rod.length ? '<div class="rod">' + rod.map(e).join('<br>') + '</div>' : '') +
      '<div class="acs">' + botoesCorrida(c, true) + '</div></div>';
  }

  // ---------- Eventos ----------
  $('#fLiga').addEventListener('change', desenhar);
  $('#fCanc').addEventListener('change', desenhar);
  $('#busca').addEventListener('input', desenhar);
  $('#busca-mob').addEventListener('input', desenhar);

  document.addEventListener('click', function (ev) {
    const m = ev.target.closest('[data-mes]');
    if (m) { mesOffset += Number(m.dataset.mes); desenhar(); return; }
    const ri = ev.target.closest('[data-reimprimir]');
    if (ri) { reimprimir(ri.dataset.reimprimir); return; }
    const ca = ev.target.closest('[data-cancelar]');
    if (ca) { cancelar(ca.dataset.cancelar); return; }
    const es = ev.target.closest('[data-estornar]');
    if (es) { const p = es.dataset.estornar.split('|'); estornar(p[0], p[1]); }
  });

  // Filtros no celular: liga + canceladas numa janela
  $('#bt-filtro-mob').addEventListener('click', function () {
    Ui.janela({
      titulo: 'Filtrar corridas',
      corpo: '<label class="est-campo">Liga<select name="liga">' + $('#fLiga').innerHTML + '</select></label>' +
        '<label class="chk-lbl"><input type="checkbox" class="chk" name="canc"' + ($('#fCanc').checked ? ' checked' : '') + '>Mostrar canceladas</label>',
      botoes: [{ texto: 'Limpar', valor: 'limpar' }, { texto: 'Aplicar', classe: 'pri', valor: 'ok' }],
      antesDeFechar: function (v, cx) {
        $('#fLiga').value = v === 'limpar' ? '' : cx.querySelector('[name="liga"]').value;
        $('#fCanc').checked = v === 'limpar' ? false : cx.querySelector('[name="canc"]').checked;
        desenhar();
        return true;
      }
    });
    const sel = document.querySelector('.modal-fundo [name="liga"]');
    if (sel) sel.value = $('#fLiga').value;
  });

  const acharCorrida = function (id) { return corridas.find(function (c) { return c.id_corrida === id; }); };

  // Campo de motivo (lista do mockup + "Outro" com texto)
  function campoMotivo() {
    return '<label class="est-campo">Motivo<select name="motivo">' + MOTIVOS.map(function (m) { return '<option>' + e(m) + '</option>'; }).join('') + '</select></label>' +
      '<label class="est-campo" data-outro hidden>Descreva o motivo<input type="text" name="outro" maxlength="200" autocomplete="off"></label>';
  }
  function ligarMotivo(cx) {
    const sel = cx.querySelector('[name="motivo"]');
    sel.addEventListener('change', function () {
      cx.querySelector('[data-outro]').hidden = sel.value !== 'Outro';
      if (sel.value === 'Outro') cx.querySelector('[name="outro"]').focus();
    });
  }
  function lerMotivo(cx) {
    const m = cx.querySelector('[name="motivo"]').value;
    if (m !== 'Outro') return m;
    const t = cx.querySelector('[name="outro"]').value.trim();
    return t ? 'Outro: ' + t : '';
  }

  // ---------- Estorno de uma OP (quantidade + motivo) ----------
  function estornar(idCorrida, idItem) {
    const c = acharCorrida(idCorrida);
    const it = c && c.itens.find(function (x) { return x.id_item === idItem; });
    if (!it || it.moldes_liquido <= 0) return;
    const max = it.moldes_liquido;
    const idReq = Api.idReq();
    Ui.janela({
      titulo: 'Estornar moldes',
      subtitulo: 'Os moldes voltam para o saldo da OP. O registro original continua no histórico.',
      largura: 460,
      corpo: '<div class="resumo-op"><span>Corrida</span><b>' + e(c.id_corrida) + ' · ' + e(c.liga) + '</b>' +
        '<span>OP</span><b>' + e(it.op) + ' · ' + e(it.cliente || '-') + '</b>' +
        '<span>Na corrida</span><b>' + max + ' molde' + (max > 1 ? 's' : '') + ' · ' + kg(it.peso_liquido) + ' kg</b></div>' +
        '<label class="est-campo">Quantos moldes estornar? <small>(disponível para estorno: ' + max + ')</small>' +
        '<span class="est-passo"><button type="button" data-d="-1">−</button><input name="qtd" inputmode="numeric" value="' + max + '"><button type="button" data-d="1">+</button></span></label>' +
        campoMotivo() + '<div class="msg-erro"></div>',
      botoes: [{ texto: 'Cancelar', valor: null }, { texto: 'Confirmar estorno', classe: 'pri', valor: 'ok' }],
      antesDeFechar: async function (v, cx) {
        if (v !== 'ok') return true;
        const msg = cx.querySelector('.msg-erro');
        const q = parseInt(cx.querySelector('[name="qtd"]').value, 10);
        if (!q || q <= 0) { Ui.msgErro(msg, 'Quantidade inválida.'); return false; }
        if (q > max) { Ui.msgErro(msg, 'Quantidade maior que o disponível (' + max + ').'); return false; }
        const motivo = lerMotivo(cx);
        if (!motivo) { Ui.msgErro(msg, 'Descreva o motivo do estorno.'); return false; }
        try {
          await Api.chamar('estornarCorrida', { idReq: idReq, id_corrida: c.id_corrida, id_item: it.id_item, moldes: q, motivo: motivo });
        } catch (err) { Ui.msgErro(msg, err.message || 'Erro ao estornar.'); return false; }
        Ui.toast(pl(q, 'molde estornado', 'moldes estornados') + ' da OP ' + it.op + '.', 'ok', 'Estorno feito');
        carregar();
        return true;
      }
    });
    const cx = document.querySelector('.modal-fundo .modal-caixa');
    const inp = cx.querySelector('[name="qtd"]');
    cx.querySelectorAll('[data-d]').forEach(function (b) {
      b.addEventListener('click', function () {
        inp.value = Math.min(max, Math.max(1, (parseInt(inp.value, 10) || 0) + Number(b.dataset.d)));
      });
    });
    inp.addEventListener('input', function () { inp.value = inp.value.replace(/\D/g, ''); });
    ligarMotivo(cx);
  }

  // ---------- Cancelar a corrida inteira (não apaga: fica CANCELADA) ----------
  function cancelar(idCorrida) {
    const c = acharCorrida(idCorrida);
    if (!c || c.status === 'CANCELADA') return;
    const idReq = Api.idReq();
    Ui.janela({
      titulo: 'Cancelar a corrida ' + c.id_corrida + '?',
      largura: 460,
      corpo: '<p class="exp">Isso devolve para a carteira todos os moldes que ainda restam nesta corrida (' + c.moldes_liquido + ' moldes · ' + kg(c.peso_liquido) + ' kg). ' +
        'A corrida <b>não é apagada</b>: continua no histórico, riscada como CANCELADA.</p>' + campoMotivo() + '<div class="msg-erro"></div>',
      botoes: [{ texto: 'Voltar', valor: null }, { texto: 'Cancelar corrida', classe: 'perigo', valor: 'ok' }],
      antesDeFechar: async function (v, cx) {
        if (v !== 'ok') return true;
        const msg = cx.querySelector('.msg-erro');
        const motivo = lerMotivo(cx);
        if (!motivo) { Ui.msgErro(msg, 'Descreva o motivo do cancelamento.'); return false; }
        try {
          const r = await Api.chamar('cancelarCorrida', { idReq: idReq, id_corrida: c.id_corrida, motivo: motivo });
          Ui.toast(r.duplicado ? 'Corrida já estava cancelada.' : pl(r.moldes_devolvidos, 'molde devolvido', 'moldes devolvidos') + ' à carteira.', 'ok', 'Corrida ' + c.id_corrida + ' cancelada');
        } catch (err) { Ui.msgErro(msg, err.message || 'Erro ao cancelar.'); return false; }
        carregar();
        return true;
      }
    });
    ligarMotivo(document.querySelector('.modal-fundo .modal-caixa'));
  }

  // ---------- Reimprimir o romaneio (HTML do painel antigo, na ordem do romaneio) ----------
  function reimprimir(idCorrida) {
    const c = acharCorrida(idCorrida);
    if (!c) return;
    // OPs 100% estornadas ficam de fora (igual ao antigo)
    const ops = c.itens.filter(function (x) { return x.moldes_liquido > 0; });
    if (!ops.length) { Ui.toast('Todas as OPs desta corrida foram 100% estornadas.', 'aviso'); return; }
    const liga = c.liga || '—';
    const corId = '#000000';
    let linhas = '', pesoTotal = 0, totalMoldes = 0, seq = 1;
    ops.forEach(function (op) {
      pesoTotal += Number(op.peso_liquido) || 0;
      totalMoldes += Number(op.moldes_liquido) || 0;
      linhas += `<tr><td>${seq++}</td><td>${e(op.op)}</td><td>${e(op.pedido || '-')}</td>
      <td>${e(op.codigo || '-')}</td><td>${e(op.descricao || '-')}</td><td>${e(op.cliente || '-')}</td>
      <td>${e(liga)}</td><td>${e(op.prazo || '-')}</td>
      <td style="text-align:center">${e(op.moldes_liquido)}</td>
      <td style="text-align:right;font-weight:700">${(Number(op.peso_liquido) || 0).toFixed(1)}</td></tr>`;
    });
    const alertaTxt = pesoTotal > LIMITE_FORNO
      ? `<p style="color:red;font-weight:bold">⚠ PESO ACIMA DO LIMITE DO FORNO (${LIMITE_FORNO} kg) — VERIFICAR RECARGA</p>`
      : '';
    const w = window.open('');
    if (!w) { Ui.toast('O navegador bloqueou a janela de impressão. Libere pop-ups para este site.', 'erro'); return; }
    w.document.write(`<html><head><title>ROMANEIO ${e(c.id_corrida)}</title>
  <style>body{font-family:Arial;padding:24px;color:#111}
  .hdr{display:flex;justify-content:space-between;align-items:flex-start}
  h2{font-size:18px;margin:0}.id{font-size:20px;font-weight:900;color:${corId}}
  .sub{font-size:12px;color:#555;margin-bottom:16px}
  table{width:100%;border-collapse:collapse;font-size:11px;margin-top:12px}
  th,td{border:1px solid #ccc;padding:7px;text-align:left}th{background:#f0f0f0}
  tfoot td{font-weight:800;background:#f0f0f0}
  .rodape{margin-top:32px;border-top:1px solid #ccc;padding-top:16px;display:flex;gap:40px;font-size:13px}
  .rodape-campo{flex:1}.rodape-label{font-weight:700;margin-bottom:8px}
  .rodape-linha{border-bottom:1px solid #333;height:24px;margin-top:4px}
  </style></head><body>
  <div class="hdr"><div><h2>PLANEJAMENTO DE FUSÃO — LIGA ${e(liga)}</h2>
  <div class="sub">Reimpresso em: ${new Date().toLocaleString('pt-BR')} | Original: ${e(c.data_hora || '—')}</div>
  </div><div class="id">${e(c.id_corrida)}</div></div>
  ${alertaTxt}
  <table><thead><tr><th>#</th><th>OP</th><th>PEDIDO</th><th>CÓDIGO</th><th>DESCRIÇÃO</th>
  <th>CLIENTE</th><th>LIGA</th><th>PRAZO</th><th style="text-align:center">MOLDES</th>
  <th style="text-align:right">PESO (kg)</th></tr></thead>
  <tbody>${linhas}</tbody>
  <tfoot><tr><td colspan="8" style="text-align:right">TOTAL DA CORRIDA:</td>
  <td style="text-align:center">${totalMoldes}</td>
  <td style="text-align:right">${pesoTotal.toFixed(1)} kg</td></tr></tfoot></table>
  <div class="rodape">
    <div class="rodape-campo"><div class="rodape-label">Lote da Liga:</div><div class="rodape-linha"></div></div>
    <div class="rodape-campo"><div class="rodape-label">OP da Liga:</div><div class="rodape-linha"></div></div>
  </div>
  <script>window.onload=()=>window.print();<\/script></body></html>`);
    w.document.close();
  }
});
</script>
</body>
</html>
