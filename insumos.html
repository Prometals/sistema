<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insumos · Prometals</title>
<link rel="stylesheet" href="css/tema.css">
<link rel="stylesheet" href="css/sistema.css">
<style>
/* ---------- específico desta página ---------- */
/* cards = filtros (um escolhido por vez) + Ajustes de saldo à direita */
.kl { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 12px; margin-bottom: 14px; }
.kq { background: var(--painel); border: 1px solid var(--linha); border-radius: 12px; padding: 10px 14px; cursor: pointer; position: relative; overflow: hidden; text-align: left; font: inherit; color: inherit; min-width: 0; }
.kq::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); }
.kq.sel { border-color: var(--c); }
.kq.sel .l { color: var(--c); }
.kq .l { display: block; font-size: 11px; font-weight: 800; color: var(--texto-suave); letter-spacing: .4px; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kq b { display: block; font-size: 28px; font-variant-numeric: tabular-nums; margin-top: 2px; }
.kq.alerta b { color: var(--c); }
.km { cursor: pointer; border: 0; font: inherit; color: inherit; }
/* bloco da tabela */
.bx { background: var(--painel); border: 1px solid var(--linha); border-radius: 14px; overflow: hidden; }
.bx-cab { display: flex; align-items: center; gap: 10px; padding: 10px 16px; border-bottom: 1px solid var(--linha); flex-wrap: wrap; }
.bx-cab h3 { margin: 0; font-size: 15px; } .bx-cab .s { font-size: 12px; color: var(--texto-suave); }
.bx-cab .dir { margin-left: auto; display: flex; gap: 8px; align-items: center; }
.f-busca { position: relative; width: 280px; }
.f-busca input { width: 100%; padding-left: 34px; height: 34px; font-size: 13px; }
.f-busca svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--texto-suave); }
.chk-l { display: flex; gap: 6px; align-items: center; font-size: 12px; color: var(--texto-suave); white-space: nowrap; cursor: pointer; }
.chk-l input { width: 15px; height: 15px; accent-color: var(--destaque); }
.per { display: inline-flex; border: 1px solid var(--borda); border-radius: 9px; overflow: hidden; height: 32px; }
.per button { border: 0; background: transparent; font: inherit; font-size: 12.5px; font-weight: 700; color: var(--texto-suave); padding: 0 12px; cursor: pointer; }
.per button.on { background: var(--destaque); color: #fff; }
.tab-wrap { overflow: auto; max-height: calc(100vh / var(--escala, 1) - 330px); }
.tab-wrap table.tab th { position: sticky; top: 0; z-index: 1; }
/* o sistema.css compacta todas as tabelas com !important: aqui precisa vencer */
main.conteudo #bx-tab table.tab th, main.conteudo #bx-tab table.tab td { white-space: nowrap !important; padding-top: 7px; padding-bottom: 7px; }
main.conteudo #bx-tab table.tab th.c, main.conteudo #bx-tab table.tab td.c { text-align: center !important; }
#bx-tab table.tab { table-layout: fixed; width: 100%; }
#bx-tab tbody tr.lin { cursor: pointer; }
#bx-tab tbody tr.lin:hover td { background: color-mix(in srgb, var(--destaque) 5%, transparent); }
td.ins { overflow: hidden; text-overflow: ellipsis; }
.cod { color: var(--texto-suave); font-size: 11px; margin-left: 6px; }
.res { color: var(--texto-suave); }
.baixo { color: #f87171; } html.tema-claro .baixo { color: #b91c1c; }
.mais { color: #34d399; } html.tema-claro .mais { color: #166534; }
tr.inat td { opacity: .45; }
tr.lin.sel td { background: color-mix(in srgb, var(--destaque) 10%, transparent); }
.bt-aj { width: 32px; height: 30px; padding: 0; border: 1px solid var(--borda); border-radius: 8px; background: transparent; color: var(--texto-suave); cursor: pointer; display: inline-grid; place-items: center; }
.bt-aj svg { width: 16px; height: 16px; }
.bt-aj:hover { border-color: var(--destaque); color: var(--destaque); }
.btn2.verde { background: #16a34a; border-color: #16a34a; color: #fff; }
/* pop-up corrigir saldo */
.cs { display: grid; gap: 14px; }
.cs .lin2 { display: flex; justify-content: space-between; font-size: 13.5px; }
.cs .lin2 b { font-size: 15px; }
.cs label { display: grid; gap: 6px; font-size: 11px; font-weight: 800; color: var(--texto-suave); letter-spacing: .4px; }
.cs input { height: 52px; font-size: 24px; font-weight: 800; text-align: center; }
.cs select { height: 42px; font-size: 15px; }
.cs .dif { text-align: center; font-size: 14px; color: var(--texto-suave); min-height: 20px; }
.lista-tab .li { padding: 10px 14px; border-top: 1px solid var(--linha); font-size: 13px; cursor: pointer; display: flex; gap: 10px; align-items: center; }
.lista-tab .li:first-child { border-top: 0; }
.lista-tab .li .tx { flex: 1; min-width: 0; }
.lista-tab .li small { display: block; color: var(--texto-suave); font-size: 11.5px; margin-top: 2px; }
.lista-tab { padding-bottom: 80px; }
/* corrigir em lote */
.lt-top { display: flex; gap: 10px; align-items: end; flex-wrap: wrap; margin-bottom: 10px; }
.lt-top label { display: grid; gap: 5px; font-size: 11px; font-weight: 800; color: var(--texto-suave); letter-spacing: .4px; }
.lt-top select { height: 36px; font-size: 13.5px; min-width: 190px; }
.lt-top .f-busca { width: 240px; }
.lt-top .dir { margin-left: auto; display: flex; gap: 8px; }
.lt-wrap { max-height: 52vh; overflow: auto; border: 1px solid var(--linha); border-radius: 10px; }
.lt-wrap table.tab th { position: sticky; top: 0; z-index: 1; }
.lt-wrap table.tab td, .lt-wrap table.tab th { padding: 6px 10px; }
main.conteudo .lt-wrap table.tab th.c, .modal-caixa .lt-wrap table.tab th.c, .modal-caixa .lt-wrap td.c { text-align: center !important; }
.lt-wrap input.in { width: 100px !important; height: 30px; text-align: center; font-weight: 700; padding: 0 6px; }
.lt-wrap tr.tem td { background: color-mix(in srgb, #16a34a 9%, transparent); }
.rodape .t-lt { margin-right: auto; font-size: 12px; color: var(--texto-suave); align-self: center; }
.cat { font-size: 10px; font-weight: 800; padding: 2px 8px; border-radius: 5px; white-space: nowrap; }
.cat.luva { background: rgba(59,130,246,.18); color: #93c5fd; }
.cat.filtro { background: rgba(20,184,166,.18); color: #5eead4; }
.cat.emb { background: rgba(240,122,31,.18); color: #fdba74; }
.cat.out { background: var(--painel-2); color: var(--texto-suave); }
html.tema-claro .cat.luva { color: #1d4ed8; }
html.tema-claro .cat.filtro { color: #0f766e; }
html.tema-claro .cat.emb { color: #9a3412; }
.pol { font-size: 11px; font-weight: 800; }
.pol.sd { color: var(--destaque); }
.sal.baixo { color: #f87171; font-weight: 800; }
.sal.ok { color: #34d399; font-weight: 800; }
html.tema-claro .sal.baixo { color: #b91c1c; }
html.tema-claro .sal.ok { color: #166534; }
table.tab tbody tr { cursor: pointer; }
tr.sel td { background: color-mix(in srgb, var(--destaque) 10%, transparent); }
tr.sel td:first-child { box-shadow: inset 3px 0 0 var(--destaque); }
tr.inat td { opacity: .45; }
.bloco table.tab th, .bloco table.tab td { padding-left: 10px; padding-right: 10px; }
.bloco table.tab td:first-child, .bloco table.tab th:first-child { padding-left: 16px; }
.bloco table.tab td.desc { max-width: 320px; overflow: hidden; text-overflow: ellipsis; }

/* gaveta de edição (painel lateral) */
.gaveta { position: fixed; top: 0; right: 0; bottom: 0; width: 440px; max-width: 100%; background: var(--painel); border-left: 1px solid var(--linha); box-shadow: -20px 0 40px rgba(0,0,0,.35); z-index: 30; display: none; flex-direction: column; }
.gv-veu { position: fixed; inset: 0; background: rgba(15,23,32,.45); z-index: 25; display: none; }
body.gaveta-aberta .gaveta { display: flex; }
body.gaveta-aberta .gv-veu { display: block; }
.gv-cab { padding: 16px 18px; border-bottom: 1px solid var(--linha); display: flex; align-items: flex-start; gap: 10px; }
.gv-cab h3 { margin: 0; font-size: 16px; }
.gv-cab p { margin: 2px 0 0; font-size: 12px; color: var(--texto-suave); }
.gv-cab .fx { margin-left: auto; width: 34px; height: 34px; flex: none; border-radius: 8px; border: 1px solid var(--borda); background: transparent; display: grid; place-items: center; cursor: pointer; color: var(--texto); }
.gv-corpo { padding: 16px 18px; overflow: auto; display: grid; gap: 12px; grid-template-columns: 1fr 1fr; align-content: start; flex: 1; }
.fc { display: grid; gap: 5px; font-size: 11px; font-weight: 800; color: var(--texto-suave); letter-spacing: .4px; align-content: start; min-width: 0; }
.fc input, .fc select { height: 38px; font-size: 13.5px; padding: 0 10px; }
.fc input:disabled, .fc select:disabled { opacity: .7; }
.fc input.mud, .fc select.mud { border-color: var(--destaque); }
.fc.l { grid-column: 1 / -1; }
.fc small { font-weight: 600; letter-spacing: 0; font-size: 11px; }
.seg { display: flex; border: 1px solid var(--borda); border-radius: 10px; overflow: hidden; height: 38px; }
.seg button { flex: 1; border: 0; background: transparent; font-weight: 800; font-size: 12px; color: var(--texto-suave); cursor: pointer; }
.seg button.on { background: var(--destaque); color: #fff; }
.seg button:disabled { cursor: default; }
.seg.mud { border-color: var(--destaque); }
.usado { grid-column: 1 / -1; background: var(--painel-2); border-radius: 10px; padding: 10px 12px; font-size: 12px; display: grid; gap: 5px; }
.usado b { font-size: 11px; color: var(--texto-suave); letter-spacing: .4px; }
.estq { grid-column: 1 / -1; display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.estq div { background: var(--painel-2); border-radius: 10px; padding: 8px 10px; font-size: 10.5px; font-weight: 800; color: var(--texto-suave); }
.estq b { display: block; font-size: 18px; color: var(--texto); }
.estq b.baixo { color: #f87171; } .estq b.ok { color: #34d399; } .estq b.at { color: #fbbf24; }
html.tema-claro .estq b.baixo { color: #b91c1c; } html.tema-claro .estq b.ok { color: #166534; } html.tema-claro .estq b.at { color: #92400e; }
.gv-rod { padding: 12px 18px; border-top: 1px solid var(--linha); display: flex; gap: 8px; justify-content: flex-end; }
.gv-rod .esq { margin-right: auto; }
.btn2.salvar { background: #16a34a; border-color: #16a34a; color: #fff; }
.btn2 .n { background: rgba(255,255,255,.25); border-radius: 999px; padding: 0 7px; font-size: 11px; }
.nota { grid-column: 1 / -1; font-size: 11.5px; color: var(--texto-suave); }
.gv-corpo .msg-erro { grid-column: 1 / -1; margin: 0; }
.cm { cursor: pointer; }
.cm .lin2 { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--texto-suave); gap: 8px; }
.cm.inat { opacity: .5; }
.cm-top .op { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hist { display: grid; gap: 8px; font-size: 13px; }
.hist div { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px solid var(--linha); padding-bottom: 6px; }
.hist span { color: var(--texto-suave); }
.filtros-mob { display: grid; gap: 12px; }
@media (max-width: 1100px) { .kl { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (max-width: 760px) {
  .gaveta { width: 100%; }
  .gv-corpo { grid-template-columns: 1fr 1fr; }
  .gv-rod { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
  .bx-cab .dir { margin-left: 0; width: 100%; flex-wrap: wrap; }
  .f-busca { width: 100%; }
}
</style>
</head>
<body>

<!-- Estoque · Insumos (simples).
     Cards = filtros (Todos, Luva, Filtro, Embalagem, Outros, Abaixo do mínimo)
     e, à direita, "Ajustes de saldo" (histórico de quem corrigiu, antes → depois, motivo).
     Lista: Insumo · Categoria · Estoque · Mínimo · ✏ Corrigir saldo.
     Corrigir saldo: quem tem EDITAR no Insumos OU no Estoque · Operador (almoxarifado).
     Novo insumo / editar cadastro: EDITAR no Insumos (ficha lateral). -->
<main class="conteudo">
  <div class="tit-pagina">
    <div><h1>Insumos</h1><p>Cadastro, estoque e ajustes de saldo</p></div>
    <div class="acoes-pagina so-desk">
      <button class="btn2" data-imprimir title="Imprimir a lista da tela"><svg class="i"><use href="#i-imp"/></svg>Imprimir</button>
      <button class="btn2" data-excel title="Baixar a lista da tela em Excel"><svg class="i"><use href="#i-xls"/></svg>Excel</button>
      <button class="btn2" data-lote hidden title="Corrigir saldo em lote (vários insumos de uma vez)"><svg class="i"><use href="#i-lista"/></svg>Corrigir saldo em lote</button>
      <button class="btn2" data-acao="novo" data-editar hidden><svg class="i"><use href="#i-mais"/></svg>Novo insumo</button>
    </div>
  </div>

  <div class="kl so-desk" id="cards"></div>
  <div class="kpi-mini so-mob" id="cards-mob"></div>

  <section class="bx" id="bx-tab">
    <div class="bx-cab"><h3 id="tit-tab">Todos</h3><span class="s" id="sub-tab"></span>
      <div class="dir">
        <div class="per" id="periodo" hidden><button type="button" data-dias="1">Hoje</button><button type="button" data-dias="7">7 dias</button><button type="button" data-dias="30" class="on">30 dias</button></div>
        <label class="chk-l" id="l-inat"><input type="checkbox" id="f-inat"> Mostrar inativos</label>
        <div class="f-busca"><svg class="i"><use href="#i-busca"/></svg><input id="busca" autocomplete="off" placeholder="Código ou descrição…"></div>
      </div></div>
    <div class="tab-wrap so-desk" data-encher>
      <table class="tab"><thead id="cab"></thead>
        <tbody id="linhas"><tr><td><div class="carregando">Carregando…</div></td></tr></tbody></table>
    </div>
    <div class="lista-tab so-mob" id="lista-tab"></div>
  </section>

  <div class="barra-mob so-mob">
    <button class="ic" data-imprimir title="Imprimir"><svg class="i"><use href="#i-imp"/></svg></button>
    <button class="ic" data-excel title="Excel"><svg class="i"><use href="#i-xls"/></svg></button>
    <button class="pri" data-acao="novo" data-editar hidden style="background:var(--destaque);border-color:var(--destaque)"><svg class="i"><use href="#i-mais"/></svg>Novo insumo</button>
  </div>
</main>

<div class="gv-veu" data-acao="fechar"></div>
<aside class="gaveta" id="gaveta" aria-label="Editar insumo"></aside>

<script src="js/config.js"></script>
<script src="js/icones.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/sessao.js"></script>
<script src="js/shell.js"></script>
<script>
Sessao.iniciarPagina('insumos').then(function (ctx) {
  const $ = function (s) { return document.querySelector(s); };
  const e = Ui.esc;
  const pode = ctx.podeEditar;                                          // cadastro (novo / editar)
  const podeAjustar = ctx.podeEditar || ctx.nivelDe('estoque') === 'EDITAR';   // corrigir saldo (inclui almoxarifado)
  const CATS = [
    { id: 'LUVA', nome: 'Luva', cls: 'luva', c: '#3b82f6' },
    { id: 'FILTRO', nome: 'Filtro', cls: 'filtro', c: '#14b8a6' },
    { id: 'EMBALAGEM', nome: 'Embalagem', cls: 'emb', c: '#f07a1f' },
    { id: 'OUTROS', nome: 'Outros', cls: 'out', c: '#64748b' }
  ];
  // Lista mestre de processos (a mesma da aba CAD_PROCESSO e do PCP)
  const PROCESSOS = ['VALIDAÇÃO TÉCNICA', 'ENGENHARIA', 'PLANEJAMENTO', 'FILA DE PRODUÇÃO', 'MODELAÇÃO',
    'MOLDAGEM', 'PINTURA', 'FUSÃO', 'REBARBAÇÃO', 'TRATAMENTO TÉRMICO', 'JATEAMENTO',
    'USINAGEM', 'BALANCEAMENTO EXTERNO', 'INSPEÇÃO FINAL', 'EXPEDIÇÃO'];
  const MOTIVOS = [{ v: 'CONTAGEM', t: 'Contagem' }, { v: 'CHEGOU MATERIAL', t: 'Chegou material' }, { v: 'PERDA', t: 'Perda' }];
  const NOME_MOTIVO = { CONTAGEM: 'Contagem', 'CHEGOU MATERIAL': 'Chegou material', PERDA: 'Perda', 'INVENTÁRIO': 'Inventário' };
  const MAX_LINHAS = 600;

  // Cards (um escolhido por vez). AJUSTES troca a lista pelo histórico dos ajustes de saldo.
  const FILTROS = [
    { m: 'TODOS', t: 'Todos', c: '#3b82f6' },
    { m: 'LUVA', t: 'Luva', c: '#3b82f6' },
    { m: 'FILTRO', t: 'Filtro', c: '#14b8a6' },
    { m: 'EMBALAGEM', t: 'Embalagem', c: '#f07a1f' },
    { m: 'OUTROS', t: 'Outros', c: '#64748b' },
    { m: 'ABAIXO', t: 'Abaixo do mínimo', c: '#dc2626' }
  ];
  let modo = 'TODOS';
  let itens = [];                       // insumos + saldo
  let ajustes = [];                     // histórico de ajustes (últimos 30 dias)
  let dias = 30;                        // período do histórico na tela
  let busca = '';
  let g = null;                         // insumo aberto na ficha (gaveta)
  let salvando = false;
  const pendente = {};                  // idReq reaproveitado se o MESMO envio cair por conexão

  if (pode) document.querySelectorAll('[data-editar]').forEach(function (b) { b.hidden = false; });
  if (podeAjustar) document.querySelectorAll('[data-lote]').forEach(function (b) { b.hidden = false; });

  carregar();

  // ---------- Dados ----------
  // Dados guardados no computador: a lista aparece na hora e atualiza por trás
  var tAtualizar = null;
  function atualizarDepois() {
    clearTimeout(tAtualizar);
    tAtualizar = setTimeout(function () { if (!document.querySelector('.modal-fundo')) carregar(); }, 300);
  }
  async function carregar() {
    try {
      const rapido = { rapido: atualizarDepois };
      const r = await Promise.all([
        Api.chamar('listarInsumos', { incluirInativos: true }, rapido),
        Api.chamar('situacaoInsumos', {}, rapido).catch(function (er) { Ui.erro(er); return []; }),
        Api.chamar('ajustesSaldo', { dias: 30 }, rapido).catch(function () { return []; })
      ]);
      const sit = {};
      r[1].forEach(function (s) { sit[s.cod_insumo] = s; });
      itens = r[0].map(function (i) {
        const s = sit[String(i.COD_INSUMO)];
        return {
          cod: String(i.COD_INSUMO), descricao: String(i.DESCRICAO || ''), categoria: String(i.CATEGORIA || ''),
          unidade: String(i.UNIDADE || ''), politica: String(i.POLITICA || ''), consumo: String(i.PROCESSO_CONSUMO || ''),
          minimo: numero(i.ESTOQUE_MINIMO), lead: numero(i.LEAD_TIME_DIAS), ativo: i.ATIVO === 'SIM', reg: i,
          sit: s || null, saldo: s ? s.saldo : null, vaiSair: s ? s.vai_sair : null, projetado: s ? s.projetado : null,
          usadoEm: s ? s.usado_em : null
        };
      }).sort(function (a, b) { return ordemCat(a.categoria) - ordemCat(b.categoria) || a.descricao.localeCompare(b.descricao); });
      ajustes = r[2] || [];
      desenhar();
    } catch (er) {
      Ui.erro(er);
      $('#linhas').innerHTML = '<tr><td><div class="vazio">Não foi possível carregar. ' + e(er.message) + '</div></td></tr>';
    }
  }

  // ---------- Regras ----------
  const ehAbaixo = function (x) { return x.ativo && x.politica === 'ESTOCADO' && x.minimo > 0 && (x.saldo || 0) < x.minimo; };
  const REGRA = {
    TODOS: function () { return true; },
    LUVA: function (x) { return x.categoria === 'LUVA'; }, FILTRO: function (x) { return x.categoria === 'FILTRO'; },
    EMBALAGEM: function (x) { return x.categoria === 'EMBALAGEM'; }, OUTROS: function (x) { return x.categoria === 'OUTROS'; },
    ABAIXO: ehAbaixo
  };
  const casaBusca = function (txt) {
    const p = busca.toUpperCase().split(/\s+/).filter(Boolean);
    const t = String(txt).toUpperCase();
    return p.every(function (w) { return t.indexOf(w) !== -1; });
  };
  function visiveis() {
    const inat = $('#f-inat').checked;
    return itens.filter(function (x) { return (inat || x.ativo) && REGRA[modo](x) && casaBusca(x.cod + ' ' + x.descricao); });
  }
  const hoje0 = function () { const d = new Date(); d.setHours(0, 0, 0, 0); return d; };
  function deBRhora(t) { const m = /^(\d{2})\/(\d{2})\/(\d{4}) (\d{2}):(\d{2})/.exec(t || ''); return m ? new Date(+m[3], m[2] - 1, +m[1], +m[4], +m[5]) : null; }
  function ajustesVisiveis() {
    const desde = hoje0(); desde.setDate(desde.getDate() - (dias - 1));
    return ajustes.filter(function (a) { const d = deBRhora(a.data); return d && d >= desde && casaBusca(a.cod_insumo + ' ' + a.descricao + ' ' + a.usuario); });
  }
  const nAjustesHoje = function () { const h = hoje0(); return ajustes.filter(function (a) { const d = deBRhora(a.data); return d && d >= h; }).length; };

  // ---------- Desenho ----------
  const n = function (v) { return e(Fmt.num(v)); };
  const celular = window.matchMedia('(max-width: 760px)');
  celular.addEventListener('change', function () { desenhar(); });

  function desenhar() {
    const ativos = itens.filter(function (x) { return x.ativo; });
    const cont = function (m) { return ativos.filter(REGRA[m]).length; };

  }

  const difHtml = function (d) { return d > 0 ? '<span class="mais">+' + n(d) + '</span>' : d < 0 ? '<span class="baixo">' + n(d) + '</span>' : '<span class="res">0</span>'; };
  function desenharAjustes() {

  // ---------- Eventos ----------

  document.addEventListener('click', function (ev) {

  // ============================================================
  // ✏ CORRIGIR SALDO — uma pergunta: quanto tem agora? + motivo
  // ============================================================
  async function enviar(rota, dados) {
    const chave = rota + JSON.stringify(dados);
    const idReq = pendente[chave] || Api.idReq();
    pendente[chave] = idReq;
    try {
      const r = await Api.chamar(rota, Object.assign({ idReq: idReq }, dados));
      delete pendente[chave];
      return r;
    } catch (err) {
      if (err.codigo !== 'SEM_CONEXAO') delete pendente[chave];
      throw err;
    }
  }
  function num(v) {
    let t = String(v === undefined || v === null ? '' : v).trim();
    if (!t) return null;
    if (t.indexOf(',') !== -1) t = t.replace(/\./g, '').replace(',', '.');
    const x = Number(t);
    return isNaN(x) ? NaN : Math.round(x * 1000) / 1000;
  }
  function corrigirSaldo(cod) {
    if (!podeAjustar) return;
    const x = itens.find(function (i) { return i.cod === cod; });
    if (!x) return;
    const un = x.unidade.toLowerCase();
    const atual = x.saldo || 0;
    const corpo = '<div class="msg-erro"></div><div class="cs">' +
      '<div class="lin2"><span>Estoque no sistema</span><b>' + n(atual) + ' ' + e(un) + '</b></div>' +
      '<label>QUANTO TEM AGORA?<input name="real" inputmode="decimal" autocomplete="off" placeholder="0"></label>' +
      '<div class="dif" data-dif></div>' +
      '<label>MOTIVO<select name="mot"><option value="">Escolha…</option>' + MOTIVOS.map(function (m) { return '<option value="' + m.v + '">' + m.t + '</option>'; }).join('') + '</select></label></div>';
    Ui.janela({
      titulo: 'Corrigir saldo', subtitulo: x.descricao + ' · ' + x.cod, largura: 440, corpo: corpo,
      botoes: [{ texto: 'Cancelar', valor: null }, { texto: 'Salvar', classe: 'verde', valor: 'ok' }],
      antesDeFechar: async function (v, cx) {
        const erro = cx.querySelector('.msg-erro');
        const q = num(cx.querySelector('[name="real"]').value), mot = cx.querySelector('[name="mot"]').value;
        if (q === null || isNaN(q) || q < 0) { Ui.msgErro(erro, 'Digite quanto tem agora (zero ou mais).'); return false; }
        if (!mot) { Ui.msgErro(erro, 'Escolha o motivo.'); return false; }
        try {
          const r = await enviar('corrigirSaldo', { cod_insumo: x.cod, qtd_real: q, motivo: mot });
          if (r.duplicado) Ui.toast('Este ajuste já tinha sido gravado.', 'aviso');
          else Ui.toast(x.cod + ': ' + Fmt.num(r.antes) + ' → ' + Fmt.num(r.depois) + ' ' + un + (r.diferenca ? ' (' + (r.diferenca > 0 ? '+' : '') + Fmt.num(r.diferenca) + ')' : ' · contagem conferida'), 'ok', 'Saldo corrigido');
          return true;
        } catch (err) { Ui.msgErro(erro, err.message); return false; }
      }
    }).then(function (v) { if (v === 'ok') carregar(); });
    const l = document.querySelectorAll('.modal-fundo .modal-caixa'), cx = l[l.length - 1];
    const inp = cx.querySelector('[name="real"]');
    inp.addEventListener('input', function () {
      const q = num(inp.value), el = cx.querySelector('[data-dif]');
      if (q === null || isNaN(q)) { el.textContent = ''; return; }
      const d = Math.round((q - atual) * 1000) / 1000;
      el.innerHTML = d === 0 ? 'Bate com o sistema (fica registrado que foi contado)' : 'Diferença: ' + difHtml(d) + ' ' + e(un);
    });
    setTimeout(function () { inp.focus(); }, 30);
  }

  // ============================================================
  // ✏ CORRIGIR EM LOTE — vários insumos de uma vez (contagem geral / carga)
  // Preenche só o que contou (ou cola do Excel: código + quantidade),
  // um motivo para o lote, confere antes → depois e grava tudo de uma vez.
  // ============================================================
  let lote = null;   // { motivo, qtd: { cod: texto }, busca }
  const ativos = function () { return itens.filter(function (x) { return x.ativo; }); };
  function preenchidos() {
    return ativos().filter(function (x) { return String(lote.qtd[x.cod] || '').trim() !== ''; })
      .map(function (x) { return { x: x, q: num(lote.qtd[x.cod]) }; });
  }
  function abrirLote() {
    if (!podeAjustar) return;
    if (!itens.length) { Ui.toast('Aguarde a lista carregar.', 'aviso'); return; }
    if (!lote) lote = { motivo: 'CONTAGEM', qtd: {}, busca: '' };
    // lista: os insumos do card escolhido (no card Ajustes, todos)
    const base = (modo === 'AJUSTES' ? ativos() : ativos().filter(REGRA[modo]));
    const nomeCard = modo === 'AJUSTES' ? 'Todos' : (FILTROS.find(function (f) { return f.m === modo; }) || {}).t;
    const corpo = '<div class="msg-erro"></div><div class="lt-top">' +
      '<label>MOTIVO (vale para o lote)<select name="mot">' + MOTIVOS.map(function (m) { return '<option value="' + m.v + '"' + (lote.motivo === m.v ? ' selected' : '') + '>' + m.t + '</option>'; }).join('') + '</select></label>' +
      '<div class="f-busca"><svg class="i"><use href="#i-busca"/></svg><input name="busca" autocomplete="off" placeholder="Filtrar…" value="' + e(lote.busca) + '"></div>' +
      '<div class="dir"><button type="button" class="btn2" data-baixar-cont title="Baixar planilha de contagem (Excel)"><svg class="i"><use href="#i-xls"/></svg>Baixar planilha de contagem</button>' +
      '<button type="button" class="btn2" data-colar title="Colar do Excel (código e quantidade)"><svg class="i"><use href="#i-clip"/></svg>Colar do Excel</button></div></div>' +
      '<div class="lt-wrap"><table class="tab"><thead><tr><th>Insumo</th><th class="c" style="width:150px">Estoque no sistema</th><th class="c" style="width:150px">Quanto tem agora</th><th class="c" style="width:110px">Diferença</th></tr></thead><tbody data-lt></tbody></table></div>';
    Ui.janela({
      titulo: 'Corrigir saldo em lote · ' + nomeCard, subtitulo: 'Preencha só o que contou · em branco fica como está', largura: 900, corpo: corpo, enterConfirma: false,
      botoes: [{ texto: 'Cancelar', valor: null }, { texto: 'Limpar', valor: 'limpar' }, { texto: 'Conferir →', classe: 'pri', valor: 'conf' }],
      antesDeFechar: async function (v, cx) {
        const erro = cx.querySelector('.msg-erro');
        if (v === 'limpar') {
          if (!(await Ui.confirmar({ titulo: 'Limpar', texto: 'Apagar todas as quantidades digitadas?', ok: 'Limpar', perigo: true }))) return false;
          lote = null; return true;
        }
        const l = preenchidos();
        if (!l.length) { Ui.msgErro(erro, 'Preencha a quantidade de pelo menos um insumo.'); return false; }
        const ruim = l.find(function (i) { return i.q === null || isNaN(i.q) || i.q < 0; });
        if (ruim) { Ui.msgErro(erro, ruim.x.cod + ': quantidade inválida.'); return false; }
        return true;
      }
    }).then(function (v) { if (v === 'conf') conferirLote(); if (v === 'limpar') abrirLote(); });
    const caixas = document.querySelectorAll('.modal-fundo .modal-caixa'), cx = caixas[caixas.length - 1];
    const rod = cx.querySelector('.rodape'), info = document.createElement('span');
    info.className = 't-lt'; rod.insertBefore(info, rod.firstChild);
    const resumo = function () { const k = preenchidos().length; info.textContent = k + ' insumo' + (k === 1 ? '' : 's') + ' preenchido' + (k === 1 ? '' : 's'); };
    function linhas() {
      const p = lote.busca.toUpperCase().split(/\s+/).filter(Boolean);
      const l = base.filter(function (x) { const t = (x.cod + ' ' + x.descricao).toUpperCase(); return p.every(function (w) { return t.indexOf(w) !== -1; }); });
      cx.querySelector('[data-lt]').innerHTML = l.slice(0, 600).map(function (x) {
        const t = lote.qtd[x.cod] || '', q = num(t), s0 = x.saldo || 0;
        const dif = t !== '' && q !== null && !isNaN(q) ? Math.round((q - s0) * 1000) / 1000 : null;
        return '<tr data-lc="' + e(x.cod) + '"' + (t !== '' ? ' class="tem"' : '') + '><td class="ins">' + e(x.descricao) + '<span class="cod">' + e(x.cod) + '</span></td>' +
          '<td class="c">' + n(s0) + ' <span class="res" style="font-size:11px">' + e(x.unidade.toLowerCase()) + '</span></td>' +
          '<td class="c"><input class="in" inputmode="decimal" value="' + e(t) + '"></td><td class="c" data-d>' + (dif === null ? '<span class="res">—</span>' : difHtml(dif)) + '</td></tr>';
      }).join('') || '<tr><td colspan="4"><div class="vazio">Nenhum insumo com esse filtro.</div></td></tr>';
      resumo();
    }
    cx.addEventListener('input', function (ev) {
      const t = ev.target;
      if (t.name === 'busca') { lote.busca = t.value; linhas(); return; }
      const tr = t.closest('tr[data-lc]');
      if (!tr) return;
      lote.qtd[tr.dataset.lc] = t.value;
      tr.classList.toggle('tem', t.value.trim() !== '');
      const x = itens.find(function (i) { return i.cod === tr.dataset.lc; }), q = num(t.value);
      tr.querySelector('[data-d]').innerHTML = t.value.trim() === '' || q === null || isNaN(q) ? '<span class="res">—</span>' : difHtml(Math.round((q - (x.saldo || 0)) * 1000) / 1000);
      resumo();
    });
    cx.addEventListener('change', function (ev) { if (ev.target.name === 'mot') lote.motivo = ev.target.value; });
    cx.addEventListener('keydown', function (ev) {   // Enter desce para a próxima linha
      if (ev.key !== 'Enter' || !ev.target.closest('tr[data-lc]')) return;
      ev.preventDefault();
      const prox = ev.target.closest('tr').nextElementSibling;
      if (prox && prox.querySelector('input')) prox.querySelector('input').focus();
    });
    cx.querySelector('[data-colar]').addEventListener('click', function () { colarLote(linhas); });
    cx.querySelector('[data-baixar-cont]').addEventListener('click', function () { planilhaContagem(base, nomeCard); });
    linhas();
  }

  // Colar do Excel: duas colunas (código e quantidade). 1ª linha pode ser o cabeçalho.
  function colarLote(redesenhar) {
    const corpo = '<div class="msg-erro"></div><p class="mut" style="margin:0 0 8px;font-size:12.5px">No Excel, selecione as colunas <b>Código</b> e <b>Quantidade</b> (ou Código e Contado da planilha de contagem), copie (Ctrl+C) e cole aqui (Ctrl+V).</p>' +
      '<textarea name="cola" rows="10" style="width:100%;font-family:monospace;font-size:13px" placeholder="MP00021&#9;1200&#10;MP00314&#9;150"></textarea>';
    Ui.janela({
      titulo: 'Colar do Excel', largura: 520, corpo: corpo, enterConfirma: false,
      botoes: [{ texto: 'Voltar', valor: null }, { texto: 'Usar', classe: 'pri', valor: 'ok' }],
      antesDeFechar: function (v, cx) {
        const erro = cx.querySelector('.msg-erro');
        const ls = cx.querySelector('[name="cola"]').value.split(/\r?\n/).map(function (l) { return l.trim(); }).filter(Boolean);
        if (!ls.length) { Ui.msgErro(erro, 'Nada colado.'); return false; }
        const ok = [], ruins = [];
        ls.forEach(function (l, i) {
          const p = l.split(/\t|;/).map(function (c) { return c.trim(); });
          const cod = (p[0] || '').toUpperCase(), q = num(p[p.length - 1]);
          const x = itens.find(function (k) { return k.cod === cod && k.ativo; });
          if (p.length < 2 || p[p.length - 1] === '') { if (x) return; if (i === 0) return; ruins.push(l); return; }   // sem quantidade: ignora
          if (!x || q === null || isNaN(q) || q < 0) { if (i === 0 && !x) return; ruins.push(l); return; }               // 1ª linha pode ser cabeçalho
          ok.push({ cod: cod, q: q });
        });
        if (ruins.length) { Ui.msgErro(erro, ruins.length + ' linha(s) com código inexistente/inativo ou quantidade inválida: ' + ruins.slice(0, 5).join(' | ') + (ruins.length > 5 ? '…' : '')); return false; }
        ok.forEach(function (o) { lote.qtd[o.cod] = String(o.q).replace('.', ','); });
        Ui.toast(ok.length + ' insumo(s) preenchido(s).', 'ok', 'Colado');
        return true;
      }
    }).then(function (v) { if (v === 'ok') redesenhar(); });
  }

  // Planilha de contagem (Excel): Código · Insumo · Unidade · Estoque no sistema · Contado (em branco)
  async function planilhaContagem(base, nomeCard) {
    try {
      await carregarSheetJS();
      const ws = XLSX.utils.aoa_to_sheet([['Código', 'Insumo', 'Unidade', 'Estoque no sistema', 'Contado']]
        .concat(base.map(function (x) { return [x.cod, x.descricao, x.unidade, x.saldo || 0, '']; })));
      ws['!cols'] = [14, 44, 9, 18, 12].map(function (c) { return { wch: c }; });
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'Contagem');
      const h = new Date();
      const nome = 'contagem_' + String(nomeCard || 'todos').toLowerCase().replace(/[^a-z0-9]+/g, '_') + '_' + h.getFullYear() + String(h.getMonth() + 1).padStart(2, '0') + String(h.getDate()).padStart(2, '0') + '.xlsx';
      XLSX.writeFile(wb, nome);
      Ui.toast('Preencha a coluna Contado e cole Código + Contado em "Colar do Excel".', 'ok', 'Planilha de contagem');
    } catch (err) { Ui.erro(err); }
  }

  function conferirLote() {
    const l = preenchidos();
    const mot = (MOTIVOS.find(function (m) { return m.v === lote.motivo; }) || {}).t;
    const muda = l.filter(function (i) { return Math.abs(i.q - (i.x.saldo || 0)) > 1e-9; }).length;
    const corpo = '<div class="msg-erro"></div><p style="margin:0 0 10px">Motivo: <b>' + e(mot) + '</b> · ' + l.length + ' insumo' + (l.length === 1 ? '' : 's') + ' · ' + muda + ' com diferença</p>' +
      '<div class="lt-wrap"><table class="tab"><thead><tr><th>Insumo</th><th class="c" style="width:110px">Antes</th><th class="c" style="width:110px">Depois</th><th class="c" style="width:110px">Diferença</th></tr></thead><tbody>' +
      l.map(function (i) {
        const s0 = i.x.saldo || 0, d = Math.round((i.q - s0) * 1000) / 1000;
        return '<tr><td class="ins">' + e(i.x.descricao) + '<span class="cod">' + e(i.x.cod) + '</span></td><td class="c">' + n(s0) + '</td><td class="c">' + n(i.q) + '</td><td class="c">' + difHtml(d) + '</td></tr>';
      }).join('') + '</tbody></table></div>';
    Ui.janela({
      titulo: 'Conferir correção em lote', subtitulo: 'Confira antes de gravar · cada item fica registrado em Ajustes de saldo', largura: 820, corpo: corpo, enterConfirma: false,
      botoes: [{ texto: '← Voltar e corrigir', valor: 'voltar' }, { texto: 'Gravar ' + l.length, classe: 'verde', valor: 'ok' }],
      antesDeFechar: async function (v, cx) {
        if (v !== 'ok') return true;
        const bt = cx.querySelector('.rodape button.verde'); if (bt) { bt.disabled = true; bt.textContent = 'Gravando…'; }
        try {
          const r = await enviar('corrigirSaldoLote', { motivo: lote.motivo, itens: l.map(function (i) { return { cod_insumo: i.x.cod, qtd_real: i.q }; }) });
          if (r.duplicado) Ui.toast('Este lote já tinha sido gravado.', 'aviso');
          else Ui.toast(r.itens + ' insumo(s) gravado(s) · ' + r.mudaram + ' com diferença.', 'ok', 'Saldo corrigido em lote');
          return true;
        } catch (err) {
          Ui.msgErro(cx.querySelector('.msg-erro'), err.message);
          if (bt) { bt.disabled = false; bt.textContent = 'Gravar ' + l.length; }
          return false;
        }
      }
    }).then(function (v) {
      if (v === 'voltar') abrirLote();
      if (v === 'ok') { lote = null; carregar(); }
    });
  }

  // ============================================================
  // IMPRIMIR / EXCEL — sai a lista da tela (insumos do card, ou os ajustes)
  // Relatório profissional: preto no branco, negrito só no título e cabeçalhos.
  // ============================================================
  function dadosRelatorio() {
    if (modo === 'AJUSTES') {
      return {
        titulo: 'AJUSTES DE SALDO — ' + (dias === 1 ? 'HOJE' : 'ÚLTIMOS ' + dias + ' DIAS'),
        cab: ['DATA / HORA', 'QUEM', 'INSUMO', 'CÓDIGO', 'ANTES', 'DEPOIS', 'DIFERENÇA', 'UN.', 'MOTIVO'], num: [4, 5, 6],
        linhas: ajustesVisiveis().map(function (a) {
          return [a.data, a.usuario, a.descricao, a.cod_insumo, a.antes, a.depois, a.diferenca, a.unidade, NOME_MOTIVO[a.motivo] || a.motivo];
        })
      };
    }
    const k = FILTROS.find(function (f) { return f.m === modo; });
    return {
      titulo: 'INSUMOS — ' + (k ? k.t : 'Todos').toUpperCase(),
      cab: ['INSUMO', 'CÓDIGO', 'CATEGORIA', 'ESTOQUE', 'MÍNIMO', 'UN.'], num: [3, 4],
      linhas: visiveis().map(function (x) { return [x.descricao, x.cod, x.categoria, x.saldo, x.minimo, x.unidade]; })
    };
  }
  function imprimir() {
    const d = dadosRelatorio();
    if (!d.linhas.length) { Ui.toast('Nada para imprimir nesta lista.', 'aviso'); return; }
    const w = window.open('');
    if (!w) { Ui.toast('O navegador bloqueou a janela de impressão. Libere pop-ups para este site.', 'erro'); return; }
    const cel = function (v, i) { return '<td' + (d.num.indexOf(i) !== -1 ? ' class="n"' : '') + '>' + (d.num.indexOf(i) !== -1 ? (v === null || v === '' ? '—' : Fmt.num(v)) : e(v === null || v === undefined ? '' : v)) + '</td>'; };
    w.document.write('<html><head><title>' + e(d.titulo) + '</title><style>' +
      'body{font-family:Arial;padding:20px;color:#111}h2{font-size:16px;margin:0 0 4px}.sub{font-size:10px;color:#555;margin-bottom:14px}' +
      'table{width:100%;border-collapse:collapse}th,td{border:1px solid #ccc;padding:5px 6px;font-size:10.5px;text-align:left}th{font-weight:bold}td.n{text-align:right}' +
      '</style></head><body><h2>' + e(d.titulo) + '</h2><div class="sub">Emitido em ' + new Date().toLocaleString('pt-BR') + ' por ' + e(ctx.usuario ? ctx.usuario.nome || ctx.usuario.login : '') + ' · ' + d.linhas.length + ' linha' + (d.linhas.length === 1 ? '' : 's') + (busca ? ' · busca: ' + e(busca) : '') + '</div>' +
      '<table><thead><tr>' + d.cab.map(function (c) { return '<th>' + c + '</th>'; }).join('') + '</tr></thead><tbody>' +
      d.linhas.map(function (l) { return '<tr>' + l.map(cel).join('') + '</tr>'; }).join('') + '</tbody></table>' +
      '<script>window.onload=()=>window.print();<\/script></body></html>');
    w.document.close();
  }
  function carregarSheetJS() {
    if (window.XLSX) return Promise.resolve();
    return new Promise(function (ok, falha) {
      const sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      sc.onload = ok; sc.onerror = function () { falha(new Error('Não foi possível carregar o gerador de Excel (sem internet?).')); };
      document.head.appendChild(sc);
    });
  }
  async function baixarExcel() {
    const d = dadosRelatorio();
    if (!d.linhas.length) { Ui.toast('Nada para exportar nesta lista.', 'aviso'); return; }
    try {
      await carregarSheetJS();
      const cab = d.cab.map(function (c) { return c.charAt(0) + c.slice(1).toLowerCase(); });
      const ws = XLSX.utils.aoa_to_sheet([cab].concat(d.linhas));
      ws['!cols'] = cab.map(function (c, i) { return { wch: i === (modo === 'AJUSTES' ? 2 : 0) ? 42 : 14 }; });
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, modo === 'AJUSTES' ? 'Ajustes de saldo' : 'Insumos');
      const h = new Date();
      const nome = (modo === 'AJUSTES' ? 'ajustes_saldo_' : 'insumos_') + h.getFullYear() + String(h.getMonth() + 1).padStart(2, '0') + String(h.getDate()).padStart(2, '0') + '.xlsx';
      XLSX.writeFile(wb, nome);
      Ui.toast(d.linhas.length + ' linhas · ' + nome, 'ok', 'Excel');
    } catch (err) { Ui.erro(err); }
  }

  // ---------- Gaveta: abrir / fechar ----------
  async function trocarPara(cod) {
    if (g && !g.novo && g.orig.cod === cod) return;
    if (g && contar()) {
      const ok = await Ui.confirmar({ titulo: 'Descartar alterações?', texto: 'Há ' + contar() + ' alteração(ões) não salva(s) em ' + (g.novo ? 'novo insumo' : g.orig.cod) + '.', ok: 'Descartar', perigo: true });
      if (!ok) return;
    }
    abrirGaveta(cod);
  }

  function abrirGaveta(cod) {
    const x = cod ? itens.find(function (i) { return i.cod === cod; }) : null;
    if (cod && !x) return;
    const orig = x ? {
      cod: x.cod, descricao: x.descricao, unidade: x.unidade, categoria: x.categoria, consumo: x.consumo, politica: x.politica,
      minimo: x.minimo === null ? '' : String(x.minimo), lead: x.lead === null ? '' : String(x.lead)
    } : { cod: '', descricao: '', unidade: '', categoria: '', consumo: '', politica: 'ESTOCADO', minimo: '', lead: '' };
    g = { novo: !x, x: x, orig: orig, campos: Object.assign({}, orig) };
    document.body.classList.add('gaveta-aberta');
    desenharGaveta();
    desenhar();
    if (!x && pode) setTimeout(function () { const c = $('#gaveta [data-campo="cod"]'); if (c) c.focus(); }, 30);
  }

  async function fecharGaveta() {
    if (!g) return;
    if (contar()) {
      const ok = await Ui.confirmar({ titulo: 'Descartar alterações?', texto: 'Há ' + contar() + ' alteração(ões) não salva(s). Fechar mesmo assim?', ok: 'Descartar', perigo: true });
      if (!ok) return;
    }
    g = null;
    document.body.classList.remove('gaveta-aberta');
    $('#gaveta').innerHTML = '';
    desenhar();
  }

  function desenharGaveta() {
    const x = g.x, c = g.campos;
    const trava = pode && (g.novo || x.ativo) ? '' : ' disabled';
    const unidades = Array.from(new Set(itens.map(function (i) { return i.unidade; }).filter(Boolean))).sort();
    const sub = g.novo ? 'novo insumo · preencha e clique em Salvar'
      : x.descricao + (x.reg.ATUALIZADO_EM ? ' · atualizado por ' + x.reg.ATUALIZADO_POR + ' em ' + Fmt.data(x.reg.ATUALIZADO_EM)
        : x.reg.CRIADO_EM ? ' · criado por ' + nomeUsuario(x.reg.CRIADO_POR) + ' em ' + Fmt.data(x.reg.CRIADO_EM) : '') + (x.ativo ? '' : ' · INATIVO');
    const sd = c.politica === 'SOB_DEMANDA';
    let estq = '';
    if (x && x.sit) {
      const p = x.projetado;
      const cls = sd ? '' : p < 0 ? 'baixo' : x.minimo > 0 && p < x.minimo ? 'at' : 'ok';
      estq = '<div class="estq"><div>SALDO<b>' + Fmt.num(x.saldo) + '</b></div><div>VAI SAIR (OPs)<b>' + Fmt.num(x.vaiSair) + '</b></div>' +
        '<div>PROJETADO<b class="' + cls + '">' + Fmt.num(p) + '</b></div></div>';
    } else if (x) {
      estq = '<div class="estq"><div>SALDO<b>—</b></div><div>VAI SAIR (OPs)<b>—</b></div><div>PROJETADO<b>—</b></div></div>';
    }
    const usado = x ? (x.usadoEm === null ? '—' : x.usadoEm) : 0;

    $('#gaveta').innerHTML =
      '<div class="gv-cab"><div><h3>' + Ui.esc(g.novo ? 'Novo insumo' : x.cod) + '</h3><p>' + Ui.esc(sub) + '</p></div>' +
        '<button class="fx" data-acao="fechar" title="Fechar">' + Ui.ic('i-x') + '</button></div>' +
      '<div class="gv-corpo">' +
        '<div class="msg-erro"></div>' +
        '<label class="fc">CÓDIGO<input data-campo="cod" autocomplete="off" spellcheck="false" value="' + Ui.esc(c.cod) + '"' + (g.novo && pode ? '' : ' disabled') + ' placeholder="como no NW"></label>' +
        '<label class="fc">UNIDADE<input data-campo="unidade" list="unidades" autocomplete="off" value="' + Ui.esc(c.unidade) + '"' + trava + '></label>' +
        '<datalist id="unidades">' + unidades.map(function (u) { return '<option value="' + Ui.esc(u) + '">'; }).join('') + '</datalist>' +
        '<label class="fc l">DESCRIÇÃO<input data-campo="descricao" value="' + Ui.esc(c.descricao) + '"' + trava + '></label>' +
        '<label class="fc">CATEGORIA<select data-campo="categoria"' + trava + '>' + (g.novo ? '<option value="">Escolha…</option>' : '') +
          CATS.map(function (k) { return '<option value="' + k.id + '"' + (c.categoria === k.id ? ' selected' : '') + '>' + k.id + '</option>'; }).join('') + '</select></label>' +
        '<label class="fc">CONSUMIDO EM<select data-campo="consumo"' + trava + '><option value="">— nenhum —</option>' +
          PROCESSOS.concat(c.consumo && PROCESSOS.indexOf(c.consumo) === -1 ? [c.consumo] : []).map(function (p) {
            return '<option' + (p === c.consumo ? ' selected' : '') + '>' + Ui.esc(p) + '</option>';
          }).join('') + '</select></label>' +
        '<div class="fc l">POLÍTICA<div class="seg" data-seg><button type="button" data-pol="ESTOCADO"' + trava + '>Estocado</button><button type="button" data-pol="SOB_DEMANDA"' + trava + '>Sob demanda</button></div>' +
          '<small>Sob demanda: estoque mínimo fica 0 e Compras é avisado quando a OP abre.</small></div>' +
        '<label class="fc">ESTOQUE MÍNIMO<input data-campo="minimo" inputmode="decimal" value="' + Ui.esc(c.minimo) + '"' + (sd ? ' disabled' : trava) + '></label>' +
        '<label class="fc">LEAD TIME (dias)<input data-campo="lead" inputmode="numeric" value="' + Ui.esc(c.lead) + '"' + trava + '><small>prazo de compra</small></label>' +
        estq +
        (x ? '<div class="usado"><b>USADO EM ' + usado + ' PRODUTO' + (usado === 1 ? '' : 'S') + '</b><span class="mut">' +
          (x.ativo ? (usado ? 'Estruturas (BOM) ativas que levam este insumo.' : 'Nenhuma estrutura ativa usa este insumo.') : 'Insumo inativo: não entra em novas estruturas.') + '</span></div>' : '') +
        '<div class="nota">O saldo muda pelo ✏ Corrigir saldo (fica registrado em Ajustes de saldo). Desativar não apaga: o insumo some das novas BOMs.</div>' +
      '</div>' +
      '<div class="gv-rod">' +
        (pode && !g.novo ? '<button class="btn2 esq" data-acao="ativo">' + (x.ativo ? 'Inativar' : 'Reativar') + '</button>' : '') +
        (!g.novo && podeAjustar && x.ativo ? '<button class="btn2" data-acao="ajustar" title="Corrigir saldo">' + Ui.ic('i-lapis') + 'Corrigir saldo</button>' : '') +
        (g.novo ? '' : '<button class="btn2" data-acao="historico" title="Quem criou e alterou o cadastro">' + Ui.ic('i-hist') + 'Histórico</button>') +
        (pode && (g.novo || x.ativo) ? '<button class="btn2 salvar" data-acao="salvar" id="bt-salvar">' + Ui.ic('i-check') + 'Salvar <span class="n" id="n-salvar">0</span></button>'
          : '<button class="btn2" data-acao="fechar">Fechar</button>') +
      '</div>';
    marcar();
  }

  // Atualiza a política (botões), o mínimo travado e as marcas de alteração.
  function marcar() {
    const mud = camposMudados();
    document.querySelectorAll('#gaveta [data-pol]').forEach(function (b) { b.classList.toggle('on', b.dataset.pol === g.campos.politica); });
    const seg = $('#gaveta [data-seg]');
    if (seg) seg.classList.toggle('mud', !g.novo && mud.indexOf('politica') !== -1);
    document.querySelectorAll('#gaveta [data-campo]').forEach(function (el) { el.classList.toggle('mud', !g.novo && mud.indexOf(el.dataset.campo) !== -1); });
    const min = $('#gaveta [data-campo="minimo"]');
    if (min) {
      const sd = g.campos.politica === 'SOB_DEMANDA';
      min.disabled = sd || !pode || (!g.novo && !g.x.ativo);
      if (sd) min.value = g.campos.minimo;
    }
    contar();
  }

  // ---------- Mudanças (contador do Salvar) ----------
  function camposMudados() {
    if (!g) return [];
    return ['descricao', 'unidade', 'categoria', 'consumo', 'politica', 'minimo', 'lead'].filter(function (k) { return norm(k, g.campos[k]) !== norm(k, g.orig[k]); });
  }
  function norm(k, v) {
    v = String(v === null || v === undefined ? '' : v).trim();
    if (k === 'minimo' || k === 'lead') { const n = numero(v); return n === null ? v : String(n); }
    return k === 'descricao' ? v : v.toUpperCase();
  }
  function contar() {
    if (!g) return 0;
    const n = g.novo
      ? ['cod', 'descricao', 'unidade', 'categoria', 'consumo', 'minimo', 'lead'].filter(function (k) { return String(g.campos[k]).trim(); }).length
      : camposMudados().length;
    const el = $('#n-salvar');
    if (el) el.textContent = n;
    const bt = $('#bt-salvar');
    if (bt) bt.disabled = salvando || !n;
    return n;
  }

  // ---------- Eventos da gaveta ----------
  $('#gaveta').addEventListener('input', function (ev) {
    const t = ev.target;
    if (!t.dataset.campo) return;
    g.campos[t.dataset.campo] = t.value;
    marcar();
  });
  $('#gaveta').addEventListener('change', function (ev) {
    const t = ev.target;
    if (!t.dataset.campo) return;
    g.campos[t.dataset.campo] = t.value;
    if (t.dataset.campo === 'unidade') { t.value = t.value.trim().toUpperCase(); g.campos.unidade = t.value; }
    // insumo novo: a categoria sugere política, processo e unidade
    if (t.dataset.campo === 'categoria' && g.novo) {
      const c = g.campos;
      if (t.value === 'EMBALAGEM') { c.politica = 'SOB_DEMANDA'; c.minimo = '0'; c.consumo = 'INSPEÇÃO FINAL'; if (!c.unidade) c.unidade = 'CX'; }
      if (t.value === 'LUVA' || t.value === 'FILTRO') { c.politica = 'ESTOCADO'; c.consumo = 'MOLDAGEM'; if (!c.unidade) c.unidade = 'UNID'; }
      desenharGaveta();
      return;
    }
    if (t.dataset.campo === 'cod' && g.novo) {
      const ja = itens.find(function (i) { return i.cod === t.value.trim().toUpperCase(); });
      if (ja) Ui.toast('O código ' + ja.cod + ' já está cadastrado (' + ja.descricao + ').', 'aviso');
    }
    marcar();
  });
  $('#gaveta').addEventListener('click', function (ev) {
    const b = ev.target.closest('[data-pol]');
    if (!b || b.disabled) return;
    g.campos.politica = b.dataset.pol;
    if (b.dataset.pol === 'SOB_DEMANDA') g.campos.minimo = '0';
    marcar();
  });

  // ---------- Salvar ----------
  async function salvar() {
    if (!g || salvando) return;
    const c = g.campos, erro = $('#gaveta .msg-erro');
    const cod = (g.novo ? c.cod : g.orig.cod).trim().toUpperCase();
    Ui.msgErro(erro, '');
    if (!cod) return Ui.msgErro(erro, 'Informe o código.');
    if (g.novo && itens.some(function (i) { return i.cod === cod; })) return Ui.msgErro(erro, 'O código ' + cod + ' já está cadastrado.');
    if (!c.descricao.trim()) return Ui.msgErro(erro, 'Informe a descrição.');
    if (!c.unidade.trim()) return Ui.msgErro(erro, 'Informe a unidade.');
    if (!c.categoria) return Ui.msgErro(erro, 'Escolha a categoria.');
    if (c.minimo.trim() && numero(c.minimo) === null) return Ui.msgErro(erro, 'Estoque mínimo deve ser um número.');
    if (c.lead.trim() && numero(c.lead) === null) return Ui.msgErro(erro, 'Lead time deve ser um número de dias.');

    const MAPA = { descricao: 'descricao', unidade: 'unidade', categoria: 'categoria', consumo: 'processo_consumo', politica: 'politica', minimo: 'estoque_minimo', lead: 'lead_time_dias' };
    const campos = g.novo ? Object.keys(MAPA) : camposMudados();
    const dados = { cod_insumo: cod };
    campos.forEach(function (k) {
      let v = String(c[k]).trim();
      if (k !== 'descricao') v = v.toUpperCase();
      if (k === 'minimo' || k === 'lead') v = v === '' ? '' : numero(v);
      dados[MAPA[k]] = v;
    });
    salvando = true;
    contar();
    try {
      const r = await Api.chamar('salvarInsumo', dados);
      Ui.toast(r.criado ? 'Insumo ' + cod + ' criado.' : 'Insumo ' + cod + ' salvo · ' + (r.alterados || 0) + ' campo(s) alterado(s).');
      salvando = false;
      g = null;
      await carregar();
      abrirGaveta(cod);
    } catch (e) {
      salvando = false;
      Ui.msgErro(erro, e.message);
      contar();
    }
  }

  // ---------- Inativar / reativar ----------
  async function alternarAtivo() {
    const x = g.x, inativar = x.ativo;
    if (inativar && contar()) { Ui.toast('Salve ou descarte as alterações antes de inativar.', 'aviso'); return; }
    const usado = x.usadoEm || 0;
    const ok = await Ui.confirmar({
      titulo: inativar ? 'Inativar insumo' : 'Reativar insumo',
      texto: inativar
        ? x.cod + ' deixa de aparecer para novas estruturas e retiradas. Nada é apagado.' +
          (usado ? ' Ele ainda está na BOM de ' + usado + ' produto(s): lá ele aparece como "insumo inativo" e precisa ser trocado.' : '')
        : x.cod + ' volta a poder ser usado nas estruturas e no estoque.',
      ok: inativar ? 'Inativar' : 'Reativar', perigo: inativar
    });
    if (!ok) return;
    try {
      await Api.chamar('salvarInsumo', { cod_insumo: x.cod, ativo: inativar ? 'NAO' : 'SIM' });
      Ui.toast(x.cod + (inativar ? ' inativado.' : ' reativado.'));
      g = null;
      await carregar();
      abrirGaveta(x.cod);
    } catch (e) {
      Ui.erro(e);
    }
  }

  // ---------- Histórico ----------
  // Não há rota que leia MOV_AUDITORIA: mostra o que o cadastro devolve.
  function historico() {
    const r = g.x.reg;
    const linha = function (rot, v) { return '<div><span>' + rot + '</span><b>' + Ui.esc(v || '—') + '</b></div>'; };
    Ui.janela({
      titulo: 'Histórico · ' + g.x.cod,
      subtitulo: g.x.descricao,
      corpo: '<div class="hist">' +
        linha('Criado em', r.CRIADO_EM ? Fmt.dataHora(r.CRIADO_EM) : '') +
        linha('Criado por', nomeUsuario(r.CRIADO_POR)) +
        linha('Última alteração', r.ATUALIZADO_EM ? Fmt.dataHora(r.ATUALIZADO_EM) : 'nunca alterado') +
        linha('Alterado por', r.ATUALIZADO_POR) +
        linha('Situação', g.x.ativo ? 'Ativo' : 'Inativo') +
        '</div><p class="mut" style="font-size:12px;margin:14px 0 0">Cada alteração (campo, de → para, quem e quando) fica gravada na aba MOV_AUDITORIA da planilha. ' +
        'A consulta dessa lista aqui na tela ainda não está disponível.</p>',
      botoes: [{ texto: 'Fechar', classe: 'pri', valor: null }]
    });
  }

  // ---------- Apoio ----------
  function numero(v) {
    const s = String(v === null || v === undefined ? '' : v).trim().replace(',', '.');
    if (!s || isNaN(Number(s))) return null;
    return Number(s);
  }
  function ordemCat(c) { const i = ['LUVA', 'FILTRO', 'EMBALAGEM'].indexOf(c); return i === -1 ? 9 : i; }
  function nomeUsuario(login) { return login === 'importacao_nw' ? 'importação NW' : (login || ''); }
});
</script>
