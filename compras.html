<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Compras · Prometals</title>
<link rel="stylesheet" href="css/tema.css">
<link rel="stylesheet" href="css/sistema.css">
<style>
/* ---------- específico desta página (mockup-compras aprovado) ---------- */
.kl { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 14px; }
.kq { background: var(--painel); border: 1px solid var(--linha); border-radius: 12px; padding: 10px 14px; cursor: pointer; position: relative; overflow: hidden; text-align: left; font: inherit; color: inherit; }
.kq::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--c); }
.kq.sel { border-color: var(--c); box-shadow: 0 0 0 1px var(--c) inset; }
.kq .l { font-size: 11px; font-weight: 800; color: var(--texto-suave); letter-spacing: .4px; text-transform: uppercase; }
.kq b { display: block; font-size: 26px; font-variant-numeric: tabular-nums; } .kq .s { font-size: 12px; color: var(--texto-suave); }
.kq.alerta b { color: var(--c); }
.kq.piscando { animation: pisca 1.8s infinite; }
.km { cursor: pointer; border: 0; font: inherit; color: inherit; }
.cp { display: grid; grid-template-columns: 1fr; gap: 14px; align-items: start; }
.cx-lista { max-height: 60vh; overflow: auto; margin: -16px -18px 0; }
.cx-filtro { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
.cx-filtro button { height: 30px; border: 1px solid var(--borda); border-radius: 8px; background: transparent; font: inherit; font-size: 12px; font-weight: 700; color: var(--texto-suave); padding: 0 10px; cursor: pointer; }
.cx-filtro button.on { border-color: var(--destaque); color: var(--destaque); }
.cp > * { min-width: 0; }
.bx { background: var(--painel); border: 1px solid var(--linha); border-radius: 14px; overflow: hidden; }
.bx-cab { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--linha); flex-wrap: wrap; }
.bx-cab h3 { margin: 0; font-size: 15px; } .bx-cab .s { font-size: 12px; color: var(--texto-suave); } .bx-cab .dir { margin-left: auto; display: flex; gap: 8px; }
.bx-cab select { height: 32px; font-size: 12.5px; padding: 0 8px; width: auto; }
.bx-cab .filtro-on { font-size: 12px; font-weight: 700; color: var(--destaque); }
.bx-cab .filtro-on button { background: none; border: 0; color: inherit; font: inherit; text-decoration: underline; cursor: pointer; padding: 0; margin-left: 4px; }
.tab-wrap { overflow: auto; }
.cat { font-size: 10px; font-weight: 800; padding: 2px 7px; border-radius: 5px; background: var(--painel-2); color: var(--texto-suave); }
.cat.luva { background: rgba(59,130,246,.18); color: #93c5fd; } .cat.filtro { background: rgba(20,184,166,.18); color: #5eead4; } .cat.emb { background: rgba(240,122,31,.18); color: #fdba74; }
html.tema-claro .cat.luva { color: #1d4ed8; } html.tema-claro .cat.filtro { color: #0f766e; } html.tema-claro .cat.emb { color: #9a3412; }
.stt { font-size: 10.5px; font-weight: 800; padding: 3px 8px; border-radius: 6px; white-space: nowrap; }
.stt.ok { background: rgba(34,197,94,.15); color: #34d399; } .stt.comprar { background: rgba(234,179,8,.18); color: #eab308; } .stt.rup { background: rgba(220,38,38,.18); color: #f87171; }
html.tema-claro .stt.ok { color: #166534; } html.tema-claro .stt.comprar { color: #92400e; } html.tema-claro .stt.rup { color: #b91c1c; }
.neg { color: #f87171; font-weight: 800; } html.tema-claro .neg { color: #b91c1c; }
.sug b { color: var(--destaque); }
.cp table.tab th, .cp table.tab td { padding-left: 9px; padding-right: 9px; } .cp table.tab td:first-child, .cp table.tab th:first-child { padding-left: 16px; }
.cp table.tab td.d { max-width: 175px; overflow: hidden; text-overflow: ellipsis; }
.cp table.tab td.d small { display: block; color: var(--texto-suave); font-size: 11px; overflow: hidden; text-overflow: ellipsis; }
.cp table.tab tbody tr { cursor: pointer; }
tr.rup td:first-child { box-shadow: inset 3px 0 0 #dc2626; } tr.comprar td:first-child { box-shadow: inset 3px 0 0 #eab308; }
.sc { display: grid; grid-template-columns: 1fr auto; gap: 3px 10px; padding: 10px 16px; border-bottom: 1px solid var(--linha); font-size: 12.5px; }
.sc:last-child { border-bottom: 0; }
.sc b { font-size: 13px; } .sc small { color: var(--texto-suave); font-size: 11.5px; grid-column: 1; }
.sc .stt { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
.sc .acs { grid-column: 1 / -1; display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 4px; }
.sc .acs input, .sc .acs select { height: 30px; font-size: 12px; padding: 0 8px; min-width: 0; }
.sc.urg { box-shadow: inset 3px 0 0 #dc2626; }
.stt.pend { background: rgba(240,122,31,.18); color: #fdba74; } .stt.compr { background: rgba(59,130,246,.18); color: #93c5fd; } .stt.cheg { background: rgba(34,197,94,.15); color: #34d399; }
html.tema-claro .stt.pend { color: #9a3412; } html.tema-claro .stt.compr { color: #1d4ed8; } html.tema-claro .stt.cheg { color: #166534; }
.btn2.verde { background: #16a34a; border-color: #16a34a; color: #fff; }
/* caixas: vai usar em / comprar até / ciente */
.sc .datas { grid-column: 1 / -1; display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--texto-suave); }
.sc .datas b { color: var(--texto); font-size: 12.5px; }
.sc .datas .venc b { color: #f87171; } html.tema-claro .sc .datas .venc b { color: #b91c1c; }
.sc .rod { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; margin-top: 2px; font-size: 11.5px; color: var(--texto-suave); }
.sc .rod .btn2 { margin-left: auto; height: 30px; font-size: 12.5px; }
.sc.pisca { --c: #f07a1f; animation: pisca 1.8s infinite; box-shadow: inset 3px 0 0 #f07a1f; }
.cm.pisca { --c: #f07a1f; animation: pisca 1.8s infinite; }
.stt.mudou { background: rgba(240,122,31,.25); color: #fdba74; } html.tema-claro .stt.mudou { color: #9a3412; }
/* janelas (entrada, inventário, OPs) */
.mf { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.fc { display: grid; gap: 5px; font-size: 11px; font-weight: 800; color: var(--texto-suave); letter-spacing: .4px; align-content: start; }
.fc input, .fc select { height: 38px; font-size: 13.5px; padding: 0 10px; }
.fc.l { grid-column: 1 / -1; } .fc small { font-weight: 600; font-size: 11px; letter-spacing: 0; }
.vinc { grid-column: 1 / -1; background: var(--painel-2); border-radius: 10px; padding: 10px 12px; font-size: 12.5px; display: grid; gap: 8px; }
.vinc label { display: flex; gap: 8px; align-items: center; }
.vinc select { height: 36px; font-size: 13px; padding: 0 8px; }
.chk { width: 16px; height: 16px; accent-color: var(--destaque); flex: none; padding: 0; }
.inv-wrap { max-height: 52vh; overflow: auto; margin: -16px -18px 0; }
.inv-wrap table.tab td, .inv-wrap table.tab th { padding: 8px 12px; }
.inv-wrap input.in { width: 90px; height: 32px; text-align: right; font-weight: 800; padding: 0 8px; margin-left: auto; display: block; }
.dif.neg2 { color: #f87171; font-weight: 800; } .dif.pos { color: #34d399; font-weight: 800; } .dif.zero { color: var(--texto-suave); }
html.tema-claro .dif.neg2 { color: #b91c1c; } html.tema-claro .dif.pos { color: #166534; }
.rodape .t-inv { margin-right: auto; font-size: 12px; color: var(--texto-suave); align-self: center; }
.ops-lista table.tab td, .ops-lista table.tab th { padding: 8px 10px; }
/* tabela única: Por insumo | Por OP */
.seg { display: inline-flex; border: 1px solid var(--borda); border-radius: 9px; overflow: hidden; height: 32px; }
.seg button { border: 0; background: transparent; font: inherit; font-size: 12.5px; font-weight: 800; color: var(--texto-suave); padding: 0 14px; cursor: pointer; }
.seg button.on { background: var(--destaque); color: #fff; }
.tg-falta { height: 32px; border: 1px solid var(--borda); border-radius: 9px; background: transparent; font: inherit; font-size: 12.5px; font-weight: 700; color: var(--texto-suave); padding: 0 12px; cursor: pointer; }
.tg-falta.on { border-color: #dc2626; color: #f87171; background: rgba(220,38,38,.08); }
html.tema-claro .tg-falta.on { color: #b91c1c; }
.tab-wrap { max-height: calc(100vh - 360px); min-height: 220px; }
.tab-wrap table.tab th { position: sticky; top: 0; z-index: 1; }
td.seta { width: 18px; color: var(--texto-suave); font-size: 11px; padding-right: 0 !important; }
tr.aberto td.seta { color: var(--destaque); }
.pq { font-size: 10.5px; font-weight: 800; padding: 2px 7px; border-radius: 5px; white-space: nowrap; }
.pq.op { background: rgba(240,122,31,.18); color: #fdba74; } .pq.min { background: rgba(234,179,8,.18); color: #eab308; } .pq.cx { background: var(--painel-2); color: var(--texto-suave); }
html.tema-claro .pq.op { color: #9a3412; } html.tema-claro .pq.min { color: #92400e; }
.pq-ops { font-size: 11.5px; color: var(--texto-suave); margin-left: 6px; white-space: nowrap; }
tr.det > td { background: var(--painel-2); padding: 6px 16px 10px 40px !important; cursor: default; }
.det-tab { width: 100%; border-collapse: collapse; font-size: 12px; }
.det-tab th { text-align: left; font-size: 10px; font-weight: 800; color: var(--texto-suave); letter-spacing: .4px; padding: 4px 8px; text-transform: uppercase; }
.det-tab td { padding: 4px 8px; border-top: 1px solid var(--linha); }
.det-tab .num { text-align: right; }
.det-inf { font-size: 11.5px; color: var(--texto-suave); margin-top: 6px; }
.f { color: #f87171; font-weight: 800; } html.tema-claro .f { color: #b91c1c; }
.okc { color: #34d399; font-weight: 700; font-size: 11.5px; } html.tema-claro .okc { color: #166534; }
tr.op-ini td { border-top: 1px solid var(--linha); }
tr.op-cont td { border-top-color: transparent; }
td.op-n { font-weight: 800; white-space: nowrap; }
.rod-tab { padding: 8px 16px; border-top: 1px solid var(--linha); font-size: 12px; color: var(--texto-suave); }
.lista-tab .li { padding: 9px 14px; border-top: 1px solid var(--linha); font-size: 13px; cursor: pointer; }
.lista-tab .li:first-child { border-top: 0; }
.lista-tab .li small { display: block; color: var(--texto-suave); font-size: 11.5px; margin-top: 2px; }
@media (max-width: 760px) {
  .bx-cab .dir #fOrd { display: none; }
  .bx-cab .s { display: none; }
  #bx-tab { margin-bottom: 12px; }
}
.lista-mob { padding-bottom: 90px; }
.cm { cursor: pointer; text-align: left; }
.cm.urg { border-left: 3px solid #dc2626; }
.cm .stt { margin-left: auto; }

@media (max-width: 1250px) { .cp { grid-template-columns: 1fr; } }
@media (max-width: 760px) {
  .mf { grid-template-columns: 1fr; }
  .inv-wrap .col-desc { display: none; }
  .inv-wrap input.in { width: 76px; }
  .inv-wrap table.tab td, .inv-wrap table.tab th { padding: 8px 8px; }
  .rodape { flex-wrap: wrap; }
  .rodape .t-inv { width: 100%; }
}
</style>
</head>
<body>

<!-- Compras — SÓ LEITURA: saldo, o que as OPs abertas vão consumir
     ("vai sair"), projetado e o que comprar. Caixas (embalagem sob
     demanda) aparecem sozinhas quando o PCP abre a OP, com "vai usar em"
     (início da Inspeção Final no cronograma) e "comprar até" (− lead
     time). Pisca até alguém de Compras dar ✔ Ciente; se a data de uso
     mudar, pisca de novo. Entrada e inventário ficam no Insumos. -->
<main class="conteudo">
  <div class="tit-pagina">
    <div><h1>Compras</h1><p>O que precisa comprar · por insumo ou por OP · de OP e sem OP</p></div>
    <div class="acoes-pagina so-desk">
      <button class="btn2" data-imprimir-compras title="Imprimir a lista do que está na tela"><svg class="i"><use href="#i-imp"/></svg>Imprimir</button>
      <button class="btn2" data-excel-compras title="Baixar a lista em Excel (.xlsx)"><svg class="i"><use href="#i-xls"/></svg>Excel</button>
    </div>
  </div>

  <div class="kl so-desk" id="cards"></div>

  <div class="cp">
    <div class="kpi-mini so-mob" id="cards-mob"></div>
    <section class="bx" id="bx-tab">
      <div class="bx-cab"><h3>O que comprar</h3>
        <div class="seg" role="tablist"><button type="button" data-visao="INS" class="on">Por insumo</button><button type="button" data-visao="OP">Por OP</button></div>
        <button type="button" class="tg-falta on" id="bSoFalta" title="Mostrar só o que falta / mostrar tudo">Só o que falta</button>
        <span class="filtro-on" id="filtro-ins"></span>
        <div class="dir">
          <select id="fCat" title="De OP = luva e filtro (consumo das OPs) · Sem OP = outros (manutenção, retirada sem OP)"><option value="TODAS">Todos</option><option value="OP">De OP (luva e filtro)</option><option value="SEM">Sem OP (outros)</option></select>
          <select id="fOrd" title="Ordem"><option value="urg">Precisa comprar primeiro</option><option value="cod">Código</option></select>
        </div></div>
      <div class="tab-wrap so-desk">
        <table class="tab"><thead id="cab"></thead>
          <tbody id="linhas"><tr><td colspan="8"><div class="carregando">Carregando…</div></td></tr></tbody></table>
      </div>
      <div class="lista-tab so-mob" id="lista-tab"></div>
      <div class="rod-tab" id="rod-tab"></div>
    </section>
    <div class="barra-mob so-mob">
      <button class="ic" data-imprimir-compras title="Imprimir"><svg class="i"><use href="#i-imp"/></svg></button>
      <button class="ic" data-excel-compras title="Excel"><svg class="i"><use href="#i-xls"/></svg></button>
    </div>
  </div>
</main>

<script src="js/config.js"></script>
<script src="js/icones.js"></script>
<script src="js/ui.js"></script>
<script src="js/api.js"></script>
<script src="js/cronograma.js"></script>
<script src="js/sessao.js"></script>
<script src="js/shell.js"></script>
<script>
Sessao.iniciarPagina('compras').then(function (ctx) {
  const $ = function (s) { return document.querySelector(s); };
  const e = Ui.esc;

  let painel = { indicadores: {}, insumos: [], solicitacoes: [] };
  let modo = '';              // filtro dos cards: RUPTURA | ABAIXO | SEM_CIENTE | SEMANA
  const CATS_FILTRO = { TODAS: 'TODAS', OP: ['LUVA', 'FILTRO'], SEM: ['OUTROS'] };
  const NOME_CAT = { TODAS: 'Todos', OP: 'De OP (luva e filtro)', SEM: 'Sem OP (outros)' };
  let visao = 'INS';          // tabela: INS (por insumo) | OP (por OP)
  let soFalta = true;         // mostra só o que falta
  const abertos = {};         // insumos com a linha de OPs aberta

  carregar();
  // Recalcula a cada 60 s (não atrapalha quem está digitando ou com janela aberta)
  setInterval(function () {
    const f = document.activeElement;
    if (document.hidden || document.querySelector('.modal-fundo')) return;
    carregar(true);
  }, 60000);

  async function carregar(silencioso) {
    try {
      painel = await Api.chamar('painelCompras', { categorias: CATS_FILTRO[$('#fCat').value] }, { rapido: function () {
        const f = document.activeElement;
        if (!document.querySelector('.modal-fundo')) carregar(true);
      } });
      desenhar();
    } catch (err) {
      if (!silencioso) Ui.erro(err);
    }
  }
  // ---------- Apoio ----------
  function catClasse(c) { return { LUVA: 'luva', FILTRO: 'filtro', EMBALAGEM: 'emb' }[c] || ''; }
  function titulo(s) { return String(s || '').toLowerCase().replace(/(^|\s)\S/g, function (l) { return l.toUpperCase(); }); }
  function dataBR(d) { return String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear(); }
  function deBR(br) { const m = /^(\d{2})\/(\d{2})\/(\d{4})$/.exec(br || ''); return m ? new Date(+m[3], m[2] - 1, +m[1]) : null; }
  function hojeMais(dias) { const d = new Date(); d.setHours(0, 0, 0, 0); d.setDate(d.getDate() + dias); return d; }

  // ---------- Regras dos filtros (mesmas contas do servidor) ----------
  const abaixo = function (i) { return i.projetado < i.minimo || i.situacao === 'RUPTURA'; };
  // Caixas: "vai usar em" = início da INSPEÇÃO FINAL no cronograma da OP
  // (prazo + liga); sem prazo, usa a data de necessidade gravada.
  // "Comprar até" = vai usar em − lead time do insumo (dias corridos).
  function usoDe(s) {
    const c = Cronograma.cronograma({ prazo: s.prazo, liga: s.liga });
    const f = c && c.fases.find(function (x) { return x.n === 'INSPEÇÃO FINAL'; });
    return f ? f.ini : deBR(s.data_necessidade);
  }
  function comprarAteDe(s) {
    const u = usoDe(s);
    if (!u) return null;
    const d = new Date(u); d.setDate(d.getDate() - (Number(s.lead_time) || 0));
    return d;
  }
  const aberta = function (s) { return s.status === 'SOLICITADO' || s.status === 'COMPRADO'; };
  // Precisa de ciente: nova (ninguém viu) ou a data de uso mudou depois do ciente
  const semCiente = function (s) {
    if (s.status === 'SOLICITADO') return true;
    if (s.status !== 'COMPRADO') return false;
    const u = usoDe(s);
    return !!u && s.ciente_uso !== dataBR(u);
  };
  const dataMudou = function (s) { return s.status === 'COMPRADO' && semCiente(s); };
  const nestaSemana = function (s) { const d = comprarAteDe(s); return aberta(s) && d && d <= hojeMais(7); };
  const urgente = function (s) { const d = comprarAteDe(s); return aberta(s) && (s.processo === 'INSPEÇÃO FINAL' || (d && d <= hojeMais(0))); };
  const MODOS_INS = { RUPTURA: 1, ABAIXO: 1 }, MODOS_SC = { SEM_CIENTE: 1, SEMANA: 1 };
  const ROTULO = { RUPTURA: 'Ruptura prevista', ABAIXO: 'Abaixo do mínimo', SEM_CIENTE: 'Caixas sem ciente', SEMANA: 'Comprar esta semana' };

  function insumosFiltrados() {
    let l = painel.insumos.slice();
    if (modo === 'RUPTURA') l = l.filter(function (i) { return i.situacao === 'RUPTURA'; });
    if (modo === 'ABAIXO') l = l.filter(abaixo);
    if ($('#fOrd').value === 'cod') l.sort(function (a, b) { return a.cod_insumo.localeCompare(b.cod_insumo); });
    return l;
  }
  function solicitacoesFiltradas(f) {
    let l = painel.solicitacoes;
    if (f === 'SEM_CIENTE') l = l.filter(semCiente);
    if (f === 'SEMANA') l = l.filter(nestaSemana);
    // sem ciente primeiro, depois quem precisa comprar antes
    return l.slice().sort(function (a, b) {
      return (semCiente(b) - semCiente(a)) || ((comprarAteDe(a) || 0) - (comprarAteDe(b) || 0));
    });
  }

  // ---------- Desenho ----------
  function desenhar() {
    const ind = painel.indicadores;
    const nSem = painel.solicitacoes.filter(semCiente).length;
    const nMud = painel.solicitacoes.filter(dataMudou).length;
    const nSemana = painel.solicitacoes.filter(nestaSemana).length;
    const k = [
      { m: 'RUPTURA', c: '#dc2626', n: ind.ruptura, s: 'o projetado fica negativo', mob: 'Ruptura', pisca: ind.ruptura > 0 },
      { m: 'ABAIXO', c: '#eab308', n: ind.abaixoMinimo, s: 'sugerido comprar', mob: 'Abaixo mín.' },
      { m: 'SEM_CIENTE', c: '#f07a1f', n: nSem, s: nMud ? nMud + ' com data de uso alterada' : 'novas · dê ✔ Ciente', mob: 'Sem ciente', pisca: nSem > 0 },
      { m: 'SEMANA', c: '#3b82f6', n: nSemana, s: '"comprar até" nos próximos 7 dias', mob: 'Esta semana', neutro: true }
    ];
    $('#cards').innerHTML = k.map(function (x) {
      return '<button class="kq' + (x.n > 0 && !x.neutro ? ' alerta' : '') + (x.pisca ? ' piscando' : '') + (modo === x.m ? ' sel' : '') + '" ' + (MODOS_SC[x.m] ? 'data-caixas' : 'data-modo') + '="' + x.m + '" style="--c:' + x.c + '"' + (MODOS_SC[x.m] ? ' title="Abrir a lista de caixas"' : '') + '>' +
        '<span class="l">' + ROTULO[x.m] + '</span><b>' + e(x.n || 0) + '</b><span class="s">' + e(x.s) + '</span></button>';
    }).join('');
    $('#cards-mob').innerHTML = k.map(function (x) {
      return '<button class="km' + (x.pisca ? ' piscando' : '') + (modo === x.m ? ' sel' : '') + '" ' + (MODOS_SC[x.m] ? 'data-caixas' : 'data-modo') + '="' + x.m + '" style="--c:' + x.c + '"><b>' + e(x.n || 0) + '</b> ' + x.mob + '</button>';
    }).join('');
    desenharTabela();
    redesenharCaixas();
  }

  // ---------- Conta por OP ----------
  // Para cada OP que ainda vai consumir: o que ela vai usar × o que tem.
  // A conta é acumulada, da OP mais antiga para a mais nova: se duas OPs
  // usam a mesma luva, a segunda já considera o que a primeira vai tirar.
  function avisosPorOP() {
    const porOP = {}, ordem = [];
    painel.insumos.forEach(function (i) {
      if (i.politica === 'SOB_DEMANDA') return;   // caixa tem o fluxo próprio (coluna da direita)
      (i.ops || []).forEach(function (o) {
        let a = porOP[o.id_item];
        if (!a) { a = porOP[o.id_item] = { op: o.op, cliente: o.cliente, processo: o.processo, itens: [] }; ordem.push(a); }
        a.itens.push({ cod: i.cod_insumo, desc: i.descricao, un: String(i.unidade || '').toLowerCase(), precisa: o.falta, saldo: i.saldo });
      });
    });
    const numOP = function (a) { return Number(String(a.op).replace(/\D/g, '')) || 0; };
    ordem.sort(function (a, b) { return numOP(a) - numOP(b); });
    const disponivel = {};
    painel.insumos.forEach(function (i) { disponivel[i.cod_insumo] = i.saldo; });
    ordem.forEach(function (a) {
      a.falta = false;
      a.itens.forEach(function (it) {
        it.tem = Math.max(disponivel[it.cod] || 0, 0);
        it.faltam = Math.max(it.precisa - it.tem, 0);
        disponivel[it.cod] = (disponivel[it.cod] || 0) - it.precisa;
        if (it.faltam > 0) a.falta = true;
      });
    });
    return ordem;   // mais antiga primeiro (é quem consome primeiro)
  }
  // cod do insumo → OPs que vão usar (com precisa / tem / faltam)
  function opsPorInsumo(lista) {
    const m = {};
    lista.forEach(function (a) { a.itens.forEach(function (it) { (m[it.cod] = m[it.cod] || []).push({ op: a.op, cliente: a.cliente, processo: a.processo, precisa: it.precisa, tem: it.tem, faltam: it.faltam }); }); });
    return m;
  }

  const n = function (v) { return e(Fmt.num(v)); };
  function catClasseLinha(i) { return i.situacao === 'RUPTURA' ? 'rup' : (i.situacao === 'COMPRAR' || i.situacao === 'ATENCAO') ? 'comprar' : ''; }
  // Por que comprar: OP (as OPs vão usar mais do que tem), Estoque mínimo
  // (nenhuma OP falta, mas o saldo fica abaixo do mínimo) ou os dois.
  function porQue(i) {
    if (i.politica === 'SOB_DEMANDA') return { cls: 'cx', txt: 'Caixa · ver ao lado' };
    if (i.projetado < 0 && i.minimo > 0) return { cls: 'op', txt: 'OP + mínimo' };
    if (i.projetado < 0) return { cls: 'op', txt: 'OP' };
    if (i.projetado < i.minimo) return { cls: 'min', txt: 'Estoque mínimo' };
    return null;
  }
  const falta = function (i) { return i.sugerido > 0 || i.projetado < 0; };

  function insumosFiltrados() {
    let l = painel.insumos.slice();
    if (modo === 'RUPTURA') l = l.filter(function (i) { return i.situacao === 'RUPTURA'; });
    if (modo === 'ABAIXO') l = l.filter(abaixo);
    if (soFalta && !MODOS_INS[modo]) l = l.filter(falta);
    if ($('#fOrd').value === 'cod') l.sort(function (a, b) { return a.cod_insumo.localeCompare(b.cod_insumo); });
    return l;
  }
  // Por OP: uma linha por OP + insumo
  function linhasPorOP() {
    const l = [];
    avisosPorOP().forEach(function (a) {
      const itens = soFalta ? a.itens.filter(function (it) { return it.faltam > 0; }) : a.itens;
      itens.forEach(function (it, k) { l.push({ a: a, it: it, ini: k === 0 }); });
    });
    return l;
  }

  function desenharTabela() {
    document.querySelectorAll('[data-visao]').forEach(function (b) { b.classList.toggle('on', b.dataset.visao === visao); });
    $('#bSoFalta').classList.toggle('on', soFalta);
    $('#fOrd').hidden = visao !== 'INS';
    $('#filtro-ins').innerHTML = MODOS_INS[modo] ? 'Filtro: ' + ROTULO[modo] + '<button type="button" data-modo="' + modo + '">limpar</button>' : '';
    if (visao === 'OP') desenharPorOP(); else desenharPorInsumo();
  }

  function desenharPorInsumo() {
    const l = insumosFiltrados();
    const ops = opsPorInsumo(avisosPorOP());
    $('#cab').innerHTML = '<tr><th></th><th>Insumo</th><th class="num">Tem</th><th class="num">Vai usar (OPs)</th><th class="num">Sobra / falta</th><th class="num">Mínimo</th><th class="num">Comprar</th><th>Por quê</th></tr>';
    const opsTexto = function (cod) {
      const f = (ops[cod] || []).filter(function (o) { return o.faltam > 0; }).map(function (o) { return o.op; });
      return f.length ? 'OP ' + f.slice(0, 3).join(', ') + (f.length > 3 ? ' +' + (f.length - 3) : '') : '';
    };
    $('#linhas').innerHTML = l.map(function (i) {
      const pq = porQue(i), lista = ops[i.cod_insumo] || [], ab = !!abertos[i.cod_insumo] && lista.length;
      let html = '<tr class="' + catClasseLinha(i) + (ab ? ' aberto' : '') + '" data-ins="' + e(i.cod_insumo) + '"><td class="seta">' + (lista.length ? (ab ? '▾' : '▸') : '') + '</td>' +
        '<td class="d" title="' + e(i.descricao) + '"><b>' + e(i.cod_insumo) + '</b> <span class="cat ' + catClasse(i.categoria) + '">' + e(i.categoria) + '</span><small>' + e(i.descricao) + '</small></td>' +
        '<td class="num">' + n(i.saldo) + '</td><td class="num">' + (i.vai_sair ? n(i.vai_sair) : '—') + '</td>' +
        '<td class="num">' + (i.projetado < 0 ? '<span class="neg">' + n(i.projetado) + '</span>' : n(i.projetado)) + '</td>' +
        '<td class="num">' + (i.minimo ? n(i.minimo) : '—') + '</td>' +
        '<td class="num sug">' + (i.sugerido > 0 ? '<b>' + n(i.sugerido) + '</b>' : '—') + '</td>' +
        '<td>' + (pq ? '<span class="pq ' + pq.cls + '">' + pq.txt + '</span>' + (pq.cls === 'op' ? '<span class="pq-ops">' + e(opsTexto(i.cod_insumo)) + '</span>' : '') : '<span class="okc">ok</span>') + '</td></tr>';
      if (ab) {
        html += '<tr class="det"><td colspan="8"><table class="det-tab"><thead><tr><th>OP</th><th>Cliente</th><th>Processo</th><th class="num">Precisa</th><th class="num">Tem</th><th class="num">Falta</th></tr></thead><tbody>' +
          lista.map(function (o) {
            return '<tr><td><b>' + e(o.op) + '</b></td><td>' + e(titulo(o.cliente)) + '</td><td>' + e(titulo(o.processo)) + '</td><td class="num">' + n(o.precisa) + '</td><td class="num">' + n(o.tem) + '</td>' +
              '<td class="num">' + (o.faltam > 0 ? '<span class="f">' + n(o.faltam) + '</span>' : '<span class="okc">ok</span>') + '</td></tr>';
          }).join('') + '</tbody></table><div class="det-inf">Lead time ' + n(i.lead_time) + ' dias · mínimo ' + n(i.minimo) + ' ' + e(String(i.unidade || '').toLowerCase()) + '</div></td></tr>';
      }
      return html;
    }).join('') || '<tr><td colspan="8"><div class="vazio">' + (soFalta && !modo ? '✅ Nada para comprar nesta categoria.' : 'Nenhum insumo neste filtro.') + '</div></td></tr>';
    // celular
    $('#lista-tab').innerHTML = l.map(function (i) {
      const pq = porQue(i);
      return '<div class="li" data-ins="' + e(i.cod_insumo) + '"><b>' + e(i.cod_insumo) + '</b> · ' + e(i.descricao) +
        (i.sugerido > 0 ? ' — <span class="f">comprar ' + n(i.sugerido) + '</span>' : '') +
        '<small>' + (pq ? pq.txt + (pq.cls === 'op' ? ' (' + e(opsTexto(i.cod_insumo)) + ')' : '') + ' · ' : '') + 'tem ' + n(i.saldo) + ' · vai usar ' + n(i.vai_sair) + ' · mín. ' + n(i.minimo) + '</small></div>';
    }).join('') || '<div class="vazio">' + (soFalta && !modo ? '✅ Nada para comprar.' : 'Nenhum insumo neste filtro.') + '</div>';
    const nComprar = painel.insumos.filter(function (i) { return i.sugerido > 0; }).length;
    $('#rod-tab').textContent = l.length + ' insumo' + (l.length === 1 ? '' : 's') + ' na lista · ' + nComprar + ' para comprar' + ($('#fCat').value === 'SEM' ? ' · itens sem OP: compra pelo estoque mínimo' : ' · clique no insumo para ver as OPs');
  }

  function desenharPorOP() {
    const l = linhasPorOP();
    const todos = avisosPorOP();
    $('#cab').innerHTML = '<tr><th>OP</th><th>Cliente</th><th>Processo</th><th>Insumo</th><th class="num">Precisa</th><th class="num">Tem</th><th class="num">Falta</th></tr>';
    $('#linhas').innerHTML = l.map(function (x) {
      const a = x.a, it = x.it;
      return '<tr class="' + (x.ini ? 'op-ini' : 'op-cont') + '" data-ins="' + e(it.cod) + '"><td class="op-n">' + (x.ini ? e(a.op) : '') + '</td>' +
        '<td>' + (x.ini ? e(titulo(a.cliente)) : '') + '</td><td class="mut">' + (x.ini ? e(titulo(a.processo)) : '') + '</td>' +
        '<td class="d" title="' + e(it.desc) + '"><b>' + e(it.cod) + '</b><small>' + e(it.desc) + '</small></td>' +
        '<td class="num">' + n(it.precisa) + '</td><td class="num">' + n(it.tem) + '</td>' +
        '<td class="num">' + (it.faltam > 0 ? '<span class="f">' + n(it.faltam) + (it.un ? ' ' + e(it.un) : '') + '</span>' : '<span class="okc">ok</span>') + '</td></tr>';
    }).join('') || '<tr><td colspan="7"><div class="vazio">' + (todos.length ? '✅ As ' + todos.length + ' OPs têm material no estoque.' : 'Nenhuma OP em Planejamento, Modelação ou Moldagem vai consumir agora.') + '</div></td></tr>';
    $('#lista-tab').innerHTML = l.map(function (x) {
      const it = x.it;
      return '<div class="li" data-ins="' + e(it.cod) + '"><b>OP ' + e(x.a.op) + '</b> · ' + e(it.desc) + ' — ' + (it.faltam > 0 ? '<span class="f">faltam ' + n(it.faltam) + (it.un ? ' ' + e(it.un) : '') + '</span>' : '<span class="okc">ok</span>') +
        '<small>' + e(titulo(x.a.cliente)) + ' · ' + e(titulo(x.a.processo)) + ' · precisa ' + n(it.precisa) + ' · tem ' + n(it.tem) + '</small></div>';
    }).join('') || '<div class="vazio">' + (todos.length ? '✅ Todas as OPs têm material.' : 'Nenhuma OP vai consumir agora.') + '</div>';
    const opsFalta = todos.filter(function (a) { return a.falta; }).length;
    $('#rod-tab').textContent = opsFalta + ' de ' + todos.length + ' OP' + (todos.length === 1 ? '' : 's') + ' com falta de material · da OP mais antiga para a mais nova (a conta é acumulada)';
  }

  function tagSolic(s) {
    if (s.status === 'SOLICITADO') return '<span class="stt pend">NOVA</span>';
    if (dataMudou(s)) return '<span class="stt mudou">DATA MUDOU</span>';
    if (s.status === 'COMPRADO') return '<span class="stt compr">CIENTE</span>';
    if (s.status === 'RECEBIDO') return '<span class="stt cheg">CHEGOU</span>';
    return '<span class="stt">' + e(s.status) + '</span>';
  }
  function detalheSolic(s) {
    return 'OP ' + s.op + ' · ' + titulo(s.cliente) + ' · ' + Fmt.num(s.qtd) + ' ' + String(s.unidade || '').toLowerCase() + ' · ' +
      (s.processo === 'INSPEÇÃO FINAL' ? 'na Inspeção Final agora' : 'em ' + titulo(s.processo));
  }
  function datasSolic(s) {
    const u = usoDe(s), c = comprarAteDe(s);
    const venc = c && c < hojeMais(0) && aberta(s);
    return '<span>Vai usar em <b>' + (u ? dataBR(u) : '—') + '</b></span>' +
      '<span' + (venc ? ' class="venc"' : '') + '>Comprar até <b>' + (c ? dataBR(c) : '—') + '</b>' + (s.lead_time ? ' (lead ' + Fmt.num(s.lead_time) + ' d)' : '') + '</span>';
  }
  function cienteTexto(s) {
    if (s.status === 'RECEBIDO') return 'chegou · o almoxarifado baixa na Inspeção Final';
    if (s.status !== 'COMPRADO') return 'ninguém de Compras viu ainda';
    return 'ciente por ' + (s.ciente_por || '—') + (s.ciente_em ? ' em ' + s.ciente_em : '') + (dataMudou(s) ? ' (uso era ' + s.ciente_uso + ')' : '');
  }
  const podeCiente = function (s) { return ctx.podeEditar && semCiente(s); };

  function caixaHtml(s) {
    return '<div class="sc' + (semCiente(s) ? ' pisca' : urgente(s) ? ' urg' : '') + '" data-sc="' + e(s.id_solicitacao) + '"><b>' + e(s.cod_insumo) + ' · ' + e(s.descricao) + '</b>' + tagSolic(s) +
      '<small>' + e(detalheSolic(s)) + '</small><div class="datas">' + datasSolic(s) + '</div>' +
      '<div class="rod"><span>' + e(cienteTexto(s)) + '</span>' +
      (podeCiente(s) ? '<button type="button" class="btn2 verde" data-ciente="' + e(s.id_solicitacao) + '"><svg class="i"><use href="#i-check"/></svg>Ciente</button>' : '') + '</div></div>';
  }

  // ---------- Pop-up das caixas (card "Caixas sem ciente" / "Comprar esta semana") ----------
  let cxAberta = null;   // { filtro, caixa } enquanto o pop-up está aberto
  const FILTROS_CX = [{ f: 'SEM_CIENTE', t: 'Sem ciente' }, { f: 'SEMANA', t: 'Comprar esta semana' }, { f: '', t: 'Todas em aberto' }];
  function redesenharCaixas() {
    if (!cxAberta) return;
    const l = solicitacoesFiltradas(cxAberta.filtro);
    cxAberta.caixa.querySelector('.cx-filtro').innerHTML = FILTROS_CX.map(function (x) {
      return '<button type="button" data-cxf="' + x.f + '"' + (x.f === cxAberta.filtro ? ' class="on"' : '') + '>' + x.t + ' (' + solicitacoesFiltradas(x.f).length + ')</button>';
    }).join('');
    cxAberta.caixa.querySelector('.cx-lista').innerHTML = l.map(caixaHtml).join('') ||
      '<div class="vazio">' + (cxAberta.filtro === 'SEM_CIENTE' ? '✅ Todas as caixas já têm ciente.' : 'Nenhuma caixa neste filtro.') + '</div>';
  }
  function abrirCaixas(filtro) {
    Ui.janela({
      titulo: 'Caixas (embalagem)', subtitulo: 'Aparecem quando o PCP abre a OP · dê ✔ Ciente (se a data de uso mudar, pede de novo)',
      largura: 620, corpo: '<div class="cx-filtro"></div><div class="cx-lista"></div>', enterConfirma: false,
      botoes: [{ texto: 'Imprimir', classe: 'esq', valor: 'imp' }, { texto: 'Fechar', valor: null }],
      antesDeFechar: function (v) { if (v === 'imp') { imprimirCaixas(); return false; } return true; }
    }).then(function () { cxAberta = null; });
    const l = document.querySelectorAll('.modal-fundo .modal-caixa');
    cxAberta = { filtro: filtro, caixa: l[l.length - 1] };
    cxAberta.caixa.addEventListener('click', function (ev) {
      const fb = ev.target.closest('[data-cxf]');
      if (fb) { cxAberta.filtro = fb.dataset.cxf; redesenharCaixas(); return; }
      const ci = ev.target.closest('[data-ciente]');
      if (ci) darCiente(ci.dataset.ciente, ci);
    });
    redesenharCaixas();
  }

  // ---------- Eventos ----------
  document.addEventListener('click', function (ev) {
    if (ev.target.closest('.modal-fundo')) return;
    const m = ev.target.closest('[data-modo]');
    if (m) { modo = m.dataset.modo === modo ? '' : m.dataset.modo; if (MODOS_INS[modo]) visao = 'INS'; desenhar(); return; }
    const vs = ev.target.closest('[data-visao]');
    if (vs) { visao = vs.dataset.visao; desenharTabela(); return; }
    if (ev.target.closest('#bSoFalta')) { soFalta = !soFalta; desenharTabela(); return; }
    const ins = ev.target.closest('[data-ins]');
    if (ins) {
      // celular ou visão por OP: janela com as OPs; por insumo no PC: abre a linha
      if (ins.closest('#lista-tab') || visao === 'OP') { verOPs(ins.dataset.ins); return; }
      abertos[ins.dataset.ins] = !abertos[ins.dataset.ins];
      desenharTabela();
      return;
    }
    const cx = ev.target.closest('[data-caixas]');
    if (cx) abrirCaixas(cx.dataset.caixas);
  });
  $('#fCat').addEventListener('change', function () { carregar(); });
  $('#fOrd').addEventListener('change', function () { desenharTabela(); });

  // ✔ Ciente: grava a data de uso que a pessoa está vendo agora.
  // Se o PCP mudar o prazo depois, a data muda e a caixa volta a piscar.
  async function darCiente(id, bt) {
    const s = painel.solicitacoes.find(function (x) { return x.id_solicitacao === id; });
    if (!s) return false;
    const u = usoDe(s);
    if (bt) bt.disabled = true;
    try {
      await Api.chamar('cienteSolicitacao', { id_solicitacao: s.id_solicitacao, data_uso: u ? dataBR(u) : '' });
      Ui.toast(s.cod_insumo + ' · OP ' + s.op + ' · vai usar em ' + (u ? dataBR(u) : '—') + '.', 'ok', 'Ciente');
      await carregar(true);
      return true;
    } catch (err) {
      Ui.erro(err);
      if (bt) bt.disabled = false;
      return false;
    }
  }

  // ---------- Relatório de compras: imprimir e Excel ----------
  // Sai o que está na tela: o filtro do card (Ruptura / Abaixo do mínimo),
  // a categoria e a ordem escolhidas. Sem filtro, sai a categoria inteira.
  function linhasRelatorio() {
    return insumosFiltrados().map(function (i) {
      return { cod: i.cod_insumo, desc: i.descricao, cat: i.categoria, un: String(i.unidade || ''), saldo: i.saldo, sair: i.vai_sair,
        proj: i.projetado, min: i.minimo, lead: i.lead_time, sit: i.situacao || '', comprar: i.sugerido > 0 ? i.sugerido : 0,
        pq: (porQue(i) || { txt: '' }).txt };
    });
  }
  function tituloRelatorio() {
    return visao === 'OP' ? 'O QUE COMPRAR — POR OP' : 'O QUE COMPRAR — POR INSUMO';
  }
  // Linha com os filtros usados (vai no topo da impressão)
  function filtrosTexto() {
    const f = ['Visão: ' + (visao === 'OP' ? 'Por OP' : 'Por insumo'), 'Categoria: ' + NOME_CAT[$('#fCat').value],
      'Só o que falta: ' + (soFalta && !MODOS_INS[modo] ? 'sim' : 'não')];
    if (MODOS_INS[modo]) f.push('Filtro do card: ' + ROTULO[modo]);
    if (visao === 'INS') f.push('Ordem: ' + ($('#fOrd').value === 'cod' ? 'código' : 'precisa comprar primeiro'));
    return f.join(' · ');
  }
  document.addEventListener('click', function (ev) {
    if (ev.target.closest('[data-imprimir-compras]')) imprimirCompras();
    if (ev.target.closest('[data-excel-compras]')) baixarExcel();
  });

  function imprimirCompras() {
    const l = visao === 'OP' ? [] : linhasRelatorio();
    const lop = visao === 'OP' ? linhasPorOP() : [];
    if (!l.length && !lop.length) { Ui.toast('Nada neste filtro para imprimir.', 'aviso'); return; }
    const aComprar = l.filter(function (r) { return r.comprar > 0; }).length;
    const w = window.open('');
    if (!w) { Ui.toast('O navegador bloqueou a janela de impressão. Libere pop-ups para este site.', 'erro'); return; }
    const corLinha = function (r) { return r.sit === 'RUPTURA' ? ' style="background:#fde2e2"' : r.comprar > 0 ? ' style="background:#fff4d6"' : ''; };
    w.document.write(`<html><head><title>${e(tituloRelatorio())}</title>
<style>
  body{font-family:Arial;padding:20px;color:#111}
  h2{font-size:16px;margin-bottom:2px}
  .sub{font-size:10px;color:#555;margin-bottom:4px}
  .flt{font-size:10.5px;margin-bottom:14px;padding:5px 8px;background:#f3f4f6;border:1px solid #ddd;border-radius:4px;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  table{width:100%;border-collapse:collapse}
  th,td{border:1px solid #ccc;padding:4px 6px;font-size:10px;text-align:left}
  th{background:#efefef} td.n{text-align:right} td.c{text-align:right;font-weight:bold}
  tr{-webkit-print-color-adjust:exact;print-color-adjust:exact}
</style></head><body>
  <h2>${e(tituloRelatorio())}</h2>
  <div class="flt"><b>Filtros:</b> ${e(filtrosTexto())}</div>
  <div class="sub">Emitido em: ${new Date().toLocaleString('pt-BR')} &nbsp;|&nbsp; ${visao === 'OP' ? lop.length + ' linhas (OP + insumo)' : l.length + ' insumos &nbsp;|&nbsp; ' + aComprar + ' para comprar'} &nbsp;|&nbsp; sobra/falta = saldo − o que as OPs abertas vão consumir</div>
  ${visao === 'OP' ? porOPHtml(lop) : `<table><thead><tr><th>CÓDIGO</th><th>DESCRIÇÃO</th><th>CATEGORIA</th><th>UN.</th><th>TEM</th><th>VAI USAR</th><th>SOBRA/FALTA</th><th>MÍNIMO</th><th>LEAD (DIAS)</th><th>COMPRAR</th><th>POR QUÊ</th></tr></thead>
  <tbody>${l.map(function (r) {
    return '<tr' + corLinha(r) + '><td><b>' + e(r.cod) + '</b></td><td>' + e(r.desc) + '</td><td>' + e(r.cat) + '</td><td>' + e(r.un) + '</td>' +
      '<td class="n">' + Fmt.num(r.saldo) + '</td><td class="n">' + Fmt.num(r.sair) + '</td><td class="n">' + Fmt.num(r.proj) + '</td>' +
      '<td class="n">' + Fmt.num(r.min) + '</td><td class="n">' + Fmt.num(r.lead) + '</td>' +
      '<td class="c">' + (r.comprar > 0 ? Fmt.num(r.comprar) : '—') + '</td><td>' + e(r.pq) + '</td></tr>';
  }).join('')}</tbody></table>`}
  <script>window.onload=()=>window.print();<\/script></body></html>`);
    w.document.close();
  }

  // Caixas: impressas pelo botão Imprimir do pop-up (com o filtro do pop-up)
  function imprimirCaixas() {
    const f = cxAberta ? cxAberta.filtro : '';
    const html = caixasHtml(f);
    if (!html) { Ui.toast('Nenhuma caixa neste filtro.', 'aviso'); return; }
    const w = window.open('');
    if (!w) { Ui.toast('O navegador bloqueou a janela de impressão. Libere pop-ups para este site.', 'erro'); return; }
    const nomeF = (FILTROS_CX.find(function (x) { return x.f === f; }) || {}).t || '';
    w.document.write('<html><head><title>CAIXAS (EMBALAGEM)</title><style>body{font-family:Arial;padding:20px;color:#111}h2{font-size:16px;margin:0 0 4px}' +
      '.flt{font-size:10.5px;margin-bottom:14px;padding:5px 8px;background:#f3f4f6;border:1px solid #ddd;border-radius:4px}table{width:100%;border-collapse:collapse}' +
      'th,td{border:1px solid #ccc;padding:4px 6px;font-size:10px;text-align:left}th{background:#efefef}td.n{text-align:right}tr,.flt{-webkit-print-color-adjust:exact;print-color-adjust:exact}</style></head><body>' +
      html.replace('<h2 style="margin-top:22px">CAIXAS (EMBALAGEM) EM ABERTO</h2>', '<h2>CAIXAS (EMBALAGEM)</h2><div class="flt"><b>Filtros:</b> ' + e(nomeF) + ' · emitido em ' + new Date().toLocaleString('pt-BR') + '</div>') +
      '<script>window.onload=()=>window.print();<\/script></body></html>');
    w.document.close();
  }
  function linhasCaixas(f) {
    return (f ? solicitacoesFiltradas(f) : painel.solicitacoes.filter(aberta)).slice().sort(function (a, b) { return (comprarAteDe(a) || 0) - (comprarAteDe(b) || 0); }).map(function (s) {
      const u = usoDe(s), c = comprarAteDe(s);
      return { op: s.op, cliente: s.cliente, cod: s.cod_insumo, desc: s.descricao, qtd: s.qtd, un: String(s.unidade || ''),
        uso: u ? dataBR(u) : '', ate: c ? dataBR(c) : '', ciente: semCiente(s) ? (dataMudou(s) ? 'DATA MUDOU' : 'SEM CIENTE') : 'CIENTE · ' + (s.ciente_por || ''), sem: semCiente(s) };
    });
  }
  function caixasHtml(f) {
    const l = linhasCaixas(f);
    if (!l.length) return '';
    return '<h2 style="margin-top:22px">CAIXAS (EMBALAGEM) EM ABERTO</h2><table><thead><tr><th>COMPRAR ATÉ</th><th>VAI USAR EM</th><th>OP</th><th>CLIENTE</th><th>INSUMO</th><th>DESCRIÇÃO</th><th>QTD</th><th>CIENTE</th></tr></thead><tbody>' +
      l.map(function (r) {
        return '<tr' + (r.sem ? ' style="background:#fff4d6"' : '') + '><td><b>' + e(r.ate) + '</b></td><td>' + e(r.uso) + '</td><td><b>' + e(r.op) + '</b></td><td>' + e(r.cliente) + '</td><td>' + e(r.cod) + '</td><td>' + e(r.desc) + '</td>' +
          '<td class="n">' + Fmt.num(r.qtd) + ' ' + e(r.un.toLowerCase()) + '</td><td>' + e(r.ciente) + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  // Por OP no relatório impresso
  function porOPHtml(l) {
    return '<table><thead><tr><th>OP</th><th>CLIENTE</th><th>PROCESSO</th><th>INSUMO</th><th>DESCRIÇÃO</th><th>PRECISA</th><th>TEM</th><th>FALTA</th></tr></thead><tbody>' +
      l.map(function (x) {
        const a = x.a, it = x.it;
        return '<tr' + (it.faltam > 0 ? ' style="background:#fde2e2"' : '') + '><td><b>' + (x.ini ? e(a.op) : '') + '</b></td><td>' + (x.ini ? e(a.cliente) : '') + '</td><td>' + (x.ini ? e(a.processo) : '') + '</td><td>' + e(it.cod) + '</td><td>' + e(it.desc) + '</td>' +
          '<td class="n">' + Fmt.num(it.precisa) + '</td><td class="n">' + Fmt.num(it.tem) + '</td><td class="c">' + (it.faltam > 0 ? Fmt.num(it.faltam) : 'ok') + '</td></tr>';
      }).join('') + '</tbody></table>';
  }

  // Excel: biblioteca SheetJS, carregada só quando o botão é usado.
  function carregarSheetJS() {
    if (window.XLSX) return Promise.resolve();
    return new Promise(function (ok, falha) {
      const sc = document.createElement('script');
      sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      sc.onload = ok; sc.onerror = function () { falha(new Error('Não foi possível carregar o gerador de Excel (sem internet?).')); };
      document.head.appendChild(sc);
    });
  }
  async function baixarExcel() {
    // Duas abas (Por insumo e Por OP) com o filtro "só o que falta" da tela;
    // a aba da visão aberta vem primeiro. Mais a aba das caixas.
    const l = linhasRelatorio();
    const av = [];
    linhasPorOP().forEach(function (x) {
      av.push({ 'OP': x.a.op, 'Cliente': x.a.cliente, 'Processo': x.a.processo, 'Insumo': x.it.cod, 'Descrição': x.it.desc, 'Precisa': x.it.precisa, 'Tem': x.it.tem, 'Falta': x.it.faltam });
    });
    if (!l.length && !av.length && !linhasCaixas().length) { Ui.toast('Nada neste filtro para exportar.', 'aviso'); return; }
    try {
      await carregarSheetJS();
      const wb = XLSX.utils.book_new();
      const abaInsumo = function () {
        const ws = XLSX.utils.json_to_sheet(l.map(function (r) {
          return { 'Código': r.cod, 'Descrição': r.desc, 'Categoria': r.cat, 'Unidade': r.un, 'Tem': r.saldo, 'Vai usar (OPs)': r.sair,
            'Sobra/falta': r.proj, 'Mínimo': r.min, 'Lead (dias)': r.lead, 'Comprar': r.comprar, 'Por quê': r.pq };
        }));
        ws['!cols'] = [12, 42, 12, 8, 10, 12, 11, 10, 11, 10, 16].map(function (c) { return { wch: c }; });
        XLSX.utils.book_append_sheet(wb, ws, 'Por insumo');
      };
      const abaOP = function () {
        if (!av.length) return;
        const ws2 = XLSX.utils.json_to_sheet(av);
        ws2['!cols'] = [8, 30, 16, 12, 40, 10, 10, 10].map(function (c) { return { wch: c }; });
        XLSX.utils.book_append_sheet(wb, ws2, 'Por OP');
      };
      if (visao === 'OP') { abaOP(); abaInsumo(); } else { abaInsumo(); abaOP(); }
      const cx = linhasCaixas().map(function (r) {
        return { 'Comprar até': r.ate, 'Vai usar em': r.uso, 'OP': r.op, 'Cliente': r.cliente, 'Insumo': r.cod, 'Descrição': r.desc, 'Qtd': r.qtd, 'Unidade': r.un, 'Ciente': r.ciente };
      });
      if (cx.length) {
        const ws3 = XLSX.utils.json_to_sheet(cx);
        ws3['!cols'] = [12, 12, 8, 28, 12, 40, 8, 8, 24].map(function (c) { return { wch: c }; });
        XLSX.utils.book_append_sheet(wb, ws3, 'Caixas');
      }
      const hoje = new Date();
      const nome = 'compras_' + hoje.getFullYear() + String(hoje.getMonth() + 1).padStart(2, '0') + String(hoje.getDate()).padStart(2, '0') + '.xlsx';
      XLSX.writeFile(wb, nome);
      Ui.toast('Planilha gerada · ' + nome, 'ok', 'Excel');
    } catch (err) { Ui.erro(err); }
  }

  // ---------- OPs que vão consumir o insumo ----------
  function verOPs(cod) {
    const i = painel.insumos.find(function (x) { return x.cod_insumo === cod; });
    if (!i) return;
    const corpo = (i.ops.length ? '<div class="ops-lista"><table class="tab"><thead><tr><th>OP</th><th>Cliente</th><th>Processo</th><th class="num">Falta retirar</th></tr></thead><tbody>' +
      i.ops.map(function (o) { return '<tr><td><b>' + e(o.op) + '</b></td><td>' + e(titulo(o.cliente)) + '</td><td>' + e(o.processo) + '</td><td class="num">' + n(o.falta) + '</td></tr>'; }).join('') +
      '</tbody></table></div>' : '<p class="mut" style="margin:0">Nenhuma OP aberta vai consumir este insumo (as que já passaram do processo de consumo saem da conta).</p>') +
      '<p style="margin:12px 0 0;font-size:12.5px">Saldo <b>' + n(i.saldo) + '</b> − vai sair <b>' + n(i.vai_sair) + '</b> = projetado <b' + (i.projetado < 0 ? ' class="neg"' : '') + '>' + n(i.projetado) + '</b> · mínimo ' + n(i.minimo) + ' · lead ' + n(i.lead_time) + ' dias' +
      (i.sugerido > 0 ? ' · <b style="color:var(--destaque)">comprar ' + n(i.sugerido) + ' ' + e(String(i.unidade || '').toLowerCase()) + '</b>' : '') + '</p>';
    Ui.janela({ titulo: i.cod_insumo + ' · ' + i.descricao, subtitulo: 'OPs abertas que ainda vão retirar este insumo', largura: 560, corpo: corpo, botoes: [{ texto: 'Fechar', valor: null }] });
  }

});
</script>
